
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynotic Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Outfit',sans-serif;
}

body{
  min-height:100vh;
  background:#f1f2f7;
  color:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.container{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:28px 22px;
  animation:pageIn .4s ease;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logo{
  width:58px;
  height:auto;
  object-fit:contain;
  display:block;
  margin:0 auto 18px;
}

h2{
  font-size:22px;
  font-weight:700;
  text-align:center;
  color:#171717;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-bottom:26px;
}

.field{
  margin-bottom:15px;
  position:relative;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#444;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid #e5e5ea;
  border-radius:11px;
  outline:none;
  font-size:14px;
  color:#222;
  background:#fff;
  transition:.2s;
}

.field input::placeholder{
  color:#aaa;
}

.field input:focus{
  border-color:#222;
  box-shadow:0 0 0 3px rgba(0,0,0,.04);
}

.password-input{
  padding-right:46px!important;
}

.toggle{
  position:absolute;
  right:14px;
  bottom:14px;
  color:#888;
  cursor:pointer;
  font-size:15px;
  padding:3px;
}

.toggle:hover{
  color:#111;
}

button{
  width:100%;
  height:49px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin-top:8px;
  transition:.2s;
}

button:hover{
  background:#292929;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#error{
  color:#e53e3e;
  font-size:13px;
  text-align:center;
  min-height:18px;
  margin-top:13px;
}

.footer{
  text-align:center;
  font-size:12px;
  color:#999;
  margin-top:20px;
}

#toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) translateY(-10px);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-size:13px;
  font-weight:500;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:9999;
}

.loader{
  position:fixed;
  inset:0;
  background:rgba(241,242,247,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:14px;
  font-weight:600;
  color:#222;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:9998;
}

.loader.active{
  opacity:1;
  pointer-events:auto;
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.fade-out{
  animation:fadeOut .4s ease forwards;
}

@keyframes fadeOut{
  to{
    opacity:0;
    transform:translateY(10px);
  }
}

@media(max-width:360px){
  .container{
    padding:24px 18px;
  }
}
</style>
</head>

<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <span>Sending registration...</span>
</div>

<div id="toast"></div>

<div class="container" id="card">

  <img src="../assets/dynotic-distribution.png" class="logo" alt="Dynotic">

  <h2>Registration</h2>
  <p class="subtitle">Create your Dynotic Distribution account</p>

  <div class="field">
    <label for="fullname">Full Name</label>
    <input id="fullname" type="text" placeholder="Enter your full name">
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <input id="email" type="email" placeholder="Enter your email">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" class="password-input" type="password" placeholder="Create a password">
    <div class="toggle" id="eye" tabindex="0" role="button" aria-label="Show password" onclick="togglePass()">
      <i class="fa-regular fa-eye"></i>
    </div>
  </div>

  <div class="field">
    <label for="youtube">YouTube</label>
    <input id="youtube" type="text" placeholder="https://youtube.com/@username">
  </div>

  <div class="field">
    <label for="instagram">Instagram</label>
    <input id="instagram" type="text" placeholder="https://instagram.com/username">
  </div>

  <button id="registerBtn" onclick="register()">Register</button>

  <div id="error"></div>

  <div class="footer">
    Dynotic Distribution
  </div>

</div>
  
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  
<script>
// FIREBASE CONFIGURATION
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
    authDomain: "dynopay-2513c.firebaseapp.com",
    databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
  });
}

const auth = firebase.auth();
const db = firebase.database();

function isURL(url,type){
  if(!url) return false;

  let pattern;

  if(type==="youtube"){
    pattern=/^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+$/;
  }else if(type==="instagram"){
    pattern=/^(https?:\/\/)?(www\.)?instagram\.com\/.+$/;
  }else{
    pattern=/^(https?:\/\/)?([\w-]+\.)+[\w-]{2,}\/?.*$/;
  }

  return pattern.test(url);
}

function togglePass(){
  const p=document.getElementById("password");
  const eye=document.getElementById("eye");

  if(p.type==="password"){
    p.type="text";
    eye.innerHTML='<i class="fa-regular fa-eye-slash"></i>';
    eye.setAttribute("aria-label","Hide password");
  }else{
    p.type="password";
    eye.innerHTML='<i class="fa-regular fa-eye"></i>';
    eye.setAttribute("aria-label","Show password");
  }
}

function showToast(message){
  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.style.opacity="1";
  toast.style.transform="translateX(-50%) translateY(0)";

  setTimeout(()=>{
    toast.style.opacity="0";
    toast.style.transform="translateX(-50%) translateY(-10px)";
  },3000);
}

function setLoading(active){
  document.getElementById("loader").classList.toggle("active",active);

  const btn=document.getElementById("registerBtn");
  btn.disabled=active;
  btn.textContent=active?"Sending...":"Register";
}

async function register(){

  const fullname = document.getElementById("fullname").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const youtube = document.getElementById("youtube").value.trim();
  const instagram = document.getElementById("instagram").value.trim();

  const errorEl = document.getElementById("error");

  errorEl.textContent = "";

  const inputs = ["fullname","email","password","youtube","instagram"];

  inputs.forEach(id => {
    document.getElementById(id).style.border = "1px solid #e5e5ea";
  });

  let hasError = false;

  inputs.forEach(id => {
    const input = document.getElementById(id);

    if(!input.value.trim()){
      input.style.border = "1px solid #e53e3e";
      hasError = true;
    }
  });

  if(hasError){
    errorEl.textContent = "Please fill in all required fields";
    return;
  }

  if(password.length < 6){
    document.getElementById("password").style.border = "1px solid #e53e3e";
    errorEl.textContent = "Password must be at least 6 characters";
    return;
  }

  if(!isURL(youtube,"youtube")){
    document.getElementById("youtube").style.border = "1px solid #e53e3e";
    errorEl.textContent = "Please enter a valid YouTube URL";
    return;
  }

  if(!isURL(instagram,"instagram")){
    document.getElementById("instagram").style.border = "1px solid #e53e3e";
    errorEl.textContent = "Please enter a valid Instagram URL";
    return;
  }

  setLoading(true);

  try {

    // Buat akun Firebase Authentication
    const credential = await auth.createUserWithEmailAndPassword(
      email,
      password
    );

    const user = credential.user;

    // Simpan informasi profil ke Realtime Database
    await db.ref("users/" + user.uid).set({
  uid: user.uid,
  nama: fullname,
  email: email,
  youtube: youtube,
  instagram: instagram,
  emailVerified: false,
  status: "unverified",
  timestamp: new Date().toISOString()
});

    // Kirim email verifikasi Firebase
    await user.sendEmailVerification();

    // Simpan email untuk halaman success
sessionStorage.setItem("registrationEmail", email);

// Jangan signOut dulu agar halaman success bisa mengecek verifikasi
window.location.href = "../success";

  } catch(error) {

    console.error(error);

    let message = "Registration failed. Please try again.";

    if(error.code === "auth/email-already-in-use"){
      message = "This email is already registered.";
    }else if(error.code === "auth/invalid-email"){
      message = "Invalid email address.";
    }else if(error.code === "auth/weak-password"){
      message = "Password is too weak.";
    }else if(error.code === "auth/operation-not-allowed"){
      message = "Email registration is not enabled.";
    }

    errorEl.textContent = message;

    setLoading(false);
  }
}
</script>

</body>
</html>
