<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income | Dynotic Distribution</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: #f1f2f7;
      padding-top: 74px;
    }

    header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #eee;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    header img {
      height: 50px;
    }
td.action-cell{
  text-align: center;
  vertical-align: middle;
}

.action-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;

  background: #f5f6fa;
  border: 1px solid #e6e8ef;
  transition: 0.2s;
}

.action-btn:hover{
  background: #e9ecf5;
  transform: scale(1.02);
}

.action-btn img{
  width: 18px;
  height: 18px;
}
    /* Card Total & Withdraw */
    .card {
      width: 90%;
      margin: 16px auto;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      border: 1px solid #ececec;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card .balance {
      font-weight: 700;
      font-size: 16px;
    }

    .card button {
      padding: 8px 14px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    #invoiceBtn{
  padding:10px 16px;
  background:#111;
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}

#invoiceBtn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 15px rgba(0,0,0,.15);
}

#invoiceBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* INVOICE MODAL */
.invoice-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(6px);
  z-index:2000;
  align-items:center;
  justify-content:center;
}

.invoice-card{
  width:90%;
  max-width:420px;
  background:#fff;
  padding:22px;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.invoice-card h3{
  margin-bottom:18px;
}

.invoice-info{
  background:#f5f6fa;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
}

.invoice-card label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.invoice-card input{
  width:100%;
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  font-size:14px;
  margin-bottom:5px;
}

.invoice-card input:focus{
  border-color:#111;
}

.invoice-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.invoice-buttons button{
  flex:1;
  padding:11px;
  border:none;
  border-radius:11px;
  font-weight:600;
  cursor:pointer;
}

.invoice-submit{
  background:#111;
  color:#fff;
}

.invoice-cancel{
  background:#f1f2f7;
  color:#111;
}

.invoice-error{
  color:#dc2626;
  font-size:12px;
  margin-top:5px;
  display:none;
}
.download-icon {
  height: 28px; /* atau 28px */
  cursor: pointer;
}
.table-wrapper{
  width:95%;
  max-width:1200px;
  margin:16px auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
  padding:10px;
}

.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling: touch;
}

table{
  width:100%;
  min-width:800px;
  border-collapse:collapse;
}

th, td{
  white-space: nowrap;
}
    /* Table (hidden for normal users) */
    .table-card {
  display: block; /* tampilkan tabel untuk user */
  width: 90%;
  margin: 16px auto;
      background: #fff;
      border-radius: 18px;
      padding: 0;
      border: 1px solid #ececec;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .05);
    }

   .table-card table {
  width: 100%;
  border-collapse: separate; /* ubah dari collapse */
  border-spacing: 0;
}

/* ROW */
.table-card tr {
  transition: 0.2s;
}

.table-card tr:hover {
  background: #f9fafb;
}

/* CELL */
.table-card th,
.table-card td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid #eee;
  font-size: 14px;
  vertical-align: middle;
}

.table-card th {
  background: #f9f9f9;
  font-weight: 600;
}

/* BUTTON */
.table-card td button {
  padding: 6px 10px;
  background: #667eea;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}

.table-card td button:hover {
  filter: brightness(0.9);
}

/* STATUS BADGE */
.status {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  display: inline-block;
}

.status.accepted {
  background: #dcfce7;
  color: #166534;
}

.status.paid {
  background: #dbeafe;
  color: #1e40af;
}

.status.pending {
  background: #fef3c7;
  color: #92400e;
}

  </style>
</head>
<body>

  <header>
    <img src="../assets/dynotic-distribution.png" alt="DynoPay">
  </header>

  <!-- Card Total + Withdraw -->
<div class="card">
  <div class="balance" id="totalBalance">Total: Rp 0</div>

  <button id="invoiceBtn" onclick="openInvoiceModal()">
    Ajukan Invoice
  </button>
</div>

  <!-- Table Income (Hidden for admin) -->
  <div class="table-card">
  <div class="table-wrapper">
    <div class="table-scroll">

      <table>
        <thead>
          <tr>
            <th>REPORT</th>
            <th>PERIOD</th>
            <th>GENERATED</th>
            <th>VALUE</th>
            <th>STATUS</th>
            <th>ACTION</th>
          </tr>
        </thead>

        <tbody id="incomeList">
          <!-- Data Firebase -->
        </tbody>

      </table>

    </div>
  </div>
</div>
<!-- AJUKAN INVOICE MODAL -->
<div class="invoice-modal" id="invoiceModal">

  <div class="invoice-card">

    <h3>Ajukan Invoice</h3>

    <div class="invoice-info">
      <small>Saldo tersedia</small>
      <div id="invoiceBalance"
           style="font-size:18px;font-weight:700;margin-top:4px;">
        Rp 0
      </div>
    </div>

    <label for="invoiceAmount">
      Jumlah Invoice
    </label>

    <input
      type="number"
      id="invoiceAmount"
      placeholder="Minimal Rp 100.000"
      min="100000"
    >

    <div class="invoice-error" id="invoiceError"></div>

    <div class="invoice-buttons">
      <button
        class="invoice-cancel"
        onclick="closeInvoiceModal()">
        Batal
      </button>

      <button
        class="invoice-submit"
        onclick="submitInvoice()">
        Ajukan Invoice
      </button>
    </div>

  </div>

</div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
      authDomain: "dynopay-2513c.firebaseapp.com",
      databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
    });

    const db = firebase.database();
const MIN_INVOICE = 100000;

let currentSaldo = 0;
let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
  if (!user) window.location.href = "../login";
  else {
    const uid = user.uid;

    // Ambil saldo
    db.ref("users/" + uid + "/saldo").once("value").then(snap => {
  currentSaldo = Number(snap.val() || 0);
  currentUser = user;

  document.getElementById("totalBalance").innerText =
    "Total: Rp " + currentSaldo.toLocaleString("id-ID");

  // Tombol invoice hanya aktif jika saldo >= Rp100.000
  const invoiceBtn = document.getElementById("invoiceBtn");

  if (currentSaldo < MIN_INVOICE) {
    invoiceBtn.disabled = true;
    invoiceBtn.title = "Saldo minimum Rp100.000";
  } else {
    invoiceBtn.disabled = false;
  }
});
    // Panggil loadIncome
    loadIncome(uid, user.email);
  }
});

// Fungsi loadIncome di sini, di luar auth
function loadIncome(uid, email) {
  const incomeList = document.getElementById("incomeList");
  incomeList.innerHTML = "";

  db.ref("royalties").once("value").then(snap => {
    if (!snap.exists()) {
      incomeList.innerHTML = `<tr><td colspan="6">Belum ada laporan</td></tr>`;
      return;
    }

    let rows = "";

    let dataArray = [];

snap.forEach(item => {
  const val = item.val();

  // 🔥 FILTER DI SINI (lebih efisien & rapi)
  if ((val.uid && val.uid === uid) || (val.email && val.email === email)) {
    dataArray.push({
      key: item.key,
      ...val
    });
  }
});

// 🔥 terbaru di atas
dataArray.sort((a, b) => b.key.localeCompare(a.key));

dataArray.forEach(d => {
  const key = d.key;

  let statusText = "";
  let icon = "";

  if (d.type === "Sales Report") {
    statusText = "Accepted";
    icon = "../assets/report.png";
  } else if (d.type === "Payment") {
    statusText = "Paid";
    icon = "../assets/invoice.png";
  } else {
    statusText = "Pending";
  }

  rows += `
<tr>
  <td>${d.type || "-"}</td>
  <td>${d.period || "-"}</td>
  <td>${d.date || "-"}</td>
  <td>Rp ${Number(d.value || 0).toLocaleString("id-ID")}</td>
  <td>
    <span class="status ${
      statusText === "Accepted" ? "accepted" :
      statusText === "Paid" ? "paid" : "pending"
    }">
      ${statusText}
    </span>
  </td>
  
<td class="action-cell">
  ${
    d.type === "Payment"
      ? `<div class="action-btn" onclick="window.open('../invoice?id=${key}','_blank')">
           <img src="../assets/invoice.png">
           My Invoice
         </div>`
      : d.type === "Sales Report" && d.downloadUrl
        ? `<div class="action-btn" onclick="downloadFile('${d.downloadUrl}')">
             <img src="../assets/report.png">
             Report
           </div>`
        : '-'
  }
</td>
</tr>
`;
});

    incomeList.innerHTML = rows;
  });
}
  function submitInvoice(){

  const amount = Number(
    document.getElementById("invoiceAmount").value
  );

  const error = document.getElementById("invoiceError");

  error.style.display = "none";

  // Cek user
  if(!currentUser){
    error.innerText = "Akun belum siap. Silakan refresh halaman.";
    error.style.display = "block";
    return;
  }

  // Validasi minimum
  if(!amount || amount < MIN_INVOICE){
    error.innerText = "Jumlah invoice minimal Rp100.000.";
    error.style.display = "block";
    return;
  }

  // Tidak boleh lebih besar dari saldo
  if(amount > currentSaldo){
    error.innerText = "Jumlah invoice melebihi saldo tersedia.";
    error.style.display = "block";
    return;
  }

  // Cek invoice Pending milik user
  db.ref("invoice_requests")
    .orderByChild("uid")
    .equalTo(currentUser.uid)
    .once("value")
    .then(snap => {

      let hasPending = false;

      snap.forEach(item => {
        const data = item.val();

        if(data.status === "Pending"){
          hasPending = true;
        }
      });

      // Masih ada invoice pending
      if(hasPending){
        error.innerText =
          "Anda masih memiliki pengajuan invoice yang sedang diproses. Silakan tunggu hingga selesai.";

        error.style.display = "block";
        return;
      }

      // Buat invoice request
      const requestData = {
        uid: currentUser.uid,
        email: currentUser.email,
        amount: amount,
        status: "Pending",
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };

      return db.ref("invoice_requests").push(requestData);

    })
    .then(result => {

      // Kalau sebelumnya ditolak karena pending,
      // result tidak akan ada
      if(!result) return;

      alert(
        "Pengajuan invoice berhasil dikirim.\n\n" +
        "Jumlah: Rp " +
        amount.toLocaleString("id-ID")
      );

      closeInvoiceModal();

    })
    .catch(err => {

      console.error(err);

      error.innerText =
        "Gagal mengajukan invoice. Silakan coba lagi.";

      error.style.display = "block";
    });
} 

function downloadFile(url){
  const a = document.createElement("a");
  a.href = url;
  a.download = "";
  a.target = "_blank";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
  </script>
</body>
</html>
