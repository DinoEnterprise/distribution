<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create New Release | Dynotic Distribution</title>

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-iphone.png">

<meta name="theme-color" content="#667eea">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  color:#17181c;
  min-height:100vh;
  padding-top:64px;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* HEADER */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

header img{
  height:32px;
  width:auto;
  object-fit:contain;
  display:block;
}

/* CONTAINER */

.container{
  max-width:760px;
  margin:auto;
  padding:22px 14px 20px;
}

.page-title{
  margin-bottom:18px;
}

.page-title h1{
  font-size:22px;
  font-weight:700;
}

.page-title p{
  color:#777b84;
  font-size:12px;
  margin-top:3px;
}

/* MAIN CARD */

.release-card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  animation:pageIn .45s ease both;
}

.card-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:14px;
}

/* RELEASE OPTION */

.release-option{
  display:flex;
  align-items:flex-start;
  gap:13px;
  width:100%;
  padding:15px;
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:15px;
  cursor:pointer;
  transition:.15s;
}

.release-option + .release-option{
  margin-top:10px;
}

.release-option:hover{
  background:#fafaff;
  border-color:#dfe2f2;
}

.release-option:active{
  transform:scale(.98);
}

/* ICON */

.release-icon{
  width:42px;
  height:42px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.release-icon img{
  width:23px;
  height:23px;
  object-fit:contain;
}

/* TEXT */

.release-content{
  flex:1;
  min-width:0;
}

.release-text-title{
  font-size:14px;
  font-weight:600;
  color:#17181c;
  line-height:1.3;
}

.release-text-desc{
  font-size:11.5px;
  color:#858891;
  margin-top:4px;
  line-height:1.45;
}

/* ARROW */

.release-arrow{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a0a2a8;
  font-size:11px;
  flex-shrink:0;
  margin-top:7px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#fff;
  border-top:1px solid #e6e6eb;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  width:33.33%;
  text-align:center;
  color:#999ca4;
  font-size:11px;
  padding:7px 14px;
  border-radius:12px;
  cursor:pointer;
  transition:.15s;
}

.nav-item i{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.nav-item:active{
  transform:scale(.94);
}

.nav-item.active{
  color:#17181c;
  font-weight:600;
}

.nav-item.active::after{
  content:"";
  display:block;
  width:28px;
  height:3px;
  border-radius:999px;
  background:#111;
  margin:5px auto 0;
}

/* ANIMATION */

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(min-width:700px){

  .container{
    padding-left:0;
    padding-right:0;
  }

}

</style>
</head>

<body>

<header>
  <img src="../assets/dynotic-distribution.png" alt="Dynotic Distribution">
</header>


<main class="container">

  <div class="page-title">
    <h1>Create New Release</h1>
    <p>Choose the type of music you want to distribute.</p>
  </div>


  <div class="release-card">

    <div class="card-title">
      Choose Release Type
    </div>


    <!-- COVER ASSET -->

    <div
      class="release-option"
      onclick="goCoverAsset()"
    >

      <div class="release-icon">
        <img
          src="../assets/icon-cover.png"
          alt="Cover Asset"
        >
      </div>

      <div class="release-content">

        <div class="release-text-title">
          Cover Asset
        </div>

        <div class="release-text-desc">
          Publish covers, remixes, or licensed versions of existing songs.
        </div>

      </div>

      <div class="release-arrow">
        <i class="fa-solid fa-chevron-right"></i>
      </div>

    </div>


    <!-- ORIGINAL ASSET -->

    <div
      class="release-option"
      onclick="goOriginalAsset()"
    >

      <div class="release-icon">
        <img
          src="../assets/icon-original.png"
          alt="Original Asset"
        >
      </div>

      <div class="release-content">

        <div class="release-text-title">
          Original Asset
        </div>

        <div class="release-text-desc">
          Publish music you created from scratch and fully own.
        </div>

      </div>

      <div class="release-arrow">
        <i class="fa-solid fa-chevron-right"></i>
      </div>

    </div>

  </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div
    class="nav-item"
    onclick="homeClick()"
  >
    <i class="fa-solid fa-house"></i>
    Home
  </div>


  <div
    class="nav-item active"
    onclick="releasesClick()"
  >
    <i class="fa-solid fa-music"></i>
    Releases
  </div>


  <div
    class="nav-item"
    onclick="accountClick()"
  >
    <i class="fa-regular fa-user"></i>
    Account
  </div>

</nav>


<script>

firebase.initializeApp({

  apiKey:"AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:"dynopay-2513c.firebaseapp.com",

  databaseURL:
  "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});

const db = firebase.database();

  if(!user){

    location.href="../login";

    return;

  }

function releasesClick(){

  // Halaman saat ini

}


function accountClick(){

  location.href="../account";

}


function homeClick(){

  location.href="../home";

}


function goCoverAsset(){

  location.href="../cover-licence";

}


function goOriginalAsset(){

  location.href="../original-asset";

}

</script>

</body>
</html>
