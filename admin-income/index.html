<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royalty Report | Dynotic Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;}
body{background:#f1f2f7;padding:80px 20px 20px;}
header{position:fixed;top:0;left:0;width:100%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);display:flex;align-items:center;padding:16px 20px;z-index:1000;border-bottom:1px solid #eee;}
header h1{font-size:18px;font-weight:600;}
header #adminName{margin-left:auto;font-size:14px;color:#555;}
form{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:24px;}
form label{font-size:14px;margin-top:12px;display:block;color:#333;}
form input, form select{padding:10px 14px;margin-top:6px;width:100%;border:1px solid #ccc;border-radius:8px;font-size:14px;}
form button{margin-top:16px;padding:10px 16px;background:#111;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;transition:0.2s;}
form button:hover{filter:brightness(0.9);}
.status{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.status.report{
  background:#dcfce7;
  color:#166534;
}

.status.payment{
  background:#dbeafe;
  color:#1e40af;
}
  /* =========================
   CUSTOM MEMBER SEARCH
========================= */

.member-picker{
  position:relative;
  width:100%;
}

.member-input-wrap{
  position:relative;
}

#memberSearch{
  width:100%;
  padding:11px 42px 11px 14px;
  border:1px solid #d5d7df;
  border-radius:10px;
  font-size:14px;
  outline:none;
  background:#fff;
  transition:.2s;
}

#memberSearch:focus{
  border-color:#667eea;
  box-shadow:0 0 0 3px rgba(102,126,234,.10);
}

#memberSearch.selected{
  color:#111;
  font-weight:500;
}

.clear-member{
  display:none;
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:#999;
  font-size:20px;
  cursor:pointer;
  padding:0 5px;
}

.clear-member:hover{
  color:#111;
}

.member-dropdown{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  max-height:260px;
  overflow-y:auto;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
  z-index:100;
  padding:6px;
}

.member-dropdown.show{
  display:block;
}

.member-option{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border-radius:9px;
  cursor:pointer;
  transition:.15s;
}

.member-option:hover{
  background:#f4f5f9;
}

.member-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#eef0ff;
  color:#667eea;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:14px;
  flex-shrink:0;
}

.member-info{
  min-width:0;
}

.member-name{
  font-size:14px;
  font-weight:600;
  color:#222;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member-email{
  font-size:12px;
  color:#888;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member-empty{
  padding:20px;
  text-align:center;
  color:#999;
  font-size:13px;
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

tr{
  transition:0.2s;
}

tr:hover{
  background:#f9fafb;
}

td{
  vertical-align:middle;
}
thead{background:#f9f9f9;}
th, td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:14px;}
th{font-weight:600;}
td button{padding:6px 12px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;transition:0.2s;}
td button:hover{filter:brightness(0.9);}
#adminRoyaltyList tr:nth-child(even){background:#fafafa;}
#adminRoyaltyList td:last-child{text-align:center;}
</style>
</head>
<body>

<header>
  <h1>Admin Royalty Dashboard</h1>
  <span id="adminName">Admin</span>
</header>

<form id="royaltyForm">
  <label>Member</label>

<div class="member-picker" id="memberPicker">

  <div class="member-input-wrap">
    <input
      type="text"
      id="memberSearch"
      placeholder="Cari nama atau email..."
      autocomplete="off"
    >
    <button type="button" id="clearMember" class="clear-member">×</button>
  </div>

  <div class="member-dropdown" id="memberDropdown"></div>

  <input type="hidden" id="memberSelect" required>

</div>
  <label>Tanggal</label>
  <input type="date" id="date" required>

<label>Period</label>
<input type="text" id="period" placeholder="Contoh: Feb 2025" required>
  <label>Value</label>
  <input type="number" id="value" placeholder="Value (contoh: 450000)" required>

  <label>Type</label>
  <select id="reportType" required>
    <option value="">-- Pilih Type --</option>
    <option value="Sales Report">Sales Report</option>
    <option value="Payment">Payment</option>
  </select>

  <label>Link Download</label>
  <input type="text" id="downloadUrl" placeholder="Link GitHub/PDF">

  <button type="submit">Add Royalty</button>
</form>

<table>
  <thead>
    <tr>
<th>Users</th>
<th>Report</th>
<th>Period</th>
<th>Generated</th>
<th>Value</th>
<th>Status</th>
<th>Download</th>
    </tr>
  </thead>
  <tbody id="adminRoyaltyList">
    <tr><td colspan="7" style="text-align:center;color:#777">Memuat data...</td></tr>
  </tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
  authDomain: "dynopay-2513c.firebaseapp.com",
  databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = firebase.database();

firebase.auth().onAuthStateChanged(user=>{
  if(!user) window.location.href="../login";
  else {
    document.getElementById("adminName").innerText = user.email;
    loadMembers();
    loadAdminRoyalty();
  }
});

let allMembers = [];

function loadMembers(){

  db.ref("users").once("value").then(snap=>{

    const users = snap.val() || {};

    allMembers = Object.keys(users).map(uid => ({
      uid: uid,
      email: users[uid].email || "",
      nama: users[uid].nama || "Unknown"
    }));

    renderMemberDropdown(allMembers);
  });
}


function renderMemberDropdown(members){

  const dropdown = document.getElementById("memberDropdown");

  if(!members.length){

    dropdown.innerHTML = `
      <div class="member-empty">
        Member tidak ditemukan
      </div>
    `;

    return;
  }

  dropdown.innerHTML = members.map(user => {

    const initial = (user.nama || user.email || "?")
      .charAt(0)
      .toUpperCase();

    return `
      <div
        class="member-option"
        data-uid="${user.uid}"
        data-email="${user.email}"
        data-name="${user.nama}"
      >

        <div class="member-avatar">
          ${initial}
        </div>

        <div class="member-info">

          <div class="member-name">
            ${escapeHtml(user.nama)}
          </div>

          <div class="member-email">
            ${escapeHtml(user.email)}
          </div>

        </div>

      </div>
    `;

  }).join("");
}


function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


const memberSearch = document.getElementById("memberSearch");
const memberDropdown = document.getElementById("memberDropdown");
const clearMember = document.getElementById("clearMember");


memberSearch.addEventListener("focus", function(){

  memberDropdown.classList.add("show");

  if(!this.value){
    renderMemberDropdown(allMembers);
  }

});


memberSearch.addEventListener("input", function(){

  const keyword = this.value.toLowerCase().trim();

  // Kalau sedang mengetik ulang pilihan
  document.getElementById("memberSelect").value = "";

  clearMember.style.display = keyword ? "block" : "none";

  const filtered = allMembers.filter(user => {

    const name = String(user.nama || "").toLowerCase();
const email = String(user.email || "").toLowerCase();

    return name.includes(keyword) || email.includes(keyword);

  });

  renderMemberDropdown(filtered);
  memberDropdown.classList.add("show");

});


memberDropdown.addEventListener("click", function(e){

  const option = e.target.closest(".member-option");

  if(!option) return;

  const uid = option.dataset.uid;
  const email = option.dataset.email;
  const name = option.dataset.name;

  // Simpan UID ke hidden input
  document.getElementById("memberSelect").value = uid;

  // Tampilkan nama + email di input
  memberSearch.value = `${name} • ${email}`;

  memberSearch.classList.add("selected");

  clearMember.style.display = "block";

  memberDropdown.classList.remove("show");

});


clearMember.addEventListener("click", function(){

  memberSearch.value = "";

  memberSearch.classList.remove("selected");

  document.getElementById("memberSelect").value = "";

  clearMember.style.display = "none";

  memberSearch.focus();

  renderMemberDropdown(allMembers);

  memberDropdown.classList.add("show");

});


document.addEventListener("click", function(e){

  if(!document.getElementById("memberPicker").contains(e.target)){

    memberDropdown.classList.remove("show");

  }

});
function sendEmailByType(key, type){

  db.ref("royalties/" + key).once("value").then(snap=>{
    const d = snap.val();

    db.ref("users/" + d.uid).once("value").then(userSnap=>{
      const user = userSnap.val() || {};

      const email = user.email || d.email;
      const name = user.nama || "User";

      sendRoyaltyEmail(
        email,
        name,
        type,
        d.period,
        d.value
      );
    });
  });

}
function openEmailMenu(key){

  const choice = confirm(
    "Send Email?\n\nOK = Sales Report Email\nCancel = Payment Email"
  );

  if(choice){
    sendEmailByType(key, "Sales Report");
  } else {
    sendEmailByType(key, "Payment");
  }
}
function downloadFile(url){
  if(url && url.startsWith("http")) window.open(url,"_blank");
  else alert("Link download tidak valid");
}
function deleteRoyalty(key){
  if(confirm("Yakin mau hapus data ini?")){
    db.ref("royalties/"+key).remove()
      .then(()=> loadAdminRoyalty())
      .catch(err=> console.error("Gagal hapus:",err));
  }
}
function sendRoyaltyEmail(email, name, type, period, value){

  const dashboardLink = "https://dynotic.web.id/income";

  let subject = "";
  let body = "";

  if(type === "Sales Report"){
    subject = "Sales Report Available - Dynotic Distribution";

    body =
`Hello ${name},

Your Sales Report is now available.

Details:
• Type   : Sales Report
• Period : ${period}
• Status : Accepted

Minimum payout requirement:
• Rp 50.000

Note:
Earnings will be eligible for withdrawal once total balance reaches the minimum threshold.

View your report here:
${dashboardLink}

Best regards,
Risna Wati
Dynotic Distribution Team`;
  }

  else if(type === "Payment"){
    subject = "Payment Processed - Dynotic Distribution";

    body =
`Hello ${name},

Your payment has been successfully processed.

Details:
• Type   : Payment
• Period : ${period}
• Amount : Rp ${Number(value).toLocaleString("id-ID")}
• Status : Paid

Check your dashboard:
${dashboardLink}

Best regards,
Risna Wati
Dynotic Distribution`;
  }

  const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  window.open(mailtoLink, "_blank");
}
function loadAdminRoyalty(){
  const list = document.getElementById("adminRoyaltyList");
  list.innerHTML = `<tr><td colspan="7"
  style="text-align:center;color:#777">Memuat data...</td></tr>`;

  // preload semua users
  db.ref("users").once("value").then(userSnap=>{
    const users = userSnap.val() || {};

    // mapping email fallback
    const emailMap = {};
    Object.keys(users).forEach(uid=>{ emailMap[users[uid].email] = users[uid]; });

    db.ref("royalties").once("value").then(snap=>{
      if(!snap.exists()){
        list.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#777">Belum ada data</td></tr>`;
        return;
      }

      const rows = [];
      snap.forEach(item=>{
  const d = item.val();
  const key = item.key;
        // fallback: pakai UID dulu, kalau tidak ada pakai email
        let user = users[d.uid] || {};
        if(!user.email && d.email) user = emailMap[d.email] || {};

        rows.push(`
<tr>

<td class="user-cell">
  <div style="font-weight:600">
    ${user.nama || 'Unknown'}
  </div>
  <div style="font-size:12px;color:#888">
    ${user.email || d.email || '-'}
  </div>
</td>

<td>
  <span class="status ${d.type === 'Sales Report' ? 'report' : d.type === 'Payment' ? 'payment' : ''}">
    ${d.type}
  </span>
</td>

<td>${d.period || '-'}</td>

<td style="font-size:12px;color:#666">
${d.date ? new Date(d.date).toLocaleDateString("id-ID") : "-"}
</td>

<td style="font-weight:600;color:${d.value < 0 ? '#dc2626' : '#111'}">
  Rp ${Number(d.value || 0).toLocaleString("id-ID")}
</td>

<td>
  <span class="status ${d.type==='Payment' ? 'payment' : 'report'}">
    ${d.type === 'Payment' ? 'Paid' : 'Accepted'}
  </span>
</td>

<td>
  ${d.downloadUrl ? `<button onclick="downloadFile('${d.downloadUrl}')">⬇</button>` : '-'}

  <button onclick="openEmailMenu('${key}')">
    ✉
  </button>

  <button onclick="deleteRoyalty('${key}')" style="background:#dc2626;margin-left:6px;">
    🗑
  </button>
</td>

</tr>
`);
      });

      rows.reverse();
list.innerHTML = rows.join('');
    });
  });
}

document.getElementById("royaltyForm").addEventListener("submit", function(e){

  e.preventDefault();

  const uid = document.getElementById("memberSelect").value;

  if(!uid){
    alert("Silakan pilih member terlebih dahulu.");
    return;
  }

  const member = allMembers.find(user => user.uid === uid);

  if(!member){
    alert("Member tidak ditemukan.");
    return;
  }

  const email = member.email;
  const name = member.nama;

  const period = document.getElementById("period").value;
  const date = document.getElementById("date").value;
  const type = document.getElementById("reportType").value;
  const value = Number(document.getElementById("value").value);
  const downloadUrl = document.getElementById("downloadUrl").value;

  const newKey = db.ref("royalties").push().key;

  let finalValue =
    (type === "Payment")
      ? -Math.abs(value)
      : value;

  db.ref("royalties/" + newKey).set({

    uid,
    email,
    date,
    period,
    value: finalValue,
    downloadUrl,
    type

  }).then(()=>{

    sendRoyaltyEmail(
      email,
      name,
      type,
      period,
      finalValue
    );

    loadAdminRoyalty();

    this.reset();

    // Reset member picker
    document.getElementById("memberSelect").value = "";
    document.getElementById("memberSearch").value = "";
    document.getElementById("memberSearch").classList.remove("selected");
    document.getElementById("clearMember").style.display = "none";

  }).catch(err=>{

    console.error("Gagal tambah royalty:", err);

  });

});
</script>

</body>
</html>
