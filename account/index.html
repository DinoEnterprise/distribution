<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account | Dynotic Distribution</title>

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-iphone.png">

<meta name="theme-color" content="#667eea">
<meta name="robots" content="noindex, nofollow">

<link
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  color:#17181c;
  min-height:100vh;
  padding-top:64px;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}


/* ================= HEADER ================= */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

header img{
  height:32px;
  width:auto;
  object-fit:contain;
  display:block;
}


/* ================= CONTAINER ================= */

.container{
  max-width:760px;
  margin:auto;
  padding:22px 14px 20px;
}


/* ================= PAGE TITLE ================= */

.page-title{
  margin-bottom:16px;
}

.page-title h1{
  font-size:22px;
  font-weight:700;
}

.page-title p{
  color:#777b84;
  font-size:12px;
  margin-top:3px;
}


/* ================= PROFILE CARD ================= */

.profile-card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  animation:pageIn .45s ease both;
}


/* ================= PROFILE TOP ================= */

.profile-top{
  display:flex;
  align-items:center;
  gap:14px;
  padding-bottom:18px;
  border-bottom:1px solid #eeeeF1;
}

.avatar{
  width:56px;
  height:56px;
  border-radius:16px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex-shrink:0;
}

.profile-name{
  font-size:17px;
  font-weight:600;
  word-break:break-word;
}

.profile-role{
  font-size:12px;
  color:#858891;
  margin-top:3px;
}


/* ================= INFO LIST ================= */

.info-list{
  margin-top:3px;
}

.info-item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 0;
  border-bottom:1px solid #eeeeF1;
}

.info-item:last-child{
  border-bottom:0;
}

.info-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  flex-shrink:0;
}

.info-content{
  flex:1;
  min-width:0;
}

.info-label{
  font-size:11px;
  color:#858891;
  margin-bottom:2px;
}

.info-value{
  font-size:13px;
  font-weight:500;
  word-break:break-word;
}


/* ================= EDIT BUTTON ================= */

.edit-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:10px;
  background:#f1f2f7;
  color:#555861;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:.15s;
}

.edit-btn:active{
  transform:scale(.92);
}


/* ================= SECTION ================= */

.section-title{
  font-size:13px;
  font-weight:600;
  color:#777b84;
  margin:24px 3px 10px;
}


/* ================= PAYMENT CARD ================= */

.payment-card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  animation:pageIn .45s ease .08s both;
}

.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:3px;
}

.card-title{
  font-size:14px;
  font-weight:600;
}

.payment-item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 0;
  border-bottom:1px solid #eeeeF1;
}

.payment-item:last-child{
  border-bottom:0;
}

.payment-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  flex-shrink:0;
}

.payment-content{
  flex:1;
  min-width:0;
}

.payment-label{
  font-size:11px;
  color:#858891;
  margin-bottom:2px;
}

.payment-value{
  font-size:13px;
  font-weight:500;
  word-break:break-word;
}

.payment-empty{
  padding:16px 0 6px;
  color:#858891;
  font-size:12px;
  line-height:1.5;
}


/* ================= PASSWORD ================= */

.password-section{
  margin-top:12px;
}

.password-btn{
  width:100%;
  border:0;
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:16px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.password-btn:active{
  transform:scale(.98);
}

.password-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

.password-info{
  flex:1;
}

.password-title{
  font-size:13px;
  font-weight:600;
}

.password-desc{
  font-size:11px;
  color:#858891;
  margin-top:2px;
}

.password-arrow{
  color:#a0a2a8;
  font-size:12px;
}


/* ================= LOGOUT ================= */

.logout-btn{
  width:100%;
  border:1px solid #f0d8da;
  background:#fff5f5;
  color:#e0444f;
  border-radius:16px;
  padding:15px;
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.logout-btn:active{
  transform:scale(.98);
  background:#ffecec;
}

.logout-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#ffe8e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

.logout-info{
  flex:1;
}

.logout-title{
  font-size:13px;
  font-weight:600;
}

.logout-desc{
  font-size:11px;
  color:#a66a6a;
  margin-top:2px;
}

.logout-arrow{
  color:#d56b6b;
  font-size:12px;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#fff;
  border-top:1px solid #e6e6eb;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  width:33.33%;
  text-align:center;
  color:#999ca4;
  font-size:11px;
  padding:7px 14px;
  border-radius:12px;
  cursor:pointer;
  transition:.15s;
}

.nav-item i{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.nav-item:active{
  transform:scale(.94);
}

.nav-item.active{
  color:#17181c;
  font-weight:600;
}

.nav-item.active::after{
  content:"";
  display:block;
  width:28px;
  height:3px;
  border-radius:999px;
  background:#111;
  margin:5px auto 0;
}


/* ================= ANIMATION ================= */

@keyframes pageIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* ================= DESKTOP ================= */

@media(min-width:700px){

  .container{
    padding-left:0;
    padding-right:0;
  }

}

</style>

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

  <img
    src="../assets/dynotic-distribution.png"
    alt="Dynotic Distribution"
  >

</header>


<!-- ================= CONTENT ================= -->

<main class="container">


  <div class="page-title">

    <h1>Account</h1>

    <p>
      Manage your Dynotic artist account.
    </p>

  </div>


  <!-- ================= PROFILE ================= -->

  <div class="profile-card">


    <div class="profile-top">

      <div class="avatar">

        <i class="fa-solid fa-user"></i>

      </div>


      <div>

        <div
          class="profile-name"
          id="nama"
        >
          Loading...
        </div>

        <div class="profile-role">
          Dynotic User
        </div>

      </div>

    </div>


    <div class="info-list">


      <!-- EMAIL -->

      <div class="info-item">

        <div class="info-icon">

          <i class="fa-regular fa-envelope"></i>

        </div>


        <div class="info-content">

          <div class="info-label">
            Email
          </div>

          <div
            class="info-value"
            id="email"
          >
            Loading...
          </div>

        </div>


        <button
          class="edit-btn"
          onclick="goEditInfo()"
          aria-label="Edit account"
        >

          <i class="fa-solid fa-pen"></i>

        </button>

      </div>


      <!-- ID -->

      <div class="info-item">

        <div class="info-icon">

          <i class="fa-solid fa-fingerprint"></i>

        </div>


        <div class="info-content">

          <div class="info-label">
            Account ID
          </div>

          <div
            class="info-value"
            id="uid"
          >
            Loading...
          </div>

        </div>

      </div>


    </div>

  </div>


  <!-- ================= PAYMENT ================= -->

  <div class="section-title">
    Payment
  </div>


  <div class="payment-card">


    <div class="card-header">

      <div class="card-title">
        Payment Detail
      </div>


      <button
        class="edit-btn"
        onclick="goEditPayment()"
        aria-label="Edit payment"
      >

        <i class="fa-solid fa-pen"></i>

      </button>

    </div>


    <div id="paymentContent">


      <div class="payment-item">

        <div class="payment-icon">

          <i class="fa-solid fa-wallet"></i>

        </div>


        <div class="payment-content">

          <div class="payment-label">
            Method
          </div>

          <div
            class="payment-value"
            id="paymentName"
          >
            -
          </div>

        </div>

      </div>


      <div class="payment-item">

        <div class="payment-icon">

          <i class="fa-solid fa-credit-card"></i>

        </div>


        <div class="payment-content">

          <div class="payment-label">
            Account
          </div>

          <div
            class="payment-value"
            id="paymentAccount"
          >
            -
          </div>

        </div>

      </div>


    </div>


    <div
      id="paymentEmpty"
      class="payment-empty"
      style="display:none;"
    >
      No payment method has been added yet.
    </div>


  </div>


  <!-- ================= PASSWORD ================= -->

  <div class="section-title">
    Security
  </div>


  <button
    class="password-btn"
    onclick="goChangePassword()"
  >

    <div class="password-icon">

      <i class="fa-solid fa-lock"></i>

    </div>


    <div class="password-info">

      <div class="password-title">
        Change Password
      </div>

      <div class="password-desc">
        Update your account password.
      </div>

    </div>


    <div class="password-arrow">

      <i class="fa-solid fa-chevron-right"></i>

    </div>

  </button>


  <!-- ================= LOGOUT ================= -->

  <button
    class="logout-btn"
    onclick="logout()"
  >

    <div class="logout-icon">

      <i class="fa-solid fa-right-from-bracket"></i>

    </div>


    <div class="logout-info">

      <div class="logout-title">
        Log Out
      </div>

      <div class="logout-desc">
        Sign out from your Dynotic account.
      </div>

    </div>


    <div class="logout-arrow">

      <i class="fa-solid fa-chevron-right"></i>

    </div>

  </button>


  <div style="height:20px"></div>


</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">


  <div
    class="nav-item"
    onclick="window.location.href='../home'"
  >

    <i class="fa-solid fa-house"></i>

    Home

  </div>


  <div
    class="nav-item"
    onclick="window.location.href='../releases'"
  >

    <i class="fa-solid fa-music"></i>

    Releases

  </div>


  <div class="nav-item active">

    <i class="fa-regular fa-user"></i>

    Account

  </div>


</nav>


<script>


/* ================= FIREBASE ================= */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const auth =
  firebase.auth();


const db =
  firebase.database();


/* ================= AUTH ================= */

auth.onAuthStateChanged(user => {

  if(!user){

    location.href="../login";

    return;

  }


  loadProfile(user.uid);

});


/* ================= LOAD PROFILE ================= */

function loadProfile(uid){

  const user =
    firebase.auth().currentUser;


  if(user){

    document.getElementById(
      "email"
    ).innerText =
      user.email || "-";


    document.getElementById(
      "uid"
    ).innerText =
      uid;

  }


  db.ref("users/" + uid)
    .once("value")
    .then(snap => {

      if(!snap.exists()){

        return;

      }


      const d =
        snap.val();


      /* ================= NAME ================= */

      document.getElementById(
        "nama"
      ).innerText =
        d.nama || "-";


      /* ================= PAYMENT ================= */

      const paymentName =
        document.getElementById(
          "paymentName"
        );

      const paymentAccount =
        document.getElementById(
          "paymentAccount"
        );

      const paymentContent =
        document.getElementById(
          "paymentContent"
        );

      const paymentEmpty =
        document.getElementById(
          "paymentEmpty"
        );


      let hasPayment = false;


      /* PAYPAL */

      if(
        d.payment &&
        d.payment.paypal &&
        d.payment.email
      ){

        paymentName.innerText =
          "PayPal";

        paymentAccount.innerText =
          d.payment.email;

        hasPayment = true;

      }


      /* BANK */

      else if(
        d.payment &&
        d.payment.bank &&
        d.payment.account
      ){

        paymentName.innerText =
          d.payment.bank;

        paymentAccount.innerText =
          d.payment.account;

        hasPayment = true;

      }


      /* NO PAYMENT */

      if(!hasPayment){

        paymentContent.style.display =
          "none";

        paymentEmpty.style.display =
          "block";

      }else{

        paymentContent.style.display =
          "block";

        paymentEmpty.style.display =
          "none";

      }

    })
    .catch(error => {

      console.error(
        "Failed to load profile:",
        error
      );

    });

}


/* ================= NAVIGATION ================= */

function goEditInfo(){

  window.location.href =
    "../edit-account";

}


function goEditPayment(){

  window.location.href =
    "../edit-payment";

}


function goChangePassword(){

  window.location.href =
    "../change-password";

}


/* ================= LOGOUT ================= */

function logout(){

  auth.signOut()
    .then(() => {

      location.href="../login";

    })
    .catch(error => {

      console.error(
        "Logout failed:",
        error
      );

    });

}

</script>

</body>
</html>
