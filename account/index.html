<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account | Dynotic Distribution</title>

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-iphone.png">

<meta name="theme-color" content="#667eea">
<meta name="robots" content="noindex, nofollow">

<link
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  min-height:100vh;
  color:#17181c;
  padding-top:64px;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}


/* ================= HEADER ================= */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

header img{
  height:32px;
  width:auto;
  object-fit:contain;
  display:block;
}


/* ================= MAIN ================= */

.container{
  width:calc(100% - 28px);
  max-width:760px;
  margin:0 auto;
}


/* ================= CARD ================= */

.card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  margin-top:20px;
  animation:pageIn .45s ease both;
}

.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.card-title{
  font-size:14px;
  font-weight:600;
}

.edit-btn{
  width:32px;
  height:32px;
  border-radius:10px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555861;
  cursor:pointer;
  transition:.15s;
}

.edit-btn:active{
  transform:scale(.92);
}

.edit-btn i{
  font-size:13px;
}


/* ================= ACCOUNT ROW ================= */

.row{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #ededf1;
  font-size:13px;
}

.row:last-child{
  border-bottom:none;
}

.row-label{
  color:#777b84;
  flex-shrink:0;
}

.row-value{
  color:#25262b;
  font-weight:500;
  text-align:right;
  max-width:65%;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* ================= PASSWORD ================= */

.password-btn{
  width:100%;
  height:44px;
  margin-top:14px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}

.password-btn:active{
  transform:scale(.97);
}


/* ================= PAYMENT ================= */

.payment-empty{
  padding:12px 0 4px;
  color:#858891;
  font-size:12px;
  line-height:1.5;
}


/* ================= LOGOUT ================= */

.logout-btn{
  width:100%;
  height:44px;
  margin-top:14px;
  border:1px solid #f0d8da;
  border-radius:12px;
  background:#fff5f5;
  color:#e0444f;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.logout-btn:active{
  transform:scale(.97);
  background:#ffecec;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
  height:72px;
  background:#fff;
  border-top:1px solid #e6e6eb;
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  width:33.33%;
  text-align:center;
  font-size:11px;
  color:#999ca4;
  padding:7px 14px;
  border-radius:12px;
  cursor:pointer;
  transition:.15s;
}

.nav-item i{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.nav-item:active{
  transform:scale(.94);
}

.nav-item.active{
  color:#17181c;
  font-weight:600;
}

.nav-item.active::after{
  content:"";
  display:block;
  width:28px;
  height:3px;
  border-radius:999px;
  background:#111;
  margin:5px auto 0;
}


/* ================= ANIMATION ================= */

@keyframes pageIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* ================= MOBILE ================= */

@media(max-width:600px){

  .container{
    width:calc(100% - 28px);
  }

}


/* ================= DESKTOP ================= */

@media(min-width:700px){

  .container{
    width:100%;
  }

}

</style>

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

  <img
    src="../assets/dynotic-distribution.png"
    alt="Dynotic Distribution"
  >

</header>


<!-- ================= MAIN ================= -->

<main class="container">


  <!-- ================= ACCOUNT INFO ================= -->

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        Account Info
      </div>

      <div
        class="edit-btn"
        onclick="goEditInfo()"
      >
        <i class="fa-solid fa-pen"></i>
      </div>

    </div>


    <div class="row">

      <span class="row-label">
        Name
      </span>

      <span
        id="nama"
        class="row-value"
      >
        -
      </span>

    </div>


    <div class="row">

      <span class="row-label">
        Email
      </span>

      <span
        id="email"
        class="row-value"
      >
        -
      </span>

    </div>


    <div class="row">

      <span class="row-label">
        ID
      </span>

      <span
        id="uid"
        class="row-value"
      >
        -
      </span>

    </div>


    <button
      class="password-btn"
      onclick="goChangePassword()"
    >
      <i class="fa-solid fa-lock"></i>
      &nbsp; Change Password
    </button>

  </div>


  <!-- ================= PAYMENT DETAIL ================= -->

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        Payment Detail
      </div>

      <div
        class="edit-btn"
        onclick="goEditPayment()"
      >
        <i class="fa-solid fa-pen"></i>
      </div>

    </div>


    <div id="paymentContent">

      <div class="row">

        <span class="row-label">
          Method
        </span>

        <span
          id="paymentName"
          class="row-value"
        >
          -
        </span>

      </div>


      <div class="row">

        <span class="row-label">
          Account
        </span>

        <span
          id="paymentAccount"
          class="row-value"
        >
          -
        </span>

      </div>

    </div>


    <div
      id="paymentEmpty"
      class="payment-empty"
      style="display:none;"
    >
      No payment method has been added yet.
    </div>


    <!-- LOGOUT -->

    <button
      class="logout-btn"
      onclick="logout()"
    >

      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      &nbsp; Log Out

    </button>

  </div>


  <div style="height:20px"></div>


</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">


  <div
    class="nav-item"
    onclick="window.location.href='../home'"
  >

    <i class="fa-solid fa-house"></i>

    Home

  </div>


  <div
    class="nav-item"
    onclick="window.location.href='../releases'"
  >

    <i class="fa-solid fa-music"></i>

    Releases

  </div>


  <div
    class="nav-item active"
  >

    <i class="fa-regular fa-user"></i>

    Account

  </div>


</nav>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>


/* ================= FIREBASE CONFIG ================= */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const auth = firebase.auth();

const db = firebase.database();


/* ================= AUTH ================= */

auth.onAuthStateChanged(user => {

  if(!user){

    location.href="../login";

    return;

  }

  loadProfile(user.uid);

});


/* ================= LOAD PROFILE ================= */

function loadProfile(uid){

  const user =
    firebase.auth().currentUser;


  if(user){

    document.getElementById(
      "email"
    ).innerText =
      user.email || "-";

    document.getElementById(
      "uid"
    ).innerText =
      uid;

  }


  db.ref("users/" + uid)
    .once("value")
    .then(snap => {

      if(!snap.exists()){
        return;
      }


      const d =
        snap.val();


      /* ================= NAME ================= */

      document.getElementById(
        "nama"
      ).innerText =
        d.nama || "-";


      /* ================= PAYMENT ================= */

      const paymentName =
        document.getElementById(
          "paymentName"
        );

      const paymentAccount =
        document.getElementById(
          "paymentAccount"
        );

      const paymentContent =
        document.getElementById(
          "paymentContent"
        );

      const paymentEmpty =
        document.getElementById(
          "paymentEmpty"
        );


      let hasPayment = false;


      /*
        PAYPAL
      */

      if(
        d.payment &&
        d.payment.paypal &&
        d.payment.email
      ){

        paymentName.innerText =
          "PayPal";

        paymentAccount.innerText =
          d.payment.email;

        hasPayment = true;

      }


      /*
        BANK
      */

      else if(
        d.payment &&
        d.payment.bank &&
        d.payment.account
      ){

        paymentName.innerText =
          d.payment.bank;

        paymentAccount.innerText =
          d.payment.account;

        hasPayment = true;

      }


      /*
        NO PAYMENT
      */

      if(!hasPayment){

        paymentContent.style.display =
          "none";

        paymentEmpty.style.display =
          "block";

      }else{

        paymentContent.style.display =
          "block";

        paymentEmpty.style.display =
          "none";

      }

    })
    .catch(error => {

      console.error(
        "Failed to load profile:",
        error
      );

    });

}


/* ================= LOGOUT ================= */

function logout(){

  auth.signOut()
    .then(() => {

      location.href="../login";

    })
    .catch(error => {

      console.error(
        "Logout failed:",
        error
      );

    });

}


/* ================= NAVIGATION ================= */

function goEditInfo(){

  window.location.href =
    "../edit-account";

}


function goEditPayment(){

  window.location.href =
    "../edit-payment";

}


function goChangePassword(){

  location.href =
    "../change-password";

}

</script>

</body>
</html>
