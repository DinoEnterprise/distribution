
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Dynotic Distribution</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; font-family:'Outfit',sans-serif; margin:0; padding:0; }

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(180deg,#e5e7eb,#d1d5db);
  padding:15px;
}

.container{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:26px;
  padding:32px 26px;
  text-align:center;
  border:1px solid rgba(0,0,0,0.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.12),0 30px 60px rgba(0,0,0,0.08);
  animation:enter .6s ease;
}

.container:hover{transform:translateY(-3px);transition:.3s}

@keyframes enter{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:none}
}

.logo{width:70px;margin-bottom:16px}
h2{margin-bottom:20px;font-size:22px;font-weight:700;color:#222}

.field{position:relative;margin-bottom:15px;width:100%}

input{
  width:100%;
  padding:14px 44px 14px 16px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus{
  border:1px solid #111;
  box-shadow:0 0 0 3px rgba(0,0,0,0.08);
}

.toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  user-select:none;
  padding:4px;
  border-radius:6px;
  transition:.2s;
  -webkit-tap-highlight-color:transparent;
}

.toggle:active,.toggle:focus{outline:2px solid #111}

button{
  letter-spacing:.3px;
  width:100%;
  padding:15px;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  color:#fff;
  background:#000;
  border:1px solid #000;
  cursor:pointer;
  transition:.2s;
}

button:hover{background:#111}
button:focus,button:active{outline:2px solid #000}
button:active{transform:scale(.96)}
button:disabled{opacity:.6;cursor:not-allowed}

#error{
  margin-top:10px;
  font-size:14px;
  color:#e53e3e;
  min-height:20px;
  line-height:1.5;
}

.loader{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:16px;
  color:#111;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.loader.active{opacity:1;pointer-events:auto}

.fade-out{animation:exit .5s ease forwards}

@keyframes exit{
  to{opacity:0;transform:scale(.95)}
}
</style>
</head>

<body>

<div class="container" id="card">

  <img src="../assets/dynotic-distribution.png" class="logo" alt="Dynotic">

  <h2>Login Dynotic</h2>

  <div class="field">
    <input id="email" type="email" placeholder="Email">
  </div>

  <div class="field">
    <input id="pass" type="password" placeholder="Password">
    <div class="toggle" id="eye" tabindex="0" onclick="togglePass()">𖠂</div>
  </div>

  <div style="text-align:right;margin-bottom:15px;">
    <a href="../forgot-password" style="font-size:14px;color:#555;text-decoration:underline;">
      Forgot password?
    </a>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <div id="error"></div>

</div>

<div class="loader" id="loader">Dynotic Distribution…</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

// FIREBASE CONFIGURATION
if(!firebase.apps.length){
  firebase.initializeApp({
    apiKey: "ISI_API_KEY_FIREBASE_YANG_SAMA",
    authDomain: "dynopay-2513c.firebaseapp.com",
    databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
  });
}

const auth = firebase.auth();
const db = firebase.database();

let loginInProgress = false;
let sessionChecking = false;

const errorEl = document.getElementById("error");
const emailInput = document.getElementById("email");
const passInput = document.getElementById("pass");
const btn = document.getElementById("loginBtn");

emailInput.addEventListener("input",()=>{
  errorEl.textContent="";
});

passInput.addEventListener("input",()=>{
  errorEl.textContent="";
});

// Toggle password
function togglePass(){

  if(passInput.type==="password"){
    passInput.type="text";
    document.getElementById("eye").textContent="⌒";
  }else{
    passInput.type="password";
    document.getElementById("eye").textContent="𖠂";
  }

}

// Tampilkan pesan dan reset tombol
function showLoginError(message){

  errorEl.textContent=message;

  btn.disabled=false;
  btn.textContent="Login";

}

// Pemeriksaan akun
async function validateAccount(user){

  // Refresh data Firebase Authentication
  await user.reload();

  // Pastikan email sudah diverifikasi
  if(!user.emailVerified){

    return {
      allowed:false,
      message:"Please verify your email before logging in."
    };

  }

  // Periksa profil pengguna
  const snapshot=await db.ref("users/"+user.uid).once("value");
  const data=snapshot.val();

  if(!data){

    return {
      allowed:false,
      message:"Account profile not found. Please contact the admin."
    };

  }

  // Akun belum diaktifkan
  if(data.status==="unverified"){

    return {
      allowed:false,
      message:"Email verified, but account activation is incomplete. Please return to the verification page."
    };

  }

  // Akun dinonaktifkan admin
  if(data.status!=="active"){

    return {
      allowed:false,
      message:"Account is inactive or disabled. Please contact the admin."
    };

  }

  return {
    allowed:true,
    data:data
  };

}

// Proses login
async function login(){

  if(loginInProgress || btn.disabled) return;

  const email=emailInput.value.trim();
  const pass=passInput.value;

  errorEl.textContent="";

  if(!email || !pass){
    showLoginError("Email and password are required");
    return;
  }

  loginInProgress=true;

  btn.disabled=true;
  btn.textContent="Signing in...";

  try{

    await auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    );

    const credential=await auth.signInWithEmailAndPassword(
      email,
      pass
    );

    const user=credential.user;

    const result=await validateAccount(user);

    if(!result.allowed){

      await auth.signOut();

      loginInProgress=false;

      showLoginError(result.message);
      return;

    }

    // Catat waktu login
    db.ref("users/"+user.uid+"/lastLogin")
      .set(Date.now())
      .catch(error=>{
        console.error("Last login update failed:",error);
      });

    // Login berhasil
    document.getElementById("loader").classList.add("active");
    document.getElementById("card").classList.add("fade-out");

    setTimeout(()=>{
      window.location.replace("../home");
    },600);

  }catch(error){

    console.error("Login error:",error);

    if(error.code==="auth/user-not-found"){
      showLoginError("User not found");
    }else if(
      error.code==="auth/wrong-password" ||
      error.code==="auth/invalid-credential"
    ){
      showLoginError("Incorrect email or password");
    }else if(error.code==="auth/invalid-email"){
      showLoginError("Invalid email address");
    }else if(error.code==="auth/user-disabled"){
      showLoginError("This account has been disabled");
    }else{
      showLoginError("An error occurred. Please try again");
    }

    if(auth.currentUser){
      await auth.signOut().catch(console.error);
    }

    loginInProgress=false;

  }

}

// Enter key
document.addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});

// Periksa sesi login yang masih tersimpan
auth.onAuthStateChanged(async user=>{

  if(loginInProgress || !user || sessionChecking) return;

  sessionChecking=true;
  loginInProgress=true;

  try{

    const result=await validateAccount(user);

    if(result.allowed){

      document.getElementById("loader").classList.add("active");
      window.location.replace("../home");

    }else{

      await auth.signOut();

      loginInProgress=false;
      showLoginError(result.message);

    }

  }catch(error){

    console.error("Session check error:",error);

    await auth.signOut().catch(console.error);

    loginInProgress=false;

    showLoginError("Unable to verify your account. Please log in again.");

  }finally{

    sessionChecking=false;

  }

});

</script>

</body>
</html>
