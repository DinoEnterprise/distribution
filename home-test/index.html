<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home | Dynotic Distribution</title>

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-iphone.png">

<meta property="og:title" content="Dynotic Dashboard">
<meta property="og:description" content="Manage your music releases, royalties, and submissions in one place.">
<meta property="og:image" content="https://dynotic.web.id/assets/icon-512.png">
<meta property="og:url" content="https://dynotic.web.id/dashboard">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dynotic Dashboard">
<meta name="twitter:description" content="Artist dashboard for managing releases and earnings.">
<meta name="twitter:image" content="https://dynotic.web.id/assets/icon-512.png">

<meta name="theme-color" content="#667eea">
<meta name="robots" content="noindex, nofollow">

<link
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  min-height:100vh;
  color:#17181c;
  padding-top:64px;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}


/* ================= HEADER ================= */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

header img{
  height:32px;
  width:auto;
  object-fit:contain;
}


/* ================= NOTIFICATION ================= */

.notif-btn{
  margin-left:auto;
  width:38px;
  height:38px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  transition:.15s;
}

.notif-btn:active{
  transform:scale(.94);
}

.notif-btn i{
  font-size:16px;
}

.notif-badge{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:9px;
  font-weight:700;
  display:none;
  align-items:center;
  justify-content:center;
}


/* ================= MAIN ================= */

.container{
  width:calc(100% - 28px);
  max-width:760px;
  margin:0 auto;
}


/* ================= WALLET ================= */

.card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  margin-top:20px;
  animation:pageIn .45s ease both;
}

.wallet-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.wallet-content{
  min-width:0;
}

.artist-name{
  font-size:12px;
  font-weight:500;
  color:#777b84;
  margin-bottom:4px;
}

.balance-title{
  font-size:13px;
  font-weight:600;
  color:#25262b;
}

.card-value{
  font-size:clamp(22px,6vw,32px);
  font-weight:700;
  color:#111;
  margin-top:4px;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
}

.wallet-desc{
  font-size:10px;
  color:#888b93;
  margin-top:6px;
  line-height:1.4;
}

.detail-btn{
  flex-shrink:0;
  padding:10px 13px;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:.15s;
}

.detail-btn:active{
  transform:scale(.94);
}

.detail-btn i{
  font-size:11px;
}


/* ================= SECTION ================= */

.section-title{
  font-size:13px;
  font-weight:600;
  color:#777b84;
  margin:24px 3px 10px;
}


/* ================= TOOLS ================= */

.tools-card{
  margin-top:0;
}

.tools-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.tool-item{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:16px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  transition:.18s ease;
  animation:pageIn .45s ease both;
}

.tool-item:nth-child(1){
  animation-delay:.08s;
}

.tool-item:nth-child(2){
  animation-delay:.16s;
}

.tool-item:active{
  transform:scale(.97);
}

.tool-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#f1f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  flex-shrink:0;
}

.tool-text{
  min-width:0;
}

.tool-title{
  font-size:13px;
  font-weight:600;
  line-height:1.3;
}

.tool-desc{
  font-size:10px;
  color:#858891;
  margin-top:3px;
  line-height:1.3;
}


/* ================= MESSAGE POPUP ================= */

.message-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.message-popup.show{
  display:flex;
}

.message-card{
  width:calc(100% - 40px);
  max-width:340px;
  background:#fff;
  border-radius:17px;
  padding:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
}

.message-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:8px;
}

.message-text{
  font-size:13px;
  color:#555;
  line-height:1.5;
}

.message-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.view-btn{
  width:auto;
  background:#111;
  color:#fff;
  border:none;
  padding:9px 14px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.close-btn{
  width:auto;
  background:#f1f2f7;
  color:#333;
  border:none;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
  height:72px;
  background:#fff;
  border-top:1px solid #e6e6eb;
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  width:33.33%;
  text-align:center;
  font-size:11px;
  color:#999ca4;
  padding:7px 14px;
  border-radius:12px;
  cursor:pointer;
  transition:.15s;
}

.nav-item i{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.nav-item:active{
  transform:scale(.94);
}

.nav-item.active{
  color:#17181c;
  font-weight:600;
}

.nav-item.active::after{
  content:"";
  display:block;
  width:28px;
  height:3px;
  border-radius:999px;
  background:#111;
  margin:5px auto 0;
}


/* ================= ANIMATION ================= */

@keyframes pageIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* ================= MOBILE ================= */

@media(max-width:600px){

  .container{
    width:calc(100% - 28px);
  }

  .wallet-card{
    padding:17px;
  }

  .card-value{
    font-size:23px;
  }

  .tools-grid{
    grid-template-columns:1fr;
  }

}


/* ================= DESKTOP ================= */

@media(min-width:700px){

  .container{
    width:100%;
  }

}

</style>

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

  <img src="../assets/dynotic-distribution.png">

  <div
    id="notifBtn"
    class="notif-btn"
    onclick="openMessages()"
  >

    <i class="fa-regular fa-bell"></i>

    <span
      id="notifBadge"
      class="notif-badge"
    >
      0
    </span>

  </div>

</header>


<!-- ================= MESSAGE POPUP ================= -->

<div
  id="messagePopup"
  class="message-popup"
>

  <div class="message-card">

    <div
      class="message-title"
      id="msgTitle"
    ></div>

    <div
      class="message-text"
      id="msgText"
    ></div>

    <div class="message-actions">

      <button
        class="view-btn"
        onclick="viewMessage()"
      >
        View
      </button>

      <button
        class="close-btn"
        onclick="closeMessage()"
      >
        ✕
      </button>

    </div>

  </div>

</div>


<!-- ================= MAIN ================= -->

<main class="container">


  <!-- WALLET -->

  <div
    class="card wallet-card"
    onclick="goRekapan()"
  >

    <div class="wallet-content">

      <div
        id="namaArtis"
        class="artist-name"
      >
        Hi, --
      </div>

      <div class="balance-title">
        Main Wallet Balance
      </div>

      <div
        id="saldo"
        class="card-value"
      >
        <span style="font-size:.6em;opacity:.7">Rp</span>
        <span>0</span>
      </div>

      <div class="wallet-desc">
        Tap to view royalty breakdown
      </div>

    </div>


    <div class="detail-btn">

      <i class="fa-solid fa-clock-rotate-left"></i>

      Detail

    </div>

  </div>


  <!-- TOOLS -->

  <div class="section-title">
    Tools
  </div>


  <section class="tools-grid">


    <!-- OAC -->

    <div
      class="tool-item"
      onclick="goOAC()"
    >

      <div class="tool-icon">
        <i class="fa-brands fa-youtube"></i>
      </div>

      <div class="tool-text">

        <div class="tool-title">
          Official Artist Channel
        </div>

        <div class="tool-desc">
          Manage your YouTube artist channel.
        </div>

      </div>

    </div>


    <!-- ARTWORK -->

    <div
      class="tool-item"
      onclick="goArtwork()"
    >

      <div class="tool-icon">
        <i class="fa-solid fa-image"></i>
      </div>

      <div class="tool-text">

        <div class="tool-title">
          Artwork Generator
        </div>

        <div class="tool-desc">
          Create artwork for your release.
        </div>

      </div>

    </div>


  </section>


  <div style="height:80px"></div>


</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">


  <div
    class="nav-item active"
    onclick="homeClick()"
  >

    <i class="fa-solid fa-house"></i>

    Home

  </div>


  <div
    class="nav-item"
    onclick="goReleases()"
  >

    <i class="fa-solid fa-music"></i>

    Releases

  </div>


  <div
    class="nav-item"
    onclick="accountClick()"
  >

    <i class="fa-regular fa-user"></i>

    Account

  </div>


</nav>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>


/* ================= FIREBASE CONFIG ================= */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const db = firebase.database();

let targetSaldo = 0;


/* ================= AUTH ================= */

firebase.auth().onAuthStateChanged(user => {

  if(!user){

    location.href="../login";

    return;

  }


  loadMessages(user.uid);


  db.ref("users/" + user.uid)
    .once("value")
    .then(snap => {

      if(!snap.exists()) return;

      const d = snap.val();

      targetSaldo = Number(d.saldo || 0);

      document.getElementById(
        "namaArtis"
      ).textContent =
        "Hi, " + (d.nama || "Artist");

      animateSaldo();

    });

});


/* ================= SALDO ================= */

function animateSaldo(){

  let angka = 0;

  const step =
    Math.ceil(targetSaldo / 15) || 1;

  const i = setInterval(() => {

    if(angka < targetSaldo){

      angka += step;

      if(angka > targetSaldo){
        angka = targetSaldo;
      }

      document.getElementById(
        "saldo"
      ).innerHTML = `

        <span style="font-size:.6em;opacity:.7">
          Rp
        </span>

        <span>
          ${angka.toLocaleString("id-ID")}
        </span>

      `;

    }else{

      clearInterval(i);

    }

  },15);

}


/* ================= NAVIGATION ================= */

function logout(){

  firebase.auth()
    .signOut()
    .then(() => {

      location.href="../login";

    });

}


function goReleases(){

  location.href="../releases";

}


function accountClick(){

  location.href="../account";

}


function homeClick(){

  console.log(
    "Dashboard active — tidak reload"
  );

}


function goRekapan(){

  location.href="../income";

}


function goOAC(){

  location.href="../oac";

}


function goArtwork(){

  location.href="../artwork-generate";

}


/* ================= MESSAGES ================= */

let messagesQueue = [];

let currentMsgIndex = 0;


function loadMessages(uid){

  db.ref("messages_inbox/" + uid)
    .on("value", snap => {

      messagesQueue = [];

      snap.forEach(i => {

        const m = i.val();

        if(!m.read){

          messagesQueue.push({
            ...m,
            key:i.key
          });

        }

      });


      const badge =
        document.getElementById(
          "notifBadge"
        );


      if(messagesQueue.length > 0){

        badge.style.display="flex";

        badge.textContent =
          messagesQueue.length;

      }else{

        badge.style.display="none";

      }

    });

}


function openMessages(){

  if(messagesQueue.length === 0)
    return;

  currentMsgIndex = 0;

  showCurrentMessage();

}


function showCurrentMessage(){

  if(
    currentMsgIndex >=
    messagesQueue.length
  ){

    document
      .getElementById("messagePopup")
      .style.display="none";

    return;

  }


  const m =
    messagesQueue[currentMsgIndex];


  document.getElementById(
    "msgTitle"
  ).textContent =
    m.subject || "-";


  document.getElementById(
    "msgText"
  ).textContent =
    m.body || "-";


  const popup =
    document.getElementById(
      "messagePopup"
    );


  popup.style.display="flex";


  fadeInElement(
    document.querySelector(
      ".message-card"
    ),
    250
  );

}


function closeMessage(){

  const user =
    firebase.auth().currentUser;

  const m =
    messagesQueue[currentMsgIndex];


  if(
    user &&
    m
  ){

    db.ref(
      "messages_inbox/" +
      user.uid +
      "/" +
      m.key +
      "/read"
    ).set(true);

  }


  currentMsgIndex++;

  showCurrentMessage();

}


function viewMessage(){

  const m =
    messagesQueue[currentMsgIndex];

  const user =
    firebase.auth().currentUser;


  if(
    user &&
    m
  ){

    db.ref(
      "messages_inbox/" +
      user.uid +
      "/" +
      m.key +
      "/read"
    ).set(true);

  }


  closeMessage();

}


/* ================= ANIMATION ================= */

function fadeInElement(
  el,
  duration=350
){

  if(!el) return;

  el.style.opacity=0;

  el.style.transform=
    "translateY(12px)";

  const start =
    performance.now();


  function animate(now){

    const elapsed =
      now - start;

    const progress =
      Math.min(
        elapsed / duration,
        1
      );


    el.style.opacity =
      progress;

    el.style.transform =
      `translateY(${
        12 * (1-progress)
      }px)`;


    if(progress < 1){

      requestAnimationFrame(
        animate
      );

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* ================= PAGE ANIMATION ================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    document
      .querySelectorAll(
        ".card,.tool-item"
      )
      .forEach((c,idx) => {

        setTimeout(
          () => fadeInElement(c),
          idx * 100
        );

      });

  }
);

</script>

</body>
  </html>
