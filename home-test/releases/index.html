<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Releases | Dynotic Distribution</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Outfit',sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:#f1f2f7;
      color:#17181c;
      padding-top:64px;
      padding-bottom:90px;
    }

    button,
    input{
      font-family:inherit;
    }

    /* ================= HEADER ================= */

    header{
      height:64px;
      padding:0 18px;
      display:flex;
      align-items:center;
      background:#fff;
      border-bottom:1px solid #e8e8ed;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:1000;
    }

    header img{
      height:32px;
      width:auto;
      object-fit:contain;
      display:block;
    }

    /* ================= MAIN ================= */

    main{
      width:calc(100% - 28px);
      max-width:760px;
      margin:0 auto;
      padding-top:18px;
    }

    .section-title{
      font-size:20px;
      font-weight:700;
      margin-bottom:14px;
    }

    /* ================= CREATE RELEASE ================= */

    .create-card{
      background:#fff;
      border:1px solid #e7e7ec;
      border-radius:16px;
      padding:17px;
      display:flex;
      align-items:center;
      gap:14px;
      cursor:pointer;
      transition:.18s ease;
      margin-bottom:18px;
    }

    .create-card:active{
      transform:scale(.985);
    }

    .create-icon{
      width:46px;
      height:46px;
      border-radius:13px;
      background:#f0efff;
      color:#6557d8;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      font-size:19px;
    }

    .create-info{
      min-width:0;
      flex:1;
    }

    .create-title{
      font-size:15px;
      font-weight:700;
      margin-bottom:3px;
    }

    .create-desc{
      font-size:12px;
      color:#85858d;
      line-height:1.4;
    }

    .create-arrow{
      color:#a2a2aa;
      font-size:14px;
    }

    /* ================= RELEASE CARD ================= */

    .release-section{
      margin-top:4px;
    }

    .release-section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
    }

    .release-section-head h2{
      font-size:17px;
      font-weight:700;
    }

    .release-count{
      font-size:12px;
      color:#85858d;
    }

    /* ================= SEARCH ================= */

    .search-box{
      background:#fff;
      border:1px solid #e7e7ec;
      border-radius:13px;
      height:46px;
      display:flex;
      align-items:center;
      padding:0 14px;
      margin-bottom:14px;
    }

    .search-box i{
      color:#9898a1;
      font-size:14px;
      margin-right:10px;
    }

    .search-box input{
      border:none;
      outline:none;
      background:transparent;
      width:100%;
      font-size:13px;
      color:#17181c;
    }

    .search-box input::placeholder{
      color:#a1a1a9;
    }

    /* ================= RELEASE ITEM ================= */

    #releaseList{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .release-card{
      background:#fff;
      border:1px solid #e7e7ec;
      border-radius:16px;
      padding:13px;
      display:flex;
      gap:13px;
      cursor:pointer;
      transition:.18s ease;
    }

    .release-card:active{
      transform:scale(.99);
    }

    .cover-wrap{
      width:76px;
      height:76px;
      border-radius:11px;
      overflow:hidden;
      background:#e9e9ee;
      flex-shrink:0;
      position:relative;
    }

    .cover-wrap::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        110deg,
        transparent 20%,
        rgba(255,255,255,.5) 50%,
        transparent 80%
      );
      animation:loading 1.4s infinite;
      z-index:1;
    }

    .cover-wrap.loaded::before{
      display:none;
    }

    .cover-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      position:relative;
      z-index:2;
    }

    .release-info{
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .release-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:8px;
      margin-bottom:5px;
    }

    .release-title{
      font-size:14px;
      font-weight:700;
      line-height:1.3;
      overflow:hidden;
      text-overflow:ellipsis;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }

    .status{
      flex-shrink:0;
      font-size:9px;
      font-weight:700;
      padding:4px 7px;
      border-radius:6px;
      letter-spacing:.2px;
    }

    .status-proposal{
      background:#fff3df;
      color:#d98500;
    }

    .status-process{
      background:#eaf2ff;
      color:#3978d6;
    }

    .status-approved{
      background:#e8f8f3;
      color:#16896e;
    }

    .status-live{
      background:#e8f7ed;
      color:#1c9251;
    }

    .status-rejected{
      background:#ffebed;
      color:#dc4050;
    }

    .release-artist{
      font-size:11px;
      color:#66666e;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-bottom:3px;
    }

    .release-meta{
      display:flex;
      flex-wrap:wrap;
      gap:5px 10px;
      color:#92929a;
      font-size:10px;
    }

    .release-meta span{
      display:flex;
      align-items:center;
      gap:4px;
    }

    .release-meta i{
      font-size:9px;
    }

    /* ================= EMPTY ================= */

    .empty{
      background:#fff;
      border:1px solid #e7e7ec;
      border-radius:16px;
      padding:40px 20px;
      text-align:center;
    }

    .empty-icon{
      width:52px;
      height:52px;
      border-radius:15px;
      background:#f0f0f4;
      color:#96969f;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 13px;
      font-size:20px;
    }

    .empty-title{
      font-size:14px;
      font-weight:700;
      margin-bottom:5px;
    }

    .empty-desc{
      font-size:12px;
      color:#92929a;
      line-height:1.5;
    }

    /* ================= PAGINATION ================= */

    .pagination{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:7px;
      margin-top:18px;
    }

    .page-btn{
      width:34px;
      height:34px;
      border:none;
      border-radius:9px;
      background:#fff;
      border:1px solid #e4e4e9;
      color:#55555d;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:12px;
    }

    .page-btn.active{
      background:#6557d8;
      border-color:#6557d8;
      color:#fff;
      font-weight:700;
    }

    .page-btn:disabled{
      opacity:.4;
      cursor:not-allowed;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      height:72px;
      background:#fff;
      border-top:1px solid #e8e8ed;
      display:flex;
      align-items:center;
      justify-content:space-around;
      z-index:1000;
      padding:0 12px;
    }

    .nav-item{
      text-decoration:none;
      color:#96969e;
      width:80px;
      height:58px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:10px;
      font-weight:500;
    }

    .nav-item i{
      font-size:18px;
    }

    .nav-item.active{
      color:#6557d8;
      font-weight:600;
    }

    /* ================= LOADING ================= */

    .loading{
      background:#fff;
      border:1px solid #e7e7ec;
      border-radius:16px;
      padding:25px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      color:#8c8c95;
      font-size:12px;
    }

    .spinner{
      width:16px;
      height:16px;
      border:2px solid #e1e1e6;
      border-top-color:#6557d8;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    /* ================= ANIMATION ================= */

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes loading{
      0%{
        transform:translateX(-100%);
      }
      100%{
        transform:translateX(100%);
      }
    }

    .pulse{
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%,100%{
        opacity:1;
      }
      50%{
        opacity:.55;
      }
    }

    @media(max-width:420px){
      main{
        width:calc(100% - 24px);
      }

      .release-card{
        padding:11px;
      }

      .cover-wrap{
        width:70px;
        height:70px;
      }

      .release-title{
        font-size:13px;
      }

      .status{
        font-size:8px;
        padding:4px 6px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <img
      src="../assets/dynotic-distribution.png"
      alt="Dynotic Distribution"
    >
  </header>

  <!-- MAIN -->
  <main>

    <!-- CREATE RELEASE -->
    <div
      class="create-card"
      onclick="location.href='../create-release'"
    >
      <div class="create-icon">
        <i class="fa-solid fa-plus"></i>
      </div>

      <div class="create-info">
        <div class="create-title">
          Create New Release
        </div>

        <div class="create-desc">
          Submit your new music release to Dynotic Distribution
        </div>
      </div>

      <div class="create-arrow">
        <i class="fa-solid fa-chevron-right"></i>
      </div>
    </div>

    <!-- RELEASE SECTION -->
    <section class="release-section">

      <div class="release-section-head">
        <h2>My Releases</h2>
        <span class="release-count" id="releaseCount">
          0 Releases
        </span>
      </div>

      <!-- SEARCH -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="text"
          id="searchInput"
          placeholder="Search releases..."
          autocomplete="off"
        >
      </div>

      <!-- LIST -->
      <div id="releaseList">

        <div class="loading">
          <div class="spinner"></div>
          Loading releases...
        </div>

      </div>

      <!-- PAGINATION -->
      <div
        class="pagination"
        id="pagination"
        style="display:none;"
      ></div>

    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a
      href="../home"
      class="nav-item"
    >
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>

    <a
      href="../releases"
      class="nav-item active"
    >
      <i class="fa-solid fa-music"></i>
      <span>Releases</span>
    </a>

    <a
      href="../account"
      class="nav-item"
    >
      <i class="fa-solid fa-user"></i>
      <span>Account</span>
    </a>

  </nav>

  <script>

    /* ================= FIREBASE ================= */

    const firebaseConfig = {
      apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
      authDomain: "dynopay-2513c.firebaseapp.com",
      databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dynopay-2513c",
      storageBucket: "dynopay-2513c.appspot.com",
      messagingSenderId: "105077332742",
      appId: "1:105077332742:web:9e8c4b3f6c4a5c1f"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    /* ================= VARIABLES ================= */

    let allReleases = [];
    let filteredReleases = [];
    let currentPage = 1;

    const perPage = 5;

    /* ================= AUTH ================= */

    auth.onAuthStateChanged(async user => {

      if(!user){
        location.href = "../login";
        return;
      }

      await loadReleases(user.uid);

    });

    /* ================= LOAD RELEASES ================= */

    async function loadReleases(uid){

      const list = document.getElementById("releaseList");

      try{

        const snapshot = await db
          .ref("releases/" + uid)
          .once("value");

        const data = snapshot.val() || {};

        allReleases = Object.entries(data).map(([id, release]) => ({
          id,
          ...release
        }));

        allReleases.sort((a,b) => {

          const aTime =
            a.createdAt ||
            a.timestamp ||
            a.created_at ||
            0;

          const bTime =
            b.createdAt ||
            b.timestamp ||
            b.created_at ||
            0;

          return Number(bTime) - Number(aTime);

        });

        filteredReleases = [...allReleases];

        updateCount();
        render();

      }catch(error){

        console.error(error);

        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <div class="empty-title">
              Failed to load releases
            </div>

            <div class="empty-desc">
              Please try again later.
            </div>
          </div>
        `;

      }

    }

    /* ================= SEARCH ================= */

    document
      .getElementById("searchInput")
      .addEventListener("input", function(){

        const keyword = this.value
          .toLowerCase()
          .trim();

        filteredReleases = allReleases.filter(release => {

          const title =
            String(
              release.title ||
              release.releaseTitle ||
              release.release_name ||
              ""
            ).toLowerCase();

          const artist =
            String(
              release.artist ||
              release.artistName ||
              release.primaryArtist ||
              ""
            ).toLowerCase();

          const label =
            String(
              release.label ||
              release.labelName ||
              ""
            ).toLowerCase();

          return (
            title.includes(keyword) ||
            artist.includes(keyword) ||
            label.includes(keyword)
          );

        });

        currentPage = 1;

        updateCount();
        render();

      });

    /* ================= COUNT ================= */

    function updateCount(){

      const count =
        document.getElementById("releaseCount");

      const total = filteredReleases.length;

      count.textContent =
        total + (total === 1 ? " Release" : " Releases");

    }

    /* ================= RENDER ================= */

    function render(){

      const list =
        document.getElementById("releaseList");

      const pagination =
        document.getElementById("pagination");

      if(!filteredReleases.length){

        list.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              <i class="fa-solid fa-music"></i>
            </div>

            <div class="empty-title">
              No releases found
            </div>

            <div class="empty-desc">
              Your submitted releases will appear here.
            </div>

          </div>
        `;

        pagination.style.display = "none";

        return;

      }

      const totalPages =
        Math.ceil(filteredReleases.length / perPage);

      if(currentPage > totalPages){
        currentPage = totalPages;
      }

      const start =
        (currentPage - 1) * perPage;

      const end =
        start + perPage;

      const items =
        filteredReleases.slice(start, end);

      list.innerHTML =
        items.map(release => {

          return createReleaseHTML(release);

        }).join("");

      pagination.style.display =
        totalPages > 1 ? "flex" : "none";

      renderPagination(totalPages);

    }

    /* ================= RELEASE HTML ================= */

    function createReleaseHTML(release){

      const title =
        release.title ||
        release.releaseTitle ||
        release.release_name ||
        "Untitled Release";

      const artist =
        release.artist ||
        release.artistName ||
        release.primaryArtist ||
        "-";

      const featuring =
        release.featuring ||
        release.featuredArtist ||
        "";

      const upc =
        release.upc ||
        release.UPC ||
        "-";

      const releaseDate =
        release.releaseDate ||
        release.release_date ||
        "-";

      const label =
        release.label ||
        release.labelName ||
        "Dynotic Distribution";

      const cover =
        release.cover ||
        release.coverUrl ||
        release.artwork ||
        release.artworkUrl ||
        "../assets/default-cover.png";

      const statusData =
        getStatus(release);

      const artistText =
        featuring
          ? `${artist} feat. ${featuring}`
          : artist;

      return `

        <div
          class="release-card"
          onclick="openRelease('${escapeAttr(release.id)}')"
        >

          <div class="cover-wrap">

            <img
              src="${escapeAttr(cover)}"
              alt=""
              onload="this.parentElement.classList.add('loaded')"
              onerror="
                this.onerror=null;
                this.src='../assets/default-cover.png';
                this.parentElement.classList.add('loaded');
              "
            >

          </div>

          <div class="release-info">

            <div class="release-top">

              <div class="release-title">
                ${escapeHTML(title)}
              </div>

              <div
                class="status ${statusData.className}"
              >
                ${statusData.label}
              </div>

            </div>

            <div class="release-artist">
              ${escapeHTML(artistText)}
            </div>

            <div class="release-meta">

              <span>
                <i class="fa-solid fa-barcode"></i>
                ${escapeHTML(upc)}
              </span>

              <span>
                <i class="fa-regular fa-calendar"></i>
                ${escapeHTML(formatDate(releaseDate))}
              </span>

            </div>

            <div class="release-meta">

              <span>
                <i class="fa-solid fa-tag"></i>
                ${escapeHTML(label)}
              </span>

            </div>

          </div>

        </div>

      `;

    }

    /* ================= STATUS ================= */

    function getStatus(release){

      const rawStatus =
        String(
          release.status ||
          release.state ||
          ""
        ).toLowerCase()
        .trim();

      if(rawStatus === "proposal"){
        return {
          label:"PROPOSAL",
          className:"status-proposal"
        };
      }

      if(rawStatus === "process" ||
         rawStatus === "processing"){

        return {
          label:"PROCESS",
          className:"status-process pulse"
        };

      }

      if(rawStatus === "rejected" ||
         rawStatus === "reject"){

        return {
          label:"REJECTED",
          className:"status-rejected"
        };

      }

      if(rawStatus === "approved"){

        const releaseDate =
          release.releaseDate ||
          release.release_date ||
          "";

        if(isReleaseLive(releaseDate)){

          return {
            label:"LIVE",
            className:"status-live"
          };

        }

        return {
          label:"APPROVED",
          className:"status-approved"
        };

      }

      if(rawStatus === "live"){

        return {
          label:"LIVE",
          className:"status-live"
        };

      }

      return {
        label:rawStatus
          ? rawStatus.toUpperCase()
          : "PROCESS",
        className:"status-process"
      };

    }

    /* ================= LIVE CHECK ================= */

    function isReleaseLive(date){

      if(!date){
        return false;
      }

      const releaseDate =
        new Date(date);

      if(isNaN(releaseDate.getTime())){
        return false;
      }

      const today =
        new Date();

      today.setHours(0,0,0,0);

      releaseDate.setHours(0,0,0,0);

      return today >= releaseDate;

    }

    /* ================= DATE ================= */

    function formatDate(date){

      if(!date || date === "-"){
        return "-";
      }

      const parsed =
        new Date(date);

      if(isNaN(parsed.getTime())){
        return date;
      }

      return parsed.toLocaleDateString(
        "id-ID",
        {
          day:"2-digit",
          month:"short",
          year:"numeric"
        }
      );

    }

    /* ================= PAGINATION ================= */

    function renderPagination(totalPages){

      const container =
        document.getElementById("pagination");

      let html = "";

      html += `
        <button
          class="page-btn"
          onclick="changePage(${currentPage - 1})"
          ${currentPage === 1 ? "disabled" : ""}
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      `;

      for(let i = 1; i <= totalPages; i++){

        html += `
          <button
            class="page-btn ${i === currentPage ? "active" : ""}"
            onclick="changePage(${i})"
          >
            ${i}
          </button>
        `;

      }

      html += `
        <button
          class="page-btn"
          onclick="changePage(${currentPage + 1})"
          ${currentPage === totalPages ? "disabled" : ""}
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      `;

      container.innerHTML = html;

    }

    function changePage(page){

      const totalPages =
        Math.ceil(filteredReleases.length / perPage);

      if(page < 1 || page > totalPages){
        return;
      }

      currentPage = page;

      render();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }

    /* ================= DETAIL ================= */

    function openRelease(id){

      location.href =
        "../release-detail?rid=" +
        encodeURIComponent(id);

    }

    /* ================= ESCAPE ================= */

    function escapeHTML(value){

      return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }

    function escapeAttr(value){

      return escapeHTML(value);

    }

  </script>

</body>
</html>
