<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Users | Dynotic Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

body {
  font-family: 'Outfit', sans-serif;
  background: #f1f2f7;
  margin: 0;
  padding: 15px;
}

h3 {
  margin-bottom: 8px;
  font-size: 18px;
  color: #111;
}

.card {
  background: #fff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

input,
select,
button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
}

input:focus,
select:focus {
  border-color: #111;
  box-shadow: 0 0 6px rgba(0,0,0,.1);
}

button {
  cursor: pointer;
  transition: 0.25s;
  font-weight: 600;
  border-radius: 6px;
  outline: none;
}

button.register {
  background: #111;
  color: #fff;
}

button.register:hover {
  opacity: 0.9;
}

button.action-btn {
  background: #fff;
  color: #000;
  border: 1px solid #000;
  font-size: 12px;
  margin-right: 4px;
  padding: 6px 10px;
}

button.action-btn:hover {
  background: #f0f0f0;
}


/* =====================================================
   SALDO MODAL
===================================================== */

.saldo-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.saldo-box {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.saldo-box h3 {
  margin: 0 0 5px;
  font-size: 18px;
}

.saldo-current {
  background: #f5f5f7;
  border-radius: 10px;
  padding: 12px;
  margin: 15px 0;
  font-size: 13px;
  color: #666;
}

.saldo-current strong {
  display: block;
  color: #111;
  font-size: 18px;
  margin-top: 3px;
}

.saldo-box label {
  display: block;
  margin-top: 12px;
  font-size: 13px;
  font-weight: 600;
  color: #333;
}

.saldo-box select,
.saldo-box input {
  width: 100%;
  margin-top: 6px;
}

.saldo-buttons {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.saldo-buttons button {
  margin-top: 0;
}

.saldo-cancel {
  background: #f1f1f1;
  color: #111;
  border: none;
}

.saldo-save {
  background: #111;
  color: #fff;
  border: none;
}


/* =====================================================
   TABLE
===================================================== */

.table-container {
  max-height: 500px;
  overflow-y: auto;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 600px;
}

th,
td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid #eee;
}

th {
  background: #f9f9f9;
  font-weight: 600;
}

tr:hover {
  background: #f5f5f5;
}

.status-badge {
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 12px;
}


/* =====================================================
   MESSAGE
===================================================== */

#msg {
  margin-top: 6px;
  font-weight: 600;
}


/* =====================================================
   MENU
===================================================== */

.menu-wrap {
  position: relative;
  display: inline-block;
}

.menu-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

.menu-dropdown {
  display: none;
  position: absolute;
  right: 0;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  min-width: 140px;
  z-index: 99;
  box-shadow: 0 4px 10px rgba(0,0,0,.1);
}

.menu-dropdown button {
  width: 100%;
  border: none;
  background: none;
  padding: 10px;
  font-size: 13px;
  text-align: left;
}

.menu-dropdown button:nth-child(4) {
  color: #ef4444;
  font-weight: 700;
}

.menu-dropdown button:hover {
  background: #f5f5f5;
}

</style>

</head>

<body>


<!-- =====================================================
     ADD USER
===================================================== -->

<div class="card">

  <h3>Add User</h3>

  <input
    id="newEmail"
    placeholder="Email"
  >

  <input
    id="newName"
    placeholder="Name"
  >

  <input
    id="newPassword"
    placeholder="Password"
    type="password"
  >

  <input
    id="newBalance"
    placeholder="Balance"
  >

  <select id="newStatus">

    <option value="active">
      Active
    </option>

    <option value="non-active">
      Non-Active
    </option>

  </select>

  <button
    class="register"
    onclick="addUser()"
  >
    Add User
  </button>

  <div id="msg"></div>

</div>


<!-- =====================================================
     USERS TABLE
===================================================== -->

<div class="card">

  <h3>Users</h3>

  <input
    id="searchInput"
    placeholder="Search user..."
    style="margin-bottom:10px;"
  >

  <div class="table-container">

    <table id="memberTable">

      <thead>

        <tr>

          <th>
            Name
          </th>

          <th>
            Email
          </th>

          <th>
            Balance
          </th>

          <th>
            Status
          </th>

          <th>
            Action
          </th>

        </tr>

      </thead>

      <tbody></tbody>

    </table>


    <div
      style="
        display:flex;
        justify-content:space-between;
        margin-top:10px;
      "
    >

      <button
        onclick="loadMembers('prev')"
      >
        Prev
      </button>

      <button
        onclick="loadMembers('next')"
      >
        Next
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     EDIT SALDO MODAL
===================================================== -->

<div
  id="saldoModal"
  class="saldo-modal"
>

  <div class="saldo-box">

    <h3>
      Edit Saldo
    </h3>

    <div
      style="
        font-size:13px;
        color:#777;
      "
    >
      Ubah saldo user
    </div>

    <div class="saldo-current">

      Saldo saat ini

      <strong id="modalCurrentSaldo">
        Rp 0
      </strong>

    </div>

    <label>
      Jenis perubahan
    </label>

    <select id="saldoAction">

      <option value="add">
        ＋ Tambah Saldo
      </option>

      <option value="subtract">
        － Kurangi Saldo
      </option>

    </select>

    <label>
      Nominal
    </label>

    <input
      id="saldoAmount"
      type="number"
      min="1"
      placeholder="Contoh: 100000"
    >

    <div class="saldo-buttons">

      <button
        class="saldo-cancel"
        onclick="closeSaldoModal()"
      >
        Batal
      </button>

      <button
        class="saldo-save"
        onclick="saveSaldo()"
      >
        Simpan
      </button>

    </div>

  </div>

</div>


<script>


/* =====================================================
   FIREBASE
===================================================== */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const auth =
  firebase.auth();


const db =
  firebase.database();


/* =====================================================
   SECONDARY FIREBASE APP
===================================================== */

const secondaryApp =
  firebase.initializeApp(
    firebase.app().options,
    "Secondary"
  );


const secondaryAuth =
  secondaryApp.auth();


let isRegistering =
  false;


/* =====================================================
   AUTH CHECK
===================================================== */

auth.onAuthStateChanged(
  user => {

    if (isRegistering) {
      return;
    }


    if (!user) {

      location.href =
        "../admin";

      return;

    }


    db.ref(
      "admins/" + user.uid
    )
    .once("value")

    .then(
      snapshot => {

        if (!snapshot.exists()) {

          alert(
            "⚠ Anda bukan admin!"
          );

          auth.signOut()
            .then(
              () =>
                location.href =
                  "../admin"
            );

        }

      }
    )

    .catch(
      err => {

        console.error(
          err
        );

        auth.signOut()
          .then(
            () =>
              location.href =
                "../admin"
          );

      }
    );

  }
);


/* =====================================================
   ADD USER
===================================================== */

function addUser() {

  if (isRegistering) {
    return;
  }


  isRegistering =
    true;


  const email =
    document
      .getElementById("newEmail")
      .value
      .trim();


  const name =
    document
      .getElementById("newName")
      .value
      .trim();


  const password =
    document
      .getElementById("newPassword")
      .value
      .trim();


  const balance =
    Number(
      document
        .getElementById("newBalance")
        .value
        .trim()
    );


  const status =
    document
      .getElementById("newStatus")
      .value;


  const msg =
    document
      .getElementById("msg");


  if (
    !email ||
    !name ||
    !password ||
    isNaN(balance)
  ) {

    msg.style.color =
      "red";

    msg.innerHTML =
      "⚠ Semua field harus diisi dengan benar!";

    isRegistering =
      false;

    return;

  }


  secondaryAuth

    .createUserWithEmailAndPassword(
      email,
      password
    )

    .then(
      res => {

        const uid =
          res.user.uid;


        /*
         * Kirim email verification
         */

        res.user
          .sendEmailVerification();


        return db
          .ref(
            "users/" + uid
          )
          .set({

            email:
              email,

            nama:
              name,

            saldo:
              balance,

            status:
              status,

            createdAt:
              Date.now()

          });

      }
    )

    .then(
      () => {

        msg.style.color =
          "green";


        msg.innerHTML =
          "✔ User berhasil dibuat dan email verifikasi terkirim!";


        [
          "newEmail",
          "newName",
          "newPassword",
          "newBalance"
        ]
        .forEach(
          id =>
            document
              .getElementById(id)
              .value = ""
        );


        document
          .getElementById(
            "newStatus"
          )
          .value =
          "active";


        secondaryAuth
          .signOut();


        loadMembers();


        isRegistering =
          false;

      }
    )

    .catch(
      err => {

        msg.style.color =
          "red";


        msg.innerHTML =
          "❌ " + err.message;


        isRegistering =
          false;

      }
    );

}


/* =====================================================
   PAGINATION
===================================================== */

let pageSize =
  50;

let firstKey =
  null;

let lastKey =
  null;

let pageStack =
  [];

let searchTerm =
  "";


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    e => {

      searchTerm =
        e.target.value
          .trim()
          .toLowerCase();


      firstKey =
        null;

      lastKey =
        null;

      pageStack =
        [];


      loadMembers();

    }
  );


/* =====================================================
   LOAD MEMBERS
===================================================== */

function loadMembers(
  direction = "init"
) {

  const tbody =
    document.querySelector(
      "#memberTable tbody"
    );


  tbody.innerHTML =
    "";


  /* ===================================================
     SEARCH
  =================================================== */

  if (searchTerm) {

    db.ref("users")
      .once("value")

      .then(
        snap => {

          if (!snap.exists()) {

            tbody.innerHTML = `

              <tr>

                <td
                  colspan="5"
                  style="text-align:center;"
                >
                  User tidak ditemukan
                </td>

              </tr>

            `;

            return;

          }


          let found =
            false;


          snap.forEach(
            u => {

              const d =
                u.val();


              const namaLower =
                String(
                  d.nama || ""
                )
                .toLowerCase();


              const emailLower =
                String(
                  d.email || ""
                )
                .toLowerCase();


              if (
                namaLower.includes(
                  searchTerm
                ) ||
                emailLower.includes(
                  searchTerm
                )
              ) {

                found =
                  true;


                const saldo =
                  Number(
                    d.saldo || 0
                  );


                const saldoFormatted =
                  "Rp " +
                  saldo.toLocaleString(
                    "id-ID"
                  );


                const statusLabel =
                  d.status === "active"

                    ? `
                      <span
                        class="status-badge"
                        style="
                          background:#34d399;
                          color:#fff
                        "
                      >
                        Active
                      </span>
                    `

                    : `
                      <span
                        class="status-badge"
                        style="
                          background:#f87171;
                          color:#fff
                        "
                      >
                        Non-Active
                      </span>
                    `;


                const tr =
                  document.createElement(
                    "tr"
                  );


                tr.innerHTML = `

                  <td>
                    ${d.nama || "-"}
                  </td>

                  <td>
                    ${d.email || "-"}
                  </td>

                  <td>
                    ${saldoFormatted}
                  </td>

                  <td>
                    ${statusLabel}
                  </td>

                  <td
                    style="
                      display:flex;
                      gap:6px;
                      align-items:center
                    "
                  >

                    <button
                      class="action-btn"
                      onclick="
                        window.location.href=
                        '../admin-userdetail?uid=${u.key}'
                      "
                    >
                      Detail
                    </button>


                    <div class="menu-wrap">

                      <button
                        class="menu-btn"
                        onclick="toggleMenu(this)"
                      >
                        ⋮
                      </button>


                      <div
                        class="menu-dropdown"
                      >

                        <button
                          onclick="
                            toggleStatus(
                              '${u.key}',
                              '${d.status}'
                            )
                          "
                        >
                          ${
                            d.status === "active"
                              ? "Disable"
                              : "Activate"
                          }
                        </button>


                        <button
                          onclick="
                            editSaldo(
                              '${u.key}'
                            )
                          "
                        >
                          Edit Saldo
                        </button>


                        <button
                          onclick="
                            changeEmail(
                              '${u.key}',
                              '${d.email || ""}'
                            )
                          "
                        >
                          Ganti Email
                        </button>


                        <button
                          onclick="
                            deleteMember(
                              '${u.key}'
                            )
                          "
                        >
                          Hapus
                        </button>

                      </div>

                    </div>

                  </td>

                `;


                tbody.appendChild(
                  tr
                );

              }

            }
          );


          if (!found) {

            tbody.innerHTML = `

              <tr>

                <td
                  colspan="5"
                  style="
                    text-align:center;
                    padding:20px;
                  "
                >

                  User
                  "<strong>
                    ${searchTerm}
                  </strong>"
                  tidak ditemukan

                </td>

              </tr>

            `;

          }

        }
      )

      .catch(
        err => {

          console.error(
            err
          );


          tbody.innerHTML = `

            <tr>

              <td
                colspan="5"
                style="
                  text-align:center;
                  color:red;
                "
              >
                Gagal mencari user
              </td>

            </tr>

          `;

        }
      );


    return;

  }


  /* ===================================================
     NORMAL LOAD
  =================================================== */

  let ref =
    db
      .ref("users")
      .orderByKey()
      .limitToFirst(
        pageSize
      );


  /* ===================================================
     NEXT
  =================================================== */

  if (
    direction === "next" &&
    lastKey
  ) {

    pageStack.push(
      firstKey
    );


    ref =
      db
        .ref("users")
        .orderByKey()
        .startAfter(
          lastKey
        )
        .limitToFirst(
          pageSize
        );

  }


  /* ===================================================
     PREVIOUS
  =================================================== */

  if (
    direction === "prev" &&
    pageStack.length
  ) {

    const prevKey =
      pageStack.pop();


    ref =
      db
        .ref("users")
        .orderByKey()
        .startAt(
          prevKey
        )
        .limitToFirst(
          pageSize
        );

  }


  ref.once("value")

    .then(
      snap => {

        if (!snap.exists()) {

          tbody.innerHTML = `

            <tr>

              <td
                colspan="5"
                style="text-align:center;"
              >
                Tidak ada user
              </td>

            </tr>

          `;

          return;

        }


        let keys =
          [];


        snap.forEach(
          u => {

            const d =
              u.val();


            keys.push(
              u.key
            );


            const saldo =
              Number(
                d.saldo || 0
              );


            const saldoFormatted =
              "Rp " +
              saldo.toLocaleString(
                "id-ID"
              );


            const statusLabel =
              d.status === "active"

                ? `
                  <span
                    class="status-badge"
                    style="
                      background:#34d399;
                      color:#fff
                    "
                  >
                    Active
                  </span>
                `

                : `
                  <span
                    class="status-badge"
                    style="
                      background:#f87171;
                      color:#fff
                    "
                  >
                    Non-Active
                  </span>
                `;


            const tr =
              document.createElement(
                "tr"
              );


            tr.innerHTML = `

              <td>
                ${d.nama || "-"}
              </td>

              <td>
                ${d.email || "-"}
              </td>

              <td>
                ${saldoFormatted}
              </td>

              <td>
                ${statusLabel}
              </td>

              <td
                style="
                  display:flex;
                  gap:6px;
                  align-items:center
                "
              >

                <button
                  class="action-btn"
                  onclick="
                    window.location.href=
                    '../admin-userdetail?uid=${u.key}'
                  "
                >
                  Detail
                </button>


                <div class="menu-wrap">

                  <button
                    class="menu-btn"
                    onclick="toggleMenu(this)"
                  >
                    ⋮
                  </button>


                  <div
                    class="menu-dropdown"
                  >

                    <button
                      onclick="
                        toggleStatus(
                          '${u.key}',
                          '${d.status}'
                        )
                      "
                    >
                      ${
                        d.status === "active"
                          ? "Disable"
                          : "Activate"
                      }
                    </button>


                    <button
                      onclick="
                        editSaldo(
                          '${u.key}'
                        )
                      "
                    >
                      Edit Saldo
                    </button>


                    <button
                      onclick="
                        changeEmail(
                          '${u.key}',
                          '${d.email || ""}'
                        )
                      "
                    >
                      Ganti Email
                    </button>


                    <button
                      onclick="
                        deleteMember(
                          '${u.key}'
                        )
                      "
                    >
                      Hapus
                    </button>

                  </div>

                </div>

              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );


        firstKey =
          keys[0];


        lastKey =
          keys[
            keys.length - 1
          ];

      }
    )

    .catch(
      err => {

        console.error(
          err
        );


        tbody.innerHTML = `

          <tr>

            <td
              colspan="5"
              style="
                text-align:center;
                color:red;
              "
            >
              Gagal memuat user
            </td>

          </tr>

        `;

      }
    );

}


/* =====================================================
   MENU TOGGLE
===================================================== */

function toggleMenu(btn) {

  document
    .querySelectorAll(
      ".menu-dropdown"
    )
    .forEach(
      m => {

        if (
          m !==
          btn.nextElementSibling
        ) {

          m.style.display =
            "none";

        }

      }
    );


  const menu =
    btn.nextElementSibling;


  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}


document.addEventListener(
  "click",
  e => {

    if (
      !e.target.closest(
        ".menu-wrap"
      )
    ) {

      document
        .querySelectorAll(
          ".menu-dropdown"
        )
        .forEach(
          m =>
            m.style.display =
              "none"
        );

    }

  }
);


/* =====================================================
   EDIT SALDO
===================================================== */

let saldoEditingUid =
  null;

let saldoCurrentValue =
  0;


function editSaldo(uid) {

  db.ref(
    `users/${uid}/saldo`
  )
  .once("value")

  .then(
    snap => {

      saldoEditingUid =
        uid;


      saldoCurrentValue =
        Number(
          snap.val() || 0
        );


      document
        .getElementById(
          "modalCurrentSaldo"
        )
        .textContent =
          "Rp " +
          saldoCurrentValue
            .toLocaleString(
              "id-ID"
            );


      document
        .getElementById(
          "saldoAction"
        )
        .value =
          "add";


      document
        .getElementById(
          "saldoAmount"
        )
        .value =
          "";


      document
        .getElementById(
          "saldoModal"
        )
        .style.display =
          "flex";


      setTimeout(
        () => {

          const amountInput =
            document.getElementById(
              "saldoAmount"
            );


          if (amountInput) {

            amountInput.focus();

          }

        },
        100
      );

    }
  )

  .catch(
    err => {

      console.error(
        "Edit saldo error:",
        err
      );


      alert(
        "Gagal mengambil saldo user.\n\n" +
        err.message
      );

    }
  );

}


/* =====================================================
   CLOSE SALDO MODAL
===================================================== */

function closeSaldoModal() {

  document
    .getElementById(
      "saldoModal"
    )
    .style.display =
    "none";


  saldoEditingUid =
    null;


  saldoCurrentValue =
    0;

}


/* =====================================================
   SAVE SALDO
===================================================== */

function saveSaldo() {

  if (!saldoEditingUid) {

    alert(
      "User tidak ditemukan."
    );

    return;

  }


  const action =
    document
      .getElementById(
        "saldoAction"
      )
      .value;


  const amount =
    Number(
      document
        .getElementById(
          "saldoAmount"
        )
        .value
    );


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Nominal harus lebih dari 0."
    );

    return;

  }


  let newSaldo =
    saldoCurrentValue;


  if (
    action === "add"
  ) {

    newSaldo +=
      amount;

  } else {

    newSaldo -=
      amount;

  }


  if (newSaldo < 0) {

    alert(
      "Saldo tidak boleh menjadi negatif."
    );

    return;

  }


  db.ref(
    `users/${saldoEditingUid}/saldo`
  )
  .set(
    newSaldo
  )

  .then(
    () => {

      closeSaldoModal();


      alert(
        "Saldo berhasil diperbarui.\n\n" +
        "Saldo baru: Rp " +
        newSaldo.toLocaleString(
          "id-ID"
        )
      );


      loadMembers();

    }
  )

  .catch(
    err => {

      console.error(
        "Save saldo error:",
        err
      );


      alert(
        "Gagal memperbarui saldo.\n\n" +
        err.message
      );

    }
  );

}


/* =====================================================
   TOGGLE STATUS
===================================================== */

function toggleStatus(
  uid,
  currentStatus
) {

  const newStatus =
    currentStatus === "active"
      ? "non-active"
      : "active";


  const text =
    newStatus === "active"
      ? "mengaktifkan"
      : "menonaktifkan";


  const confirmed =
    confirm(
      `Yakin ingin ${text} user ini?`
    );


  if (!confirmed) {
    return;
  }


  db.ref(
    `users/${uid}/status`
  )
  .set(
    newStatus
  )

  .then(
    () => {

      alert(
        newStatus === "active"
          ? "User berhasil diaktifkan."
          : "User berhasil dinonaktifkan."
      );


      loadMembers();

    }
  )

  .catch(
    err => {

      console.error(
        "Toggle status error:",
        err
      );


      alert(
        "Gagal mengubah status user.\n\n" +
        err.message
      );

    }
  );

}


/* =====================================================
   DELETE MEMBER
===================================================== */

function deleteMember(
  uid
) {

  const confirmed =
    confirm(
      "Apakah yakin ingin menghapus data user ini dari database?"
    );


  if (!confirmed) {
    return;
  }


  db.ref(
    `users/${uid}`
  )
  .remove()

  .then(
    () => {

      alert(
        "Data user berhasil dihapus dari database."
      );


      loadMembers();

    }
  )

  .catch(
    err => {

      console.error(
        "Delete user error:",
        err
      );


      alert(
        "Gagal menghapus user.\n\n" +
        err.message
      );

    }
  );

}


/* =====================================================
   GANTI EMAIL
   =====================================================

   BAGIAN INI YANG KITA PERBAIKI
   UNTUK DEBUG WORKER.

===================================================== */

async function changeEmail(
  uid,
  currentEmail
) {

  /*
   * Popup input email
   */

  const email =
    prompt(

      "Ganti email user\n\n" +

      "Email sekarang:\n" +

      (currentEmail || "-") +

      "\n\n" +

      "Masukkan email baru:"

    );


  if (
    email === null
  ) {

    return;

  }


  const newEmail =
    email
      .trim()
      .toLowerCase();


  /*
   * Validasi kosong
   */

  if (!newEmail) {

    alert(
      "Email baru wajib diisi."
    );

    return;

  }


  /*
   * Validasi format email
   */

  if (
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(newEmail)
  ) {

    alert(
      "Format email tidak valid."
    );

    return;

  }


  /*
   * Konfirmasi
   */

  const confirmChange =
    confirm(

      "Yakin ingin mengganti email?\n\n" +

      "Dari:\n" +

      (currentEmail || "-") +

      "\n\n" +

      "Menjadi:\n" +

      newEmail

    );


  if (!confirmChange) {

    return;

  }


  try {

    /*
     * Ambil admin yang sedang login
     */

    const adminUser =
      firebase.auth().currentUser;


    if (!adminUser) {

      alert(
        "Sesi admin tidak ditemukan.\n\n" +
        "Silakan login kembali."
      );

      return;

    }


    /*
     * Refresh Firebase ID Token
     *
     * Token ini yang dikirim
     * ke Worker.
     */

    const idToken =
      await adminUser.getIdToken(
        true
      );


    /*
     * DEBUG TOKEN
     *
     * Jangan pernah menampilkan
     * token aslinya ke user.
     */

    console.log(
      "Admin UID:",
      adminUser.uid
    );


    console.log(
      "Firebase ID Token berhasil didapat."
    );


    /*
     * Panggil Worker
     */

    const response =
      await fetch(

        "https://dynotic-auth-admin.dynotic-bot.workers.dev",

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${idToken}`

          },

          body:
            JSON.stringify({

              uid:
                uid,

              newEmail:
                newEmail

            })

        }

      );


    /*
     * =================================================
     * BACA RESPONSE SEBAGAI TEXT TERLEBIH DAHULU
     * =================================================
     *
     * Ini sengaja.
     *
     * Kalau Worker mengirim JSON:
     *   kita parse JSON.
     *
     * Kalau Worker malah mengirim
     * HTML / text / error lain:
     *   kita tetap bisa melihat response-nya.
     */

    const responseText =
      await response.text();


    console.log(
      "================================="
    );

    console.log(
      "DYNOTIC AUTH WORKER RESPONSE"
    );

    console.log(
      "HTTP STATUS:",
      response.status
    );

    console.log(
      "RAW RESPONSE:",
      responseText
    );

    console.log(
      "================================="
    );


    let data;


    /*
     * Coba parse JSON
     */

    try {

      data =
        JSON.parse(
          responseText
        );

    }

    catch (parseError) {

      /*
       * Kalau bukan JSON,
       * tetap simpan response
       */

      console.error(
        "Worker response bukan JSON:",
        parseError
      );


      data = {

        success:
          false,

        error:
          "Worker mengirim response yang bukan JSON.",

        detail:
          responseText

      };

    }


    console.log(
      "Parsed Worker Data:",
      data
    );


    /*
     * =================================================
     * WORKER ERROR
     * =================================================
     */

    if (
      !response.ok ||
      !data.success
    ) {

      let errorMessage =
        data.error ||
        "Unknown error";


      /*
       * HTTP status asli
       */

      errorMessage +=
        "\n\nHTTP Status: " +
        response.status;


      /*
       * Status yang dikirim Worker
       */

      if (
        data.status
      ) {

        errorMessage +=
          "\nWorker Status: " +
          data.status;

      }


      /*
       * Detail error Worker
       */

      if (
        data.detail
      ) {

        let detail;


        if (
          typeof data.detail ===
          "string"
        ) {

          detail =
            data.detail;

        }

        else {

          try {

            detail =
              JSON.stringify(
                data.detail,
                null,
                2
              );

          }

          catch {

            detail =
              String(
                data.detail
              );

          }

        }


        errorMessage +=
          "\n\nDetail:\n" +
          detail;

      }


      /*
       * Tampilkan error lengkap
       */

      alert(

        "GAGAL MENGUBAH EMAIL\n\n" +

        errorMessage

      );


      return;

    }


    /*
     * =================================================
     * AUTH BERHASIL
     * TAPI RTDB WARNING
     * =================================================
     */

    if (
      data.warning
    ) {

      alert(

        "EMAIL AUTH BERHASIL DIUBAH\n\n" +

        "Email baru:\n" +

        (
          data.email ||
          newEmail
        ) +

        "\n\n" +

        "WARNING:\n" +

        data.warning

      );


      loadMembers();


      return;

    }


    /*
     * =================================================
     * BERHASIL
     * =================================================
     */

    alert(

      "EMAIL BERHASIL DIUBAH\n\n" +

      "Email baru:\n" +

      (
        data.email ||
        newEmail
      )

    );


    /*
     * Refresh tabel
     */

    loadMembers();

  }


  catch (
    error
  ) {

    /*
     * Error JS / Network / CORS
     */

    console.error(
      "changeEmail error:",
      error
    );


    alert(

      "ERROR SCRIPT / NETWORK\n\n" +

      (
        error.message ||
        String(error)
      )

    );

  }

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadMembers();

</script>
