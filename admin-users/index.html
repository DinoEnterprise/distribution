<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Users | Dynotic Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

body {
  font-family: 'Outfit', sans-serif;
  background: #f1f2f7;
  margin: 0;
  padding: 15px;
}

h3 {
  margin-bottom: 8px;
  font-size: 18px;
  color: #111;
}

.card {
  background: #fff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

input,
select,
button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
}

input:focus,
select:focus {
  border-color: #111;
  box-shadow: 0 0 6px rgba(0,0,0,.1);
}

button {
  cursor: pointer;
  transition: 0.25s;
  font-weight: 600;
  border-radius: 6px;
  outline: none;
}

button.register {
  background: #111;
  color: #fff;
}

button.register:hover {
  opacity: 0.9;
}

button.action-btn {
  background: #fff;
  color: #000;
  border: 1px solid #000;
  font-size: 12px;
  margin-right: 4px;
  padding: 6px 10px;
}

button.action-btn:hover {
  background: #f0f0f0;
}


/* =====================================================
   SALDO MODAL
===================================================== */

.saldo-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.saldo-box {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.saldo-box h3 {
  margin: 0 0 5px;
  font-size: 18px;
}

.saldo-current {
  background: #f5f5f7;
  border-radius: 10px;
  padding: 12px;
  margin: 15px 0;
  font-size: 13px;
  color: #666;
}

.saldo-current strong {
  display: block;
  color: #111;
  font-size: 18px;
  margin-top: 3px;
}

.saldo-box label {
  display: block;
  margin-top: 12px;
  font-size: 13px;
  font-weight: 600;
  color: #333;
}

.saldo-box select,
.saldo-box input {
  width: 100%;
  margin-top: 6px;
}

.saldo-buttons {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.saldo-buttons button {
  margin-top: 0;
}

.saldo-cancel {
  background: #f1f1f1;
  color: #111;
  border: none;
}

.saldo-save {
  background: #111;
  color: #fff;
  border: none;
}


/* =====================================================
   TABLE
===================================================== */

.table-container {
  max-height: 500px;
  overflow-y: auto;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 600px;
}

th,
td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid #eee;
}

th {
  background: #f9f9f9;
  font-weight: 600;
}

tr:hover {
  background: #f5f5f5;
}

.status-badge {
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 12px;
}


/* =====================================================
   MESSAGE
===================================================== */

#msg {
  margin-top: 6px;
  font-weight: 600;
}


/* =====================================================
   MENU
===================================================== */

.menu-wrap {
  position: relative;
  display: inline-block;
}

.menu-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

.menu-dropdown {
  display: none;
  position: absolute;
  right: 0;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  min-width: 140px;
  z-index: 99;
  box-shadow: 0 4px 10px rgba(0,0,0,.1);
}

.menu-dropdown button {
  width: 100%;
  border: none;
  background: none;
  padding: 10px;
  font-size: 13px;
  text-align: left;
}

.menu-dropdown button:nth-child(4) {
  color: #ef4444;
  font-weight: 700;
}

.menu-dropdown button:hover {
  background: #f5f5f5;
}


/* =====================================================
   CUSTOM ALERT / CONFIRM / EMAIL MODAL
===================================================== */

.custom-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 20000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.custom-modal.show {
  display: flex;
}

.custom-box {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 0 10px 35px rgba(0,0,0,.2);
  animation: modalIn .18s ease;
}

@keyframes modalIn {

  from {
    opacity: 0;
    transform: scale(.96) translateY(8px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

}

.custom-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #f1f1f1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
}

.custom-title {
  font-size: 17px;
  font-weight: 700;
  color: #111;
  margin-bottom: 7px;
}

.custom-message {
  font-size: 13px;
  line-height: 1.55;
  color: #666;
  white-space: pre-line;
}

.custom-buttons {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.custom-buttons button {
  margin-top: 0;
}

.custom-cancel {
  background: #f1f1f1;
  color: #111;
  border: none;
}

.custom-confirm {
  background: #111;
  color: #fff;
  border: none;
}

.custom-danger {
  background: #ef4444;
  color: #fff;
  border: none;
}

.custom-input {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 14px;
  outline: none;
}

.custom-input:focus {
  border-color: #111;
  box-shadow: 0 0 6px rgba(0,0,0,.1);
}

.custom-email-current {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 9px;
  background: #f5f5f7;
  font-size: 12px;
  color: #666;
  word-break: break-word;
}

.custom-email-current strong {
  display: block;
  color: #111;
  font-size: 13px;
  margin-top: 3px;
}


/* =====================================================
   LOADING
===================================================== */

.custom-loading {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,.65);
  z-index: 30000;
  align-items: center;
  justify-content: center;
}

.custom-loading.show {
  display: flex;
}

.loading-box {
  background: #fff;
  padding: 18px 22px;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
  font-size: 14px;
  font-weight: 600;
  color: #111;
}

</style>

</head>

<body>


<!-- =====================================================
     ADD USER
===================================================== -->

<div class="card">

  <h3>Add User</h3>

  <input
    id="newEmail"
    placeholder="Email"
  >

  <input
    id="newName"
    placeholder="Name"
  >

  <input
    id="newPassword"
    placeholder="Password"
    type="password"
  >

  <input
    id="newBalance"
    placeholder="Balance"
  >

  <select id="newStatus">

    <option value="active">
      Active
    </option>

    <option value="non-active">
      Non-Active
    </option>

  </select>

  <button
    class="register"
    onclick="addUser()"
  >
    Add User
  </button>

  <div id="msg"></div>

</div>


<!-- =====================================================
     USERS TABLE
===================================================== -->

<div class="card">

  <h3>Users</h3>

  <input
    id="searchInput"
    placeholder="Search user..."
    style="margin-bottom:10px;"
  >

  <div class="table-container">

    <table id="memberTable">

      <thead>

        <tr>

          <th>
            Name
          </th>

          <th>
            Email
          </th>

          <th>
            Balance
          </th>

          <th>
            Status
          </th>

          <th>
            Action
          </th>

        </tr>

      </thead>

      <tbody></tbody>

    </table>


    <div
      style="
        display:flex;
        justify-content:space-between;
        margin-top:10px;
      "
    >

      <button
        onclick="loadMembers('prev')"
      >
        Prev
      </button>

      <button
        onclick="loadMembers('next')"
      >
        Next
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     EDIT SALDO MODAL
===================================================== -->

<div
  id="saldoModal"
  class="saldo-modal"
>

  <div class="saldo-box">

    <h3>
      Edit Saldo
    </h3>

    <div
      style="
        font-size:13px;
        color:#777;
      "
    >
      Ubah saldo user
    </div>

    <div class="saldo-current">

      Saldo saat ini

      <strong id="modalCurrentSaldo">
        Rp 0
      </strong>

    </div>

    <label>
      Jenis perubahan
    </label>

    <select id="saldoAction">

      <option value="add">
        ＋ Tambah Saldo

</div>


<!-- =====================================================
     CUSTOM INFORMATION MODAL
===================================================== -->

<div
  id="customAlert"
  class="custom-modal"
>

  <div class="custom-box">

    <div
      id="alertIcon"
      class="custom-icon"
    >
      !
    </div>

    <div
      id="alertTitle"
      class="custom-title"
    >
      Informasi
    </div>

    <div
      id="alertMessage"
      class="custom-message"
    ></div>

    <div class="custom-buttons">

      <button
        class="custom-confirm"
        onclick="closeCustomAlert()"

        OK

    </div>

  </div>

</div>


<!-- =====================================================
     CUSTOM CONFIRM MODAL
===================================================== -->

<div
  id="customConfirm"
  class="custom-modal"
>

  <div class="custom-box">

    <div
      id="confirmIcon"
      class="custom-icon"
    >
      ?
    </div>

    <div
      id="confirmTitle"
      class="custom-title"
    >
      Konfirmasi
    </div>

    <div
      id="confirmMessage"
      class="custom-message"
    ></div>

    <div class="custom-buttons">

      <button
        class="custom-cancel"

      </button>

      <button

        onclick="closeCustomConfirm(true)"

  </div>

</div>


<!-- =====================================================
     CUSTOM EMAIL MODAL
===================================================== -->

<div
  id="emailModal"
  class="custom-modal"
>

  <div class="custom-box">

    <div class="custom-icon">
      @
    </div>

    <div class="custom-title">
      Ganti Email
    </div>

    <div class="custom-message">
      Masukkan email baru untuk user ini.
    </div>

    <div class="custom-email-current">

      Email sekarang

      <strong id="currentEmailDisplay">
        -
      </strong>

    </div>

    <input
      id="newEmailModal"
      class="custom-input"
      type="email"
      placeholder="Masukkan email baru"
      autocomplete="off"
    >

    <div class="custom-buttons">

      <button
        class="custom-cancel"
        onclick="closeEmailModal()"
      >
        Batal
      </button>

      <button
        class="custom-confirm"
        onclick="submitEmailChange()"
      >
        Lanjutkan
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div
  id="customLoading"
  class="custom-loading"
>

  <div class="loading-box">
    Memproses...
  </div>

</div>


<script>


/* =====================================================
   FIREBASE
===================================================== */

firebase.initializeApp({

  apiKey:
    "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:
    "dynopay-2513c.firebaseapp.com",

  databaseURL:
    "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const auth =
  firebase.auth();


const db =
  firebase.database();


/* =====================================================
   SECONDARY FIREBASE APP
===================================================== */

const secondaryApp =
  firebase.initializeApp(
    firebase.app().options,
    "Secondary"
  );


const secondaryAuth =
  secondaryApp.auth();


let isRegistering =
  false;


/* =====================================================
   CUSTOM MODAL SYSTEM
===================================================== */

function showAlert(
  message,
  title = "Informasi",
  icon = "!"
) {

  document.getElementById(
    "alertTitle"
  ).textContent =
    title;


  document.getElementById(
    "alertMessage"
  ).textContent =
    message;


  document.getElementById(
    "alertIcon"
  ).textContent =
    icon;


  document.getElementById(
    "customAlert"
  ).classList.add(
    "show"
  );

}


function closeCustomAlert() {

  document.getElementById(
    "customAlert"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   CUSTOM CONFIRM
===================================================== */

let confirmResolver =
  null;


function showConfirm(
  message,
  title = "Konfirmasi",
  icon = "?",
  buttonText = "Lanjutkan",
  danger = false
) {

  return new Promise(
    resolve => {

      confirmResolver =
        resolve;


      document.getElementById(
        "confirmTitle"
      ).textContent =
        title;


      document.getElementById(
        "confirmMessage"
      ).textContent =
        message;


      document.getElementById(
        "confirmIcon"
      ).textContent =
        icon;


      const button =
        document.getElementById(
          "confirmActionButton"
        );


      button.textContent =
        buttonText;


      button.className =
        danger
          ? "custom-danger"
          : "custom-confirm";


      button.style.marginTop =
        "0";


      document.getElementById(
        "customConfirm"
      ).classList.add(
        "show"
      );

    }
  );

}


function closeCustomConfirm(
  result
) {

  document.getElementById(
    "customConfirm"
  ).classList.remove(
    "show"
  );


  if (
    confirmResolver
  ) {

    const resolve =
      confirmResolver;


    confirmResolver =
      null;


    resolve(result);

  }

}


/* =====================================================
   CLOSE MODALS WHEN CLICK OUTSIDE
===================================================== */

document.addEventListener(
  "click",
  e => {

    if (
      e.target.id ===
      "customAlert"
    ) {

      closeCustomAlert();

    }


    if (
      e.target.id ===
      "customConfirm"
    ) {

      closeCustomConfirm(
        false
      );

    }


    if (
      e.target.id ===
      "emailModal"
    ) {

      closeEmailModal();

    }

  }
);


/* =====================================================
   LOADING
===================================================== */

function showLoading(
  text = "Memproses..."
) {

  document.querySelector(
    "#customLoading .loading-box"
  ).textContent =
    text;


  document.getElementById(
    "customLoading"
  ).classList.add(
    "show"
  );

}


function hideLoading() {

  document.getElementById(
    "customLoading"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   AUTH CHECK
===================================================== */

auth.onAuthStateChanged(
  user => {

    if (isRegistering) {
      return;
    }


    if (!user) {

      location.href =
        "../admin";

      return;

    }


    db.ref(
      "admins/" + user.uid
    )
    .once("value")

    .then(
      snapshot => {

        if (!snapshot.exists()) {

          showAlert(
            "Akun ini tidak memiliki akses sebagai admin.",
            "Akses Ditolak",
            "!"
          );


          auth.signOut()
            .then(
              () =>
                location.href =
                  "../admin"
            );

        }

      }
    )

    .catch(
      err => {

        console.error(
          err
        );

        auth.signOut()
          .then(
            () =>
              location.href =
                "../admin"
          );

      }
    );

  }
);


/* =====================================================
   ADD USER
===================================================== */

function addUser() {

  if (isRegistering) {
    return;
  }


  isRegistering =
    true;


  const email =
    document
      .getElementById("newEmail")
      .value
      .trim();


  const name =
    document
      .getElementById("newName")
      .value
      .trim();


  const password =
    document
      .getElementById("newPassword")
      .value
      .trim();


  const balance =
    Number(
      document
        .getElementById("newBalance")
        .value
        .trim()
    );


  const status =
    document
      .getElementById("newStatus")
      .value;


  const msg =
    document
      .getElementById("msg");


  if (
    !email ||
    !name ||
    !password ||
    isNaN(balance)
  ) {

    msg.style.color =
      "red";


    msg.innerHTML =
      "⚠ Semua field harus diisi dengan benar!";


    isRegistering =
      false;


    return;

  }


  secondaryAuth

    .createUserWithEmailAndPassword(
      email,
      password
    )

    .then(
      res => {

        const uid =
          res.user.uid;


        return res.user
          .sendEmailVerification()
          .catch(
            err => {

              console.error(
                "Verification email error:",
                err
              );

            }
          )

          .then(
            () => {

              return db
                .ref(
                  "users/" + uid
                )
                .set({

                  email:
                    email,

                  nama:
                    name,

                  saldo:
                    balance,

                  status:
                    status,

                  createdAt:
                    Date.now()

                });

            }
          );

      }
    )

    .then(
      () => {

        msg.style.color =
          "green";


        msg.innerHTML =
          "✔ User berhasil dibuat dan email verifikasi terkirim!";


        [
          "newEmail",
          "newName",
          "newPassword",
          "newBalance"
        ]
        .forEach(
          id =>
            document
              .getElementById(id)
              .value = ""
        );


        document
          .getElementById(
            "newStatus"
          )
          .value =
          "active";


        secondaryAuth
          .signOut();


        loadMembers();


        isRegistering =
          false;

      }
    )

    .catch(
      err => {

        msg.style.color =
          "red";


        msg.innerHTML =
          "❌ " + err.message;


        isRegistering =
          false;

      }
    );

}


/* =====================================================
   PAGINATION
===================================================== */

let pageSize =
  50;

let firstKey =
  null;

let lastKey =
  null;

let pageStack =
  [];

let searchTerm =
  "";


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    e => {

      searchTerm =
        e.target.value
          .trim()
          .toLowerCase();


      firstKey =
        null;

      lastKey =
        null;

      pageStack =
        [];


      loadMembers();

    }
  );


/* =====================================================
   LOAD MEMBERS
===================================================== */

function loadMembers(
  direction = "init"
) {

  const tbody =
    document.querySelector(
      "#memberTable tbody"
    );


  tbody.innerHTML =
    "";


  /* ===================================================
     SEARCH
  =================================================== */

  if (searchTerm) {

    db.ref("users")
      .once("value")

      .then(
        snap => {

          if (!snap.exists()) {

            tbody.innerHTML = `

              <tr>

                <td
                  colspan="5"
                  style="text-align:center;"
                >
                  User tidak ditemukan
                </td>

              </tr>

            `;

            return;

          }


          let found =
            false;


          snap.forEach(
            u => {

              const d =
                u.val();


              const namaLower =
                String(
                  d.nama || ""
                )
                .toLowerCase();


              const emailLower =
                String(
                  d.email || ""
                )
                .toLowerCase();


              if (
                namaLower.includes(
                  searchTerm
                ) ||
                emailLower.includes(
                  searchTerm
                )
              ) {

                found =
                  true;


                const saldo =
                  Number(
                    d.saldo || 0
                  );


                const saldoFormatted =
                  "Rp " +
                  saldo.toLocaleString(
                    "id-ID"
                  );


                const statusLabel =
                  d.status === "active"

                    ? `
                      <span
                        class="status-badge"
                        style="
                          background:#34d399;
                          color:#fff
                        "
                      >
                        Active
                      </span>
                    `

                    : `
                      <span
                        class="status-badge"
                        style="
                          background:#f87171;
                          color:#fff
                        "
                      >
                        Non-Active
                      </span>
                    `;


                const tr =
                  document.createElement(
                    "tr"
                  );


                tr.innerHTML = `

                  <td>
                    ${d.nama || "-"}
                  </td>

                  <td>
                    ${d.email || "-"}
                  </td>

                  <td>
                    ${saldoFormatted}
                  </td>

                  <td>
                    ${statusLabel}
                  </td>

                  <td
                    style="
                      display:flex;
                      gap:6px;
                      align-items:center
                    "
                  >

                    <button
                      class="action-btn"
                      onclick="
                        window.location.href=
                        '../admin-userdetail?uid=${u.key}'
                      "
                    >
                      Detail
                    </button>


                    <div class="menu-wrap">

                      <button
                        class="menu-btn"
                        onclick="toggleMenu(this)"
                      >
                        ⋮
                      </button>


                      <div
                        class="menu-dropdown"
                      >

                        <button
                          onclick="
                            toggleStatus(
                              '${u.key}',
                              '${d.status}'
                            )
                          "
                        >
                          ${
                            d.status === "active"
                              ? "Disable"
                              : "Activate"
                          }
                        </button>


                        <button
                          onclick="
                            editSaldo(
                              '${u.key}'
                            )
                          "
                        >
                          Edit Saldo
                        </button>


                        <button
                          onclick="
                            changeEmail(
                              '${u.key}',
                              '${d.email || ""}'
                            )
                          "
                        >
                          Ganti Email
                        </button>


                        <button
                          onclick="
                            deleteMember(
                              '${u.key}'
                            )
                          "
                        >
                          Hapus
                        </button>

                      </div>

                    </div>

                  </td>

                `;


                tbody.appendChild(
                  tr
                );

              }

            }
          );


          if (!found) {

            tbody.innerHTML = `

              <tr>

                <td
                  colspan="5"
                  style="
                    text-align:center;
                    padding:20px;
                  "
                >

                  User
                  "<strong>
                    ${searchTerm}
                  </strong>"
                  tidak ditemukan

                </td>

              </tr>

            `;

          }

        }
      )

      .catch(
        err => {

          console.error(
            err
          );


          tbody.innerHTML = `

            <tr>

              <td
                colspan="5"
                style="
                  text-align:center;
                  color:red;
                "
              >
                Gagal mencari user
              </td>

            </tr>

          `;

        }
      );


    return;

  }


  /* ===================================================
     NORMAL LOAD
  =================================================== */

  let ref =
    db
      .ref("users")
      .orderByKey()
      .limitToFirst(
        pageSize
      );


  /* ===================================================
     NEXT
  =================================================== */

  if (
    direction === "next" &&
    lastKey
  ) {

    pageStack.push(
      firstKey
    );


    ref =
      db
        .ref("users")
        .orderByKey()
        .startAfter(
          lastKey
        )
        .limitToFirst(
          pageSize
        );

  }


  /* ===================================================
     PREVIOUS
  =================================================== */

  if (
    direction === "prev" &&
    pageStack.length
  ) {

    const prevKey =
      pageStack.pop();


    ref =
      db
        .ref("users")
        .orderByKey()
        .startAt(
          prevKey
        )
        .limitToFirst(
          pageSize
        );

  }


  ref.once("value")

    .then(
      snap => {

        if (!snap.exists()) {

          tbody.innerHTML = `

            <tr>

              <td
                colspan="5"
                style="text-align:center;"
              >
                Tidak ada user
              </td>

            </tr>

          `;

          return;

        }


        let keys =
          [];


        snap.forEach(
          u => {

            const d =
              u.val();


            keys.push(
              u.key
            );


            const saldo =
              Number(
                d.saldo || 0
              );


            const saldoFormatted =
              "Rp " +
              saldo.toLocaleString(
                "id-ID"
              );


            const statusLabel =
              d.status === "active"

                ? `
                  <span
                    class="status-badge"
                    style="
                      background:#34d399;
                      color:#fff
                    "
                  >
                    Active
                  </span>
                `

                : `
                  <span
                    class="status-badge"
                    style="
                      background:#f87171;
                      color:#fff
                    "
                  >
                    Non-Active
                  </span>
                `;


            const tr =
              document.createElement(
                "tr"
              );


            tr.innerHTML = `

              <td>
                ${d.nama || "-"}
              </td>

              <td>
                ${d.email || "-"}
              </td>

              <td>
                ${saldoFormatted}
              </td>

              <td>
                ${statusLabel}
              </td>

              <td
                style="
                  display:flex;
                  gap:6px;
                  align-items:center
                "
              >

                <button
                  class="action-btn"
                  onclick="
                    window.location.href=
                    '../admin-userdetail?uid=${u.key}'
                  "
                >
                  Detail
                </button>


                <div class="menu-wrap">

                  <button
                    class="menu-btn"
                    onclick="toggleMenu(this)"
                  >
                    ⋮
                  </button>


                  <div
                    class="menu-dropdown"
                  >

                    <button
                      onclick="
                        toggleStatus(
                          '${u.key}',
                          '${d.status}'
                        )
                      "
                    >
                      ${
                        d.status === "active"
                          ? "Disable"
                          : "Activate"
                      }
                    </button>


                    <button
                      onclick="
                        editSaldo(
                          '${u.key}'
                        )
                      "
                    >
                      Edit Saldo
                    </button>


                    <button
                      onclick="
                        changeEmail(
                          '${u.key}',
                          '${d.email || ""}'
                        )
                      "
                    >
                      Ganti Email
                    </button>


                    <button
                      onclick="
                        deleteMember(
                          '${u.key}'
                        )
                      "
                    >
                      Hapus
                    </button>

                  </div>

                </div>

              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );


        firstKey =
          keys[0];


        lastKey =
          keys[
            keys.length - 1
          ];

      }
    )

    .catch(
      err => {

        console.error(
          err
        );


        tbody.innerHTML = `

          <tr>

            <td
              colspan="5"
              style="
                text-align:center;
                color:red;
              "
            >
              Gagal memuat user
            </td>

          </tr>

        `;

      }
    );

}


/* =====================================================
   MENU TOGGLE
===================================================== */

function toggleMenu(btn) {

  document
    .querySelectorAll(
      ".menu-dropdown"
    )
    .forEach(
      m => {

        if (
          m !==
          btn.nextElementSibling
        ) {

          m.style.display =
            "none";

        }

      }
    );


  const menu =
    btn.nextElementSibling;


  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}


document.addEventListener(
  "click",
  e => {

    if (
      !e.target.closest(
        ".menu-wrap"
      )
    ) {

      document
        .querySelectorAll(
          ".menu-dropdown"
        )
        .forEach(
          m =>
            m.style.display =
              "none"
        );

    }

  }
);


/* =====================================================
   EDIT SALDO
===================================================== */

let saldoEditingUid =
  null;

let saldoCurrentValue =
  0;


function editSaldo(uid) {

  db.ref(
    `users/${uid}/saldo`
  )
  .once("value")

  .then(
    snap => {

      saldoEditingUid =
        uid;


      saldoCurrentValue =
        Number(
          snap.val() || 0
        );


      document
        .getElementById(
          "modalCurrentSaldo"
        )
        .textContent =
          "Rp " +
          saldoCurrentValue
            .toLocaleString(
              "id-ID"
            );


      document
        .getElementById(
          "saldoAction"
        )
        .value =
          "add";


      document
        .getElementById(
          "saldoAmount"
        )
        .value =
          "";


      document
        .getElementById(
          "saldoModal"
        )
        .style.display =
          "flex";


      setTimeout(
        () => {

          const amountInput =
            document.getElementById(
              "saldoAmount"
            );


          if (amountInput) {

            amountInput.focus();

          }

        },
        100
      );

    }
  )

  .catch(
    err => {

      console.error(
        "Edit saldo error:",
        err
      );


      showAlert(
        "Gagal mengambil saldo user.\n\n" +
        err.message,
        "Gagal Mengambil Saldo",
        "!"
      );

    }
  );

}


/* =====================================================
   CLOSE SALDO MODAL
===================================================== */

function closeSaldoModal() {

  document
    .getElementById(
      "saldoModal"
    )
    .style.display =
    "none";


  saldoEditingUid =
    null;


  saldoCurrentValue =
    0;

}


/* =====================================================
   SAVE SALDO
===================================================== */

async function saveSaldo() {

  if (!saldoEditingUid) {

    showAlert(
      "User tidak ditemukan.",
      "User Tidak Ditemukan",
      "!"
    );

    return;

  }


  const action =
    document
      .getElementById(
        "saldoAction"
      )
      .value;


  const amount =
    Number(
      document
        .getElementById(
          "saldoAmount"
        )
        .value
    );


  if (
    !amount ||
    amount <= 0
  ) {

    showAlert(
      "Nominal harus lebih dari 0.",
      "Nominal Tidak Valid",
      "!"
    );

    return;

  }


  let newSaldo =
    saldoCurrentValue;


  if (
    action === "add"
  ) {

    newSaldo +=
      amount;

  } else {

    newSaldo -=
      amount;

  }


  if (newSaldo < 0) {

    showAlert(
      "Saldo tidak boleh menjadi negatif.",
      "Saldo Tidak Valid",
      "!"
    );

    return;

  }


  const confirmed =
    await showConfirm(
      "Saldo saat ini: Rp " +
      saldoCurrentValue.toLocaleString("id-ID") +
      "\n\n" +
      (
        action === "add"
          ? "Tambah: Rp "
          : "Kurangi: Rp "
      ) +
      amount.toLocaleString("id-ID") +
      "\n\n" +
      "Saldo setelah perubahan: Rp " +
      newSaldo.toLocaleString("id-ID"),
      "Konfirmasi Perubahan Saldo",
      "Rp",
      "Simpan"
    );


  if (!confirmed) {

    return;

  }


  showLoading(
    "Menyimpan saldo..."
  );


  db.ref(
    `users/${saldoEditingUid}/saldo`
  )
  .set(
    newSaldo
  )

  .then(
    () => {

      closeSaldoModal();

      hideLoading();


      showAlert(
        "Saldo baru: Rp " +
        newSaldo.toLocaleString(
          "id-ID"
        ),
        "Saldo Berhasil Diperbarui",
        "✓"
      );


      loadMembers();

    }
  )

  .catch(
    err => {

      hideLoading();


      console.error(
        "Save saldo error:",
        err
      );


      showAlert(
        "Gagal memperbarui saldo.\n\n" +
        err.message,
        "Gagal Memperbarui Saldo",
        "!"
      );

    }
  );

}


/* =====================================================
   TOGGLE STATUS
===================================================== */

async function toggleStatus(
  uid,
  currentStatus
) {

  const newStatus =
    currentStatus === "active"
      ? "non-active"
      : "active";


  const text =
    newStatus === "active"
      ? "mengaktifkan"
      : "menonaktifkan";


  const confirmed =
    await showConfirm(
      `Yakin ingin ${text} user ini?`,
      newStatus === "active"
        ? "Aktifkan User"
        : "Nonaktifkan User",
      newStatus === "active"
        ? "✓"
        : "!",
      newStatus === "active"
        ? "Aktifkan"
        : "Disable",
      newStatus !== "active"
    );


  if (!confirmed) {

    return;

  }


  showLoading(
    newStatus === "active"
      ? "Mengaktifkan user..."
      : "Menonaktifkan user..."
  );


  db.ref(
    `users/${uid}/status`
  )
  .set(
    newStatus
  )

  .then(
    () => {

      hideLoading();


      showAlert(
        newStatus === "active"
          ? "User berhasil diaktifkan."
          : "User berhasil dinonaktifkan.",
        newStatus === "active"
          ? "User Diaktifkan"
          : "User Dinonaktifkan",
        newStatus === "active"
          ? "✓"
          : "!"
      );


      loadMembers();

    }
  )

  .catch(
    err => {

      hideLoading();


      console.error(
        "Toggle status error:",
        err
      );


      showAlert(
        "Gagal mengubah status user.\n\n" +
        err.message,
        "Gagal Mengubah Status",
        "!"
      );

    }
  );

}


/* =====================================================
   DELETE MEMBER
===================================================== */

async function deleteMember(
  uid
) {

  const confirmed =
    await showConfirm(
      "Apakah yakin ingin menghapus data user ini dari database?\n\nTindakan ini tidak dapat dibatalkan.",
      "Hapus User",
      "!",
      "Hapus",
      true
    );


  if (!confirmed) {

    return;

  }


  showLoading(
    "Menghapus data user..."
  );


  db.ref(
    `users/${uid}`

  .then(
    () => {

      hideLoading();


      showAlert(
        "Data user berhasil dihapus dari database.",
        "User Dihapus",
        "✓"
      );


      loadMembers();

    }
  )

  .catch(
    err => {

      hideLoading();


      console.error(
        "Delete user error:",
        err
      );


      showAlert(
        "Gagal menghapus user.\n\n" +
        err.message,
        "Gagal Menghapus User",
        "!"
      );

    }
  );

}


/* =====================================================
   GANTI EMAIL
===================================================== */

let emailEditingUid =
  null;

let emailCurrentEmail =
  "";


function changeEmail(
  uid,
  currentEmail
) {

  emailEditingUid =
    uid;


  emailCurrentEmail =
    currentEmail || "";


  document.getElementById(
    "currentEmailDisplay"
  ).textContent =
    currentEmail || "-";


  document.getElementById(
    "newEmailModal"
  ).value =
    "";


  document.getElementById(
    "emailModal"
  ).classList.add(
    "show"
  );


  setTimeout(
    () => {

      document.getElementById(
        "newEmailModal"
      ).focus();

    },
    100
  );

}


/* =====================================================
   CLOSE EMAIL MODAL
===================================================== */

function closeEmailModal() {

  document.getElementById(
    "emailModal"
  ).classList.remove(
    "show"
  );


  emailEditingUid =
    null;


  emailCurrentEmail =
    "";

}


/* =====================================================
   SUBMIT EMAIL CHANGE
===================================================== */

async function submitEmailChange() {

  if (!emailEditingUid) {

    showAlert(
      "User tidak ditemukan.",
      "User Tidak Ditemukan",
      "!"
    );

    return;

  }


  const emailInput =
    document.getElementById(
      "newEmailModal"
    );


  const newEmail =
    emailInput
      .value
      .trim()
      .toLowerCase();


  if (!newEmail) {

    showAlert(
      "Email baru wajib diisi.",
      "Email Kosong",
      "!"
    );

    emailInput.focus();

    return;

  }


  if (
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(newEmail)
  ) {

    showAlert(
      "Format email tidak valid.",
      "Email Tidak Valid",
      "!"
    );

    emailInput.focus();

    return;

  }


  if (
    newEmail ===
    emailCurrentEmail
      .trim()
      .toLowerCase()
  ) {

    showAlert(
      "Email baru sama dengan email yang sekarang.",
      "Email Tidak Berubah",
      "!"
    );

    return;

  }


  const confirmed =
    await showConfirm(
      "Dari:\n" +
      (emailCurrentEmail || "-") +
      "\n\n" +
      "Menjadi:\n" +
      newEmail +
      "\n\n" +
      "Password user tidak akan berubah.",
      "Konfirmasi Ganti Email",
      "@",
      "Ganti Email"
    );


  if (!confirmed) {

    return;

  }


  const targetUid =
  emailEditingUid;

const oldEmail =
  emailCurrentEmail;


closeEmailModal();


try {

  const adminUser =
    firebase.auth().currentUser;

    if (!adminUser) {

      showAlert(
        "Sesi admin tidak ditemukan.\n\nSilakan login kembali.",
        "Sesi Admin Tidak Ditemukan",
        "!"
      );

      return;

    }


    showLoading(
      "Mengubah email..."
    );


    const idToken =
      await adminUser.getIdToken(
        true
      );


    console.log(
      "Admin UID:",
      adminUser.uid
    );


    console.log(
      "Firebase ID Token berhasil didapat."
    );


    const response =
      await fetch(

        "https://dynotic-auth-admin.dynotic-bot.workers.dev",

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${idToken}`

          },

          body:
  JSON.stringify({

    uid:
      targetUid,

    newEmail:
      newEmail

  })

        }

      );


    const responseText =
      await response.text();


    console.log(
      "================================="
    );

    console.log(
      "DYNOTIC AUTH WORKER RESPONSE"
    );

    console.log(
      "HTTP STATUS:",
      response.status
    );

    console.log(
      "RAW RESPONSE:",
      responseText
    );

    console.log(
      "================================="
    );


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    }

    catch (parseError) {

      console.error(
        "Worker response bukan JSON:",
        parseError
      );


      data = {

        success:
          false,

        error:
          "Worker mengirim response yang bukan JSON.",

        detail:
          responseText

      };

    }


    console.log(
      "Parsed Worker Data:",
      data
    );


    hideLoading();


    if (
      !response.ok ||
      !data.success
    ) {

      let errorMessage =
        data.error ||
        "Unknown error";


      errorMessage +=
        "\n\nHTTP Status: " +
        response.status;


      if (
        data.status
      ) {

        errorMessage +=
          "\nWorker Status: " +
          data.status;

      }


      if (
        data.detail
      ) {

        let detail;


        if (
          typeof data.detail ===
          "string"
        ) {

          detail =
            data.detail;

        }

        else {

          try {

            detail =
              JSON.stringify(
                data.detail,
                null,
                2
              );

          }

          catch {

            detail =
              String(
                data.detail
              );

          }

        }


        errorMessage +=
          "\n\nDetail:\n" +
          detail;

      }


      showAlert(
        errorMessage,
        "Gagal Mengubah Email",
        "!"
      );


      return;

    }


    if (
      data.warning
    ) {

      showAlert(
        "Email Firebase Auth berhasil diubah.\n\n" +
        "Email baru:\n" +
        (
          data.email ||
          newEmail
        ) +
        "\n\n" +
        "Peringatan:\n" +
        data.warning,
        "Email Auth Berhasil",
        "!"
      );


      loadMembers();


      return;

    }


    showAlert(
      "Email baru:\n" +
      (
        data.email ||
        newEmail
      ) +
      "\n\n" +
      "Password user tidak berubah. User dapat menggunakan Forgot Password pada email baru untuk membuat password baru.",
      "Email Berhasil Diubah",
      "✓"
    );


    loadMembers();

  }


  catch (
    error
  ) {

    hideLoading();


    console.error(
      "changeEmail error:",
      error
    );


    showAlert(
      (
        error.message ||
        String(error)
      ),
      "Error Script / Network",
      "!"
    );

  }


  /*
   * Bersihkan UID setelah proses selesai.
   */

  emailEditingUid =
    null;

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadMembers();

</script>
