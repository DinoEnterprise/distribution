<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  color:#17181c;
  min-height:100vh;
  padding-top:64px;
  padding-bottom:30px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* HEADER */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

header img{
  height:32px;
  width:auto;
  object-fit:contain;
  display:block;
}


/* CONTAINER */

.container{
  max-width:760px;
  margin:auto;
  padding:22px 14px 30px;
}


/* PAGE TITLE */

.page-title{
  margin-bottom:18px;
}

.page-title h1{
  font-size:22px;
  font-weight:700;
}

.page-title p{
  color:#777b84;
  font-size:12px;
  margin-top:3px;
}


/* MAIN CARD */

.form-card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  animation:pageIn .45s ease both;
}


/* STEPS */

.steps{
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  margin-bottom:24px;
}

.steps::before{
  content:"";
  position:absolute;
  left:19px;
  right:19px;
  top:19px;
  height:2px;
  background:#e5e6eb;
  z-index:0;
}

.step{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#e5e6eb;
  color:#777b84;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:600;
  z-index:1;
  border:4px solid #fff;
  transition:.2s;
  pointer-events:none;
}

.step.active{
  background:#17181c;
  color:#fff;
}


/* SECTION */

.section{
  animation:sectionIn .3s ease;
}


/* LABEL */

.label{
  font-size:12px;
  font-weight:600;
  color:#34363c;
  margin-bottom:6px;
}

.req{
  color:#e0444f;
  margin-left:2px;
}


/* INPUT */

input,
select{
  width:100%;
  padding:12px 13px;
  border-radius:11px;
  border:1px solid #dedfe4;
  background:#fff;
  color:#17181c;
  font-size:13px;
  margin-bottom:15px;
  outline:none;
  transition:.15s;
}

input::placeholder{
  color:#a0a2a8;
}

input:focus,
select:focus{
  border-color:#b9bbc2;
  box-shadow:0 0 0 3px rgba(0,0,0,.04);
}


/* UPLOAD COVER */

.upload-box{
  display:block;
  width:180px;
  aspect-ratio:1/1;
  border:1.5px dashed #bfc1c8;
  border-radius:16px;
  background:#fafafa;
  cursor:pointer;
  overflow:hidden;
  transition:.2s;
}

.upload-box:hover{
  border-color:#777b84;
  background:#f7f7f8;
}

.upload-box:active{
  transform:scale(.98);
}

.upload-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.upload-icon-img{
  width:40px;
  height:40px;
  object-fit:contain;
  display:block;
  margin:auto;
}

.upload-text{
  font-size:11px;
  color:#777b84;
  margin-top:7px;
  text-align:center;
}

#coverPreview{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:15px;
  display:none;
}


/* AUDIO */

.upload-audio{
  display:block;
  cursor:pointer;
}

.audio-box{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:12px;
  background:#fafafa;
  border:1px solid #e2e3e7;
  transition:.2s;
}

.audio-box:hover{
  background:#f7f7f8;
  border-color:#bfc1c8;
}

.audio-box:active{
  transform:scale(.98);
}

.audio-icon-img{
  width:30px;
  height:30px;
  object-fit:contain;
  flex-shrink:0;
}

.audio-info{
  min-width:0;
  flex:1;
}

.audio-name{
  font-weight:600;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.audio-sub{
  font-size:10px;
  color:#858891;
  margin-top:2px;
}


/* PROGRESS */

.progress-wrapper{
  margin-top:8px;
  width:100%;
  height:5px;
  background:#e5e6eb;
  border-radius:999px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#17181c;
  transition:width .3s;
}


/* BUTTON */

.btn{
  width:100%;
  padding:12px 14px;
  border:1px solid #17181c;
  border-radius:11px;
  background:#17181c;
  color:#fff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}

.btn:hover{
  background:#000;
}

.btn:active{
  transform:scale(.97);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.btn.gray{
  background:#fff;
  color:#17181c;
  border:1px solid #dfe0e5;
}

.btn.gray:hover{
  background:#f7f7f8;
}


/* BUTTON ROW */

.button-row{
  display:flex;
  gap:9px;
}


/* PREVIEW */

.preview{
  background:#f8f8fa;
  border:1px solid #e6e7eb;
  border-radius:13px;
  padding:14px;
  font-size:12px;
  line-height:1.6;
}

.preview div{
  margin-bottom:7px;
}

.preview div:last-child{
  margin-bottom:0;
}

.preview span{
  color:#17181c;
  font-weight:600;
}


/* WARNING */

.release-warning{
  font-size:11px;
  color:#777b84;
  line-height:1.5;
  background:#f8f8fa;
  border-radius:10px;
  padding:10px;
  margin-top:-5px;
  margin-bottom:15px;
}


/* ANIMATION */

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes sectionIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}


@media(max-width:600px){

  .upload-box{
    width:160px;
  }

}


@media(min-width:700px){

  .container{
    padding-left:0;
    padding-right:0;
  }

}

</style>

<script>

firebase.initializeApp({

const db =

const WORKER_URL =
  "https://upload-assets.dynotic-bot.workers.dev/";


/* UPLOAD */

function uploadFile(
  file,
  progressCallback,
  doneCallback
){

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );


  const xhr =
    new XMLHttpRequest();


  xhr.open(
    "POST",
    WORKER_URL,
    true
  );


  xhr.upload.onprogress =
  function(e){

    if(e.lengthComputable){

      const percent =
        Math.round(
          (e.loaded / e.total) * 100
        );

      progressCallback(percent);

    }

  };


  xhr.onload =
  function(){

    if(xhr.status === 200){

      const data =
        JSON.parse(
          xhr.responseText
        );


      if(data.success){

        doneCallback(
          data.url
        );

      }else{

        alert(
          "Upload gagal: " +
          data.error
        );

        doneCallback(null);

      }

    }else{

      alert("Upload gagal!");

      doneCallback(null);

    }

  };


  xhr.onerror =
  function(){

    alert("Upload error!");

    doneCallback(null);

  };


  xhr.send(formData);

}


/* AUTH */

firebase.auth()
.onAuthStateChanged(user => {

  if(!user){

    location.href =
      "../login";

  }

});


/* STEP VALIDATION */

const stepsData = {

  1: () => true,


  2: () => {

    return document.getElementById("title")?.value &&

           document.getElementById("artist")?.value &&

           document.getElementById("labelName")?.value &&

  },


  3: () => {

    return document.getElementById("audio")?.dataset.url &&

};


/* HIDE */

function hideAll(){

  for(let i=1;i<=4;i++){

  }

}


/* STEP 2 */

function loadStep2Fields(){

/* UPLOAD LISTENERS */

let uploadListenerAttached =
  false;


function attachUploadListeners(){

  if(uploadListenerAttached)
    return;


  uploadListenerAttached =
    true;


  const audioInput =
    document.getElementById("audio");


  const coverInput =
    document.getElementById("cover");


  const previewBtn =
    document.getElementById("previewBtn");


  const audioWave =
    document.getElementById("audioWave");


  const audioName =
    document.getElementById("audioName");


  const coverPreview =
    document.getElementById("coverPreview");


  let audioUploaded =
    false;


  let coverUploaded =
    false;


  function checkAllUploaded(){

    previewBtn.disabled =
      !(audioUploaded && coverUploaded);

  }


  /* AUDIO */

  audioInput.addEventListener(
    "change",
    e => {

      const file =
        e.target.files[0];


      if(!file) return;


      audioUploaded =
        false;


      audioName.textContent =
        "Uploading...";


      audioWave.style.width =
        "0%";


      uploadFile(

        file,

        percent => {

          audioWave.style.width =
            percent + "%";


          audioName.textContent =
            file.name +
            " (" +
            percent +
            "%)";

        },

        url => {

          if(url){

            audioInput.dataset.url =
              url;


            audioUploaded =
              true;


            audioName.textContent =
              file.name +
              " (Done ✓)";


            checkAllUploaded();

            updateStepUI();

          }

        }

      );

    }
  );


  /* COVER */

  coverInput.addEventListener(
    "change",
    e => {

      const file =
        e.target.files[0];


      if(!file) return;


      coverUploaded =
        false;


      const reader =
        new FileReader();


      reader.onload =
      ev => {

        coverPreview.src =
          ev.target.result;


        coverPreview.style.display =
          "block";


        document
          .getElementById(
            "coverPlaceholder"
          )
          .style.display =
          "none";

      };


      reader.readAsDataURL(file);


      uploadFile(

        file,

        () => {},

        url => {

          if(url){

            coverInput.dataset.url =
              url;


            coverUploaded =
              true;


            checkAllUploaded();

            updateStepUI();

          }

        }

      );

    }
  );

}


/* NAVIGATION */

function next(n){

  if(n === 1){

    document
      .getElementById("type")
      .value =
      "original";


    loadStep2Fields();

    goto(2);

    updateStepUI();

    return;

  }


  if(n === 2){

    if(!stepsData[2]()){

      alert(
        "Lengkapi semua field wajib!"
      );

      return;

    }

  }


  if(n === 3){

    if(!stepsData[3]()){

      alert(
        "Tunggu sampai audio & cover selesai di-upload!"
      );

      return;

    }


    loadPreview();

  }


  goto(n + 1);

  updateStepUI();

}


function back(n){

  goto(n - 1);

}


function goto(n){

  hideAll();


  document
    .getElementById("step"+n)
    .hidden =
    false;


  if(n === 3){

    attachUploadListeners();

  }


  for(let i=1;i<=4;i++){

    document
      .getElementById("s"+i)
      .classList
      .remove("active");

  }


  document
    .getElementById("s"+n)
    .classList
    .add("active");

}


/* STEP UI */

function updateStepUI(){

  const validStep2 =
    stepsData[2]();


  const validStep3 =
    stepsData[3]();


  document
    .getElementById("s3")
    .style.opacity =
    validStep2
      ? "1"
      : ".4";


  document
    .getElementById("s4")
    .style.opacity =
    (
      validStep2 &&
      validStep3
    )
      ? "1"
      : ".4";


  document
    .getElementById("s3")
    .style.pointerEvents =
    validStep2
      ? "auto"
      : "none";


  document
    .getElementById("s4")
    .style.pointerEvents =
    (
      validStep2 &&
      validStep3
    )
      ? "auto"
      : "none";

}

/* SUBMIT */

function submitRelease(){

  const btn =
    document.getElementById(
      "submitBtn"
    );


  const text =
    document.getElementById(
      "btnText"
    );


  const loader =
    document.getElementById(
      "btnLoader"
    );


  btn.disabled =
    true;


  text.style.display =
    "none";


  loader.style.display =
    "inline";


  const user =
    firebase.auth()
    .currentUser;


  if(!user)
    return;


  let data = {

    type:
      document
        .getElementById("type")
        .value,


    releaseType:
      document
        .getElementById("releaseType")
        .value,


    title:
      document
        .getElementById("title")
        .value,


    artist:
      document
        .getElementById("artist")
        .value,


    genre:
      document
        .getElementById("genre")
        .value,


    label:
      document
        .getElementById("labelName")
        ?.value ||
      "Unknown Label",


    audio:
      document
        .getElementById("audio")
        .dataset.url,


    cover:
      document
        .getElementById("cover")
        .dataset.url,


    spotifyUrl:
      document
        .getElementById("spotifyUrl")
        ?.value ||
      "",


    appleUrl:
      document
        .getElementById("appleUrl")
        ?.value ||
      "",


    version:
      document
        .getElementById("version")
        ?.value ||
      "",


    fullname:
      document
        .getElementById("fullname")
        ?.value
        .split(",")
        .map(n => n.trim())
        .filter(n => n !== ""),


    status:
      "proposal",


    time:
      Date.now()

  };


  const feat =
    document
      .getElementById("featuring")
      ?.value;


  if(feat)
    data.featuring =
      feat;


  const prod =
    document
      .getElementById("producer")
      ?.value;


  if(prod)
    data.producer =
      prod;


  db.ref(
    "releases/" +
    user.uid
  )
  .push(data)

  .then(() => {

    location.href =
      "../releases";

  })

  .catch(() => {

    btn.disabled =
      false;


    text.style.display =
      "inline";


    loader.style.display =
      "none";

  });

}


/* LIVE UPDATE */

document.addEventListener(
  "input",
  updateStepUI
);


updateStepUI();

</script>
