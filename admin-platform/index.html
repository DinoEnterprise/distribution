
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Platform Detail | Dynotic Distribution</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  max-width: 100%;
  overflow-x: hidden;
  font-family: 'Outfit', sans-serif;
  background: #f1f2f7;
  color: #17181c;
}

/* ===== ACCORDION ===== */
.accordion {
  background: #fff;
  border-radius: 13px;
  margin-bottom: 11px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.035);
}

.accordion-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 16px;
  cursor: pointer;
  list-style: none;
  user-select: none;
}

.accordion-header::-webkit-details-marker {
  display: none;
}

.accordion-title {
  font-size: 13px;
  font-weight: 600;
}

.accordion-subtitle {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: #888b95;
  margin-top: 3px;
}

.arrow {
  width: 28px;
  height: 28px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 8px;
  background: #f3f4f8;
  color: #555;
  flex-shrink: 0;
  transition: transform .2s;
}

.arrow svg {
  width: 15px;
  height: 15px;
}

details[open] .arrow {
  transform: rotate(180deg);
}

.accordion-content {
  padding: 0 15px 16px;
  border-top: 1px solid #f0f0f0;
  padding-top: 15px;
}

/* ===== TITLE ===== */
#title {
  font-size: 17px;
  font-weight: 600;
  margin: 0;
  overflow-wrap: anywhere;
}

#artist {
  display: block;
  font-size: 12px;
  color: #888b95;
  margin-top: 5px;
}

/* ===== INFO GRID ===== */
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.info-grid div {
  min-width: 0;
  overflow-wrap: anywhere;
  background: #f7f8fc;
  padding: 11px;
  border-radius: 9px;
}

.info-grid .full {
  grid-column: 1 / -1;
}

.info-grid span {
  display: block;
  font-size: 11px;
  color: #858891;
  margin-bottom: 4px;
}

.info-grid b {
  font-size: 13px;
  font-weight: 600;
}

.info-grid img {
  display: block;
  width: 120px;
  max-width: 100%;
  border-radius: 8px;
  margin-top: 7px;
}

.info-grid a {
  color: #17181c;
  font-size: 12px;
  overflow-wrap: anywhere;
}

/* ===== FORM ===== */
.form-group {
  margin-bottom: 14px;
}

.form-group:last-child {
  margin-bottom: 0;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #454852;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid #e0e2e9;
  border-radius: 9px;
  background: #fff;
  outline: none;
  color: #17181c;
  font-family: inherit;
  font-size: 13px;
}

input:focus,
select:focus {
  border-color: #999da9;
}

/* ===== PLATFORM ===== */
.platform {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid #eee;
}

.platform:last-child {
  border-bottom: none;
}

.platform b {
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
}

.platform select {
  width: 130px;
  flex-shrink: 0;
  padding: 8px 10px;
  font-size: 12px;
}

.global-box {
  padding: 12px;
  background: #f7f8fc;
  border-radius: 10px;
  margin-bottom: 12px;
}

.global-box button {
  margin-top: 9px;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 12px 14px;
  border: none;
  border-radius: 9px;
  background: #111;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

button:active {
  opacity: .85;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.save-button {
  margin-top: 5px;
  margin-bottom: 20px;
}

/* ===== STORAGE FILE ===== */
.storage-status {
  display: block;
  font-size: 11px;
  color: #858891;
  margin-top: 8px;
}

.storage-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.storage-actions button {
  width: auto;
  flex: 1;
  padding: 9px 10px;
  font-size: 11px;
}

.storage-check {
  background: #e9edf5;
  color: #252832;
}

.storage-delete {
  background: #fff0f0;
  color: #c62828;
}

/* ===== RESPONSIVE ===== */
@media(max-width: 400px) {
  body {
    padding: 10px;
  }

  .accordion-header {
    padding: 14px;
  }

  .accordion-content {
    padding: 13px;
  }

  .platform select {
    width: 120px;
  }
}
</style>
</head>

<body>

<!-- 1. JUDUL DAN INFORMASI UTAMA -->
<details class="accordion">
  <summary class="accordion-header">
    <div>
      <div class="accordion-title">Judul & Informasi Utama</div>
      <span class="accordion-subtitle">Judul lagu dan nama artis</span>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>
  </summary>

  <div class="accordion-content">
    <h3 id="title">Loading...</h3>
    <small id="artist"></small>
  </div>
</details>


<!-- 2. INFORMASI RILISAN -->
<details class="accordion">
  <summary class="accordion-header">
    <div>
      <div class="accordion-title">Informasi Rilisan</div>
      <span class="accordion-subtitle">Metadata, audio, cover, dan detail lainnya</span>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>
  </summary>

  <div class="accordion-content">
    <div id="infoGrid" class="info-grid">
      <div class="full">Memuat informasi...</div>
    </div>
  </div>
</details>


<!-- 3. PLATFORM DISTRIBUTION -->
<details class="accordion">
  <summary class="accordion-header">
    <div>
      <div class="accordion-title">Platform Distribution</div>
      <span class="accordion-subtitle">Atur status setiap platform musik</span>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>
  </summary>

  <div class="accordion-content">

    <div class="global-box">
      <label for="globalPlatformStatus">Set Status Semua Platform</label>

      <select id="globalPlatformStatus">
        <option value="process">Process</option>
        <option value="approved">Approved</option>
        <option value="unavailable">Unavailable</option>
      </select>

      <button onclick="applyToAllPlatforms()">
        Apply ke Semua Platform
      </button>
    </div>

    <div id="platformWrap"></div>

  </div>
</details>


<!-- 4. RELEASE INFORMATION -->
<details class="accordion">
  <summary class="accordion-header">
    <div>
      <div class="accordion-title">Release Information</div>
      <span class="accordion-subtitle">Tanggal rilis, Smartlink, dan EAN</span>
    </div>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>
  </summary>

  <div class="accordion-content">

    <div class="form-group">
      <label for="releaseDate">Release Date</label>
      <input type="date" id="releaseDate">
    </div>

    <div class="form-group">
      <label for="smartlink">Smartlink</label>
      <input
        type="text"
        id="smartlink"
        placeholder="https://..."
      >
    </div>

    <div class="form-group">
      <label for="ean">EAN Code</label>
      <input
        type="text"
        id="ean"
        placeholder="Masukkan EAN"
      >
    </div>

  </div>
</details>


<!-- SAVE BUTTON -->
<button class="save-button" id="saveButton" onclick="savePlatform()">
  SIMPAN STATUS
</button>


<script>
firebase.initializeApp({
  apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
  authDomain: "dynopay-2513c.firebaseapp.com",
  databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const auth = firebase.auth();
const db = firebase.database();

const params = new URLSearchParams(location.search);
const uid = params.get("uid");
const rid = params.get("rid");

const platforms = [
  "Spotify",
  "Tidal",
  "Amazon",
  "Apple Music",
  "Tiktok",
  "YouTube Music",
  "YouTube Content ID",
  "META",
  "SoundCloud",
  "Tencent"
];


/* ===== SECURITY CHECK ===== */
auth.onAuthStateChanged(user => {
  if (!user) {
    location.href = "../admin";
    return;
  }

  db.ref("admins/" + user.uid).once("value")
    .then(s => {
      if (!s.exists()) {
        alert("⚠ Bukan admin!");

        auth.signOut().then(() => {
          location.href = "../admin";
        });

      } else {
        if (!uid || !rid) {
          alert("Data rilisan tidak valid!");
          return;
        }

        loadRelease();
      }
    })
    .catch(error => {
      console.error(error);
      alert("Gagal memeriksa akses admin.");
    });
});


/* ===== LOAD RELEASE ===== */
function loadRelease() {
  db.ref(`releases/${uid}/${rid}`).once("value")
    .then(s => {
      const d = s.val();

      if (!d) {
        alert("Rilisan tidak ditemukan");
        return;
      }

      document.getElementById("title").textContent = d.title || "-";
      document.getElementById("artist").textContent = d.artist || "-";

      renderReleaseInfo(d);
      renderPlatform(d.platformStatus || {});

      document.getElementById("releaseDate").value = d.date || "";
      document.getElementById("smartlink").value = d.smartlink || "";
      document.getElementById("ean").value = d.ean || "";
    })
    .catch(error => {
      console.error(error);
      alert("Gagal memuat data rilisan.");
    });
}


/* ===== RELEASE INFORMATION ===== */
function addInfoItem(container, label, value, full = false) {
  const div = document.createElement("div");

  if (full) div.className = "full";

  const span = document.createElement("span");
  span.textContent = label;

  const bold = document.createElement("b");
  bold.textContent = value || "-";

  div.appendChild(span);
  div.appendChild(bold);

  container.appendChild(div);
}

const STORAGE_WORKER =
  "https://upload-assets.dynotic-bot.workers.dev";

async function storageRequest(action, url) {
  const response = await fetch(STORAGE_WORKER, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ action, url })
  });

  const result = await response.json();

  if (!response.ok || !result.success) {
    throw new Error(result.error || "Permintaan gagal");
  }

  return result;
}

function addStorageControls(container, type, url) {
  if (!url || !url.includes(".r2.dev/")) return;

  const status = document.createElement("span");
  status.className = "storage-status";
  status.textContent = "Memeriksa file...";

  const actions = document.createElement("div");
  actions.className = "storage-actions";

  const checkButton = document.createElement("button");
  checkButton.className = "storage-check";
  checkButton.textContent = "Cek File";

  const deleteButton = document.createElement("button");
  deleteButton.className = "storage-delete";
  deleteButton.textContent = "Hapus File";

  async function checkFile() {
    checkButton.disabled = true;
    status.textContent = "Memeriksa file...";

    try {
      const result = await storageRequest("check", url);

      if (result.exists) {
        status.textContent = "✓ File tersedia di Cloudflare R2";
        status.style.color = "#16834a";
      } else {
        status.textContent = "✕ File sudah tidak ditemukan";
        status.style.color = "#c62828";
      }
    } catch (error) {
      status.textContent = "Gagal memeriksa: " + error.message;
      status.style.color = "#c62828";
    } finally {
      checkButton.disabled = false;
    }
  }

  checkButton.onclick = checkFile;

  deleteButton.onclick = async () => {
    const confirmed = confirm(
      `Yakin ingin menghapus file ${type} ini dari Cloudflare R2?\n\nURL di Firebase tetap disimpan.`
    );

    if (!confirmed) return;

    deleteButton.disabled = true;
    deleteButton.textContent = "MENGHAPUS...";

    try {
      const result = await storageRequest("delete", url);

      if (result.deleted) {
        status.textContent = "✓ File berhasil dihapus dari R2";
      } else {
        status.textContent = "File memang sudah tidak tersedia";
      }

      status.style.color = "#c62828";

    } catch (error) {
      status.textContent = "Gagal menghapus: " + error.message;
      status.style.color = "#c62828";
    } finally {
      deleteButton.disabled = false;
      deleteButton.textContent = "Hapus File";
    }
  };

  actions.appendChild(checkButton);
  actions.appendChild(deleteButton);

  container.appendChild(status);
  container.appendChild(actions);

  checkFile();
}


function renderReleaseInfo(d) {
  const infoDiv = document.getElementById("infoGrid");
  infoDiv.innerHTML = "";

  const fields = [
    ["Song Title", d.title],
    ["Version", d.version],
    ["Genre", d.genre],
    ["Release Type", d.releaseType],
    ["Artist", d.artist],
    ["Full Name", d.fullname],
    ["Featuring", d.featuring],
    ["Label", d.label],
    ["Spotify URL", d.spotifyUrl],
    ["Apple Music ID", d.appleId],
    ["Producer", d.producer],
    ["Composer", d.composer],
    ["Publisher", d.publisher]
  ];

  fields.forEach(([label, value]) => {
    addInfoItem(infoDiv, label, value);
  });


  
  // AUDIO
  const audioDiv = document.createElement("div");
  audioDiv.className = "full";

  const audioLabel = document.createElement("span");
  audioLabel.textContent = "Audio";

  audioDiv.appendChild(audioLabel);

  if (d.audio) {
    const audioLink = document.createElement("a");
    audioLink.href = d.audio;
    audioLink.target = "_blank";
    audioLink.rel = "noopener noreferrer";
    audioLink.textContent = "Preview Audio";

    audioDiv.appendChild(audioLink);

    addStorageControls(audioDiv, "Audio", d.audio);
  } else {
    const empty = document.createElement("i");
    empty.textContent = "Kosong";
    audioDiv.appendChild(empty);
  }

  infoDiv.appendChild(audioDiv);



  // COVER
  const coverDiv = document.createElement("div");
  coverDiv.className = "full";

  const coverLabel = document.createElement("span");
  coverLabel.textContent = "Cover";

  coverDiv.appendChild(coverLabel);

  if (d.cover) {
    const coverLink = document.createElement("a");
    coverLink.href = d.cover;
    coverLink.target = "_blank";
    coverLink.rel = "noopener noreferrer";

    const coverImg = document.createElement("img");
    const driveId = extractDriveId(d.cover);

    coverImg.src = driveId
      ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(driveId)}&sz=w400`
      : d.cover;

    coverImg.alt = "Cover rilisan";

    coverLink.appendChild(coverImg);
    coverDiv.appendChild(coverLink);

    addStorageControls(coverDiv, "Cover", d.cover);

  } else {
    const empty = document.createElement("i");
    empty.textContent = "Kosong";
    coverDiv.appendChild(empty);
  }

  infoDiv.appendChild(coverDiv);

}

/* ===== EXTRACT DRIVE ID ===== */
function extractDriveId(url) {
  if (!url) return "";

  const match = url.match(/\/d\/([^\/]+)/);
  return match ? match[1] : "";
}


/* ===== RENDER PLATFORM ===== */
function renderPlatform(data) {
  const wrap = document.getElementById("platformWrap");
  wrap.innerHTML = "";

  platforms.forEach(p => {
    const row = document.createElement("div");
    row.className = "platform";

    const name = document.createElement("b");
    name.textContent = p;

    const select = document.createElement("select");
    select.dataset.name = p;

    const options = [
      ["process", "Process"],
      ["approved", "Approved"],
      ["unavailable", "Unavailable"]
    ];

    options.forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    });

    if (data[p]) {
      select.value = data[p];
    }

    row.appendChild(name);
    row.appendChild(select);

    wrap.appendChild(row);
  });
}


/* ===== APPLY TO ALL ===== */
function applyToAllPlatforms() {
  const status = document.getElementById("globalPlatformStatus").value;

  document.querySelectorAll("#platformWrap select").forEach(s => {
    s.value = status;
  });
}


/* ===== SAVE PLATFORM ===== */
function savePlatform() {
  const result = {};

  document.querySelectorAll("#platformWrap select").forEach(s => {
    result[s.dataset.name] = s.value;
  });

  const releaseDate = document.getElementById("releaseDate").value;
  const smartlink = document.getElementById("smartlink").value.trim();
  const ean = document.getElementById("ean").value.trim();

  const updates = {
    platformStatus: result,
    date: releaseDate || null,
    smartlink: smartlink || null,
    ean: ean || null
  };

  const saveButton = document.getElementById("saveButton");

  saveButton.disabled = true;
  saveButton.textContent = "MENYIMPAN...";

  db.ref(`releases/${uid}/${rid}`).update(updates)
    .then(() => {
      alert("✔ Data berhasil diperbarui");
    })
    .catch(error => {
      console.error(error);
      alert("Gagal menyimpan data: " + error.message);
    })
    .finally(() => {
      saveButton.disabled = false;
      saveButton.textContent = "SIMPAN STATUS";
    });
}
</script>

</body>
</html>
