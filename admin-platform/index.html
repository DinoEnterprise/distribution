
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Platform Detail | Dynotic Distribution</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  max-width: 100%;
  overflow-x: hidden;
  margin: 0;
  padding: 15px;
  font-family: 'Outfit', sans-serif;
  background: #f1f2f7;
  color: #17181c;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.035);
}

.header-card {
  padding: 18px 16px;
}

h3 {
  margin: 0 0 5px;
  font-size: 18px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

#artist {
  font-size: 12px;
  color: #858891;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 13px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #454852;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid #e0e2e9;
  border-radius: 9px;
  background: #fff;
  outline: none;
  color: #17181c;
  font-family: inherit;
  font-size: 13px;
}

input:focus,
select:focus {
  border-color: #999da9;
}

button {
  width: 100%;
  padding: 12px 14px;
  border: none;
  border-radius: 9px;
  background: #111;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

button:active {
  opacity: .85;
}

.platform {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid #eee;
}

.platform:last-child {
  border-bottom: none;
}

.platform b {
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
}

.platform select {
  width: 135px;
  flex-shrink: 0;
  padding: 8px 10px;
  font-size: 12px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-top: 15px;
}

.info-grid div {
  min-width: 0;
  overflow-wrap: anywhere;
  background: #f7f8fc;
  padding: 11px;
  border-radius: 9px;
}

.info-grid .full {
  grid-column: 1 / -1;
}

.info-grid span {
  display: block;
  font-size: 11px;
  color: #858891;
  margin-bottom: 4px;
}

.info-grid b {
  font-size: 13px;
  font-weight: 600;
}

.info-grid img {
  display: block;
  width: 120px;
  max-width: 100%;
  border-radius: 8px;
  margin-top: 7px;
}

.info-grid a {
  color: #17181c;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.form-group {
  margin-bottom: 14px;
}

.form-group:last-child {
  margin-bottom: 0;
}

.save-button {
  margin-bottom: 20px;
}

@media(max-width: 560px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 14px;
    border-radius: 13px;
  }

  .header-card {
    padding: 16px 14px;
  }

  .info-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .platform {
    gap: 8px;
  }

  .platform select {
    width: 125px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="card header-card">
  <h3 id="title">Loading...</h3>
  <small id="artist"></small>
</div>

<!-- GLOBAL PLATFORM STATUS -->
<div class="card">
  <div class="section-title">Pengaturan Status Platform</div>

  <div class="form-group">
    <label for="globalPlatformStatus">Set Status Semua Platform</label>
    <select id="globalPlatformStatus">
      <option value="process">Process</option>
      <option value="approved">Approved</option>
      <option value="unavailable">Unavailable</option>
    </select>
  </div>

  <button onclick="applyToAllPlatforms()">
    Apply ke Semua Platform
  </button>
</div>

<!-- PLATFORM LIST -->
<div class="card">
  <div class="section-title">Platform Distribution</div>
  <div id="platformWrap"></div>
</div>

<!-- RELEASE INFORMATION -->
<div class="card">
  <div class="section-title">Release Information</div>

  <div class="form-group">
    <label for="releaseDate">Release Date</label>
    <input type="date" id="releaseDate">
  </div>

  <div class="form-group">
    <label for="smartlink">Smartlink</label>
    <input
      type="text"
      id="smartlink"
      placeholder="https://..."
    >
  </div>

  <div class="form-group">
    <label for="ean">EAN Code</label>
    <input
      type="text"
      id="ean"
      placeholder="Masukkan EAN"
    >
  </div>
</div>

<button class="save-button" onclick="savePlatform()">
  SIMPAN STATUS
</button>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
  authDomain: "dynopay-2513c.firebaseapp.com",
  databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const auth = firebase.auth();
const db = firebase.database();

const params = new URLSearchParams(location.search);
const uid = params.get("uid");
const rid = params.get("rid");

const platforms = [
  "Spotify",
  "Tidal",
  "Amazon",
  "Apple Music",
  "Tiktok",
  "YouTube Music",
  "YouTube Content ID",
  "META",
  "SoundCloud",
  "Tencent"
];

/* ===== SECURITY CHECK ===== */
auth.onAuthStateChanged(user => {
  if (!user) {
    location.href = "../admin";
    return;
  }

  db.ref("admins/" + user.uid).once("value")
    .then(s => {
      if (!s.exists()) {
        alert("⚠ Bukan admin!");
        auth.signOut().then(() => {
          location.href = "../admin";
        });
      } else {
        if (!uid || !rid) {
          alert("Data rilisan tidak valid!");
          return;
        }

        loadRelease();
      }
    })
    .catch(error => {
      console.error(error);
      alert("Gagal memeriksa akses admin.");
    });
});

/* ===== LOAD RELEASE ===== */
function loadRelease() {
  db.ref(`releases/${uid}/${rid}`).once("value")
    .then(s => {
      const d = s.val();

      if (!d) {
        alert("Rilisan tidak ditemukan");
        return;
      }

      document.getElementById("title").innerText = d.title || "-";
      document.getElementById("artist").innerText = d.artist || "-";

      renderReleaseInfo(d);
      renderPlatform(d.platformStatus || {});

      document.getElementById("releaseDate").value = d.date || "";
      document.getElementById("smartlink").value = d.smartlink || "";
      document.getElementById("ean").value = d.ean || "";
    })
    .catch(error => {
      console.error(error);
      alert("Gagal memuat data rilisan.");
    });
}

/* ===== RELEASE INFORMATION ===== */
function addInfoItem(container, label, value, full = false) {
  const div = document.createElement("div");

  if (full) div.className = "full";

  const span = document.createElement("span");
  span.textContent = label;

  const bold = document.createElement("b");
  bold.textContent = value || "-";

  div.appendChild(span);
  div.appendChild(bold);
  container.appendChild(div);
}

function renderReleaseInfo(d) {
  const old = document.querySelector(".info-grid");
  if (old) old.remove();

  const infoDiv = document.createElement("div");
  infoDiv.className = "info-grid";

  const fields = [
    ["Song Title", d.title],
    ["Version", d.version],
    ["Genre", d.genre],
    ["Release Type", d.releaseType],
    ["Artist", d.artist],
    ["Full Name", d.fullname],
    ["Featuring", d.featuring],
    ["Label", d.label],
    ["Spotify URL", d.spotifyUrl],
    ["Apple Music ID", d.appleId],
    ["Producer", d.producer],
    ["Composer", d.composer],
    ["Publisher", d.publisher]
  ];

  fields.forEach(([label, value]) => {
    addInfoItem(infoDiv, label, value);
  });

  // AUDIO
  const audioDiv = document.createElement("div");
  audioDiv.className = "full";

  const audioLabel = document.createElement("span");
  audioLabel.textContent = "Audio";

  audioDiv.appendChild(audioLabel);

  if (d.audio) {
    const audioLink = document.createElement("a");
    audioLink.href = d.audio;
    audioLink.target = "_blank";
    audioLink.rel = "noopener noreferrer";
    audioLink.textContent = "Preview Audio";
    audioDiv.appendChild(audioLink);
  } else {
    const empty = document.createElement("i");
    empty.textContent = "Kosong";
    audioDiv.appendChild(empty);
  }

  infoDiv.appendChild(audioDiv);

  // COVER
  const coverDiv = document.createElement("div");
  coverDiv.className = "full";

  const coverLabel = document.createElement("span");
  coverLabel.textContent = "Cover";
  coverDiv.appendChild(coverLabel);

  if (d.cover) {
    const coverLink = document.createElement("a");
    coverLink.href = d.cover;
    coverLink.target = "_blank";
    coverLink.rel = "noopener noreferrer";

    const coverImg = document.createElement("img");
    const driveId = extractDriveId(d.cover);

    coverImg.src = driveId
      ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(driveId)}&sz=w400`
      : d.cover;

    coverImg.alt = "Cover rilisan";
    coverImg.style.cursor = "pointer";

    coverLink.appendChild(coverImg);
    coverDiv.appendChild(coverLink);
  } else {
    const empty = document.createElement("i");
    empty.textContent = "Kosong";
    coverDiv.appendChild(empty);
  }

  infoDiv.appendChild(coverDiv);

  document.getElementById("artist")
    .insertAdjacentElement("afterend", infoDiv);
}

/* ===== EXTRACT DRIVE ID ===== */
function extractDriveId(url) {
  if (!url) return "";

  const match = url.match(/\/d\/([^\/]+)/);
  return match ? match[1] : "";
}

/* ===== RENDER PLATFORM ===== */
function renderPlatform(data) {
  const wrap = document.getElementById("platformWrap");
  wrap.innerHTML = "";

  platforms.forEach(p => {
    const row = document.createElement("div");
    row.className = "platform";

    const name = document.createElement("b");
    name.textContent = p;

    const select = document.createElement("select");
    select.dataset.name = p;

    const options = [
      ["process", "Process"],
      ["approved", "Approved"],
      ["unavailable", "Unavailable"]
    ];

    options.forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    });

    if (data[p]) {
      select.value = data[p];
    }

    row.appendChild(name);
    row.appendChild(select);
    wrap.appendChild(row);
  });
}

/* ===== APPLY TO ALL ===== */
function applyToAllPlatforms() {
  const status = document.getElementById("globalPlatformStatus").value;

  document.querySelectorAll("#platformWrap select").forEach(s => {
    s.value = status;
  });
}

/* ===== SAVE PLATFORM ===== */
function savePlatform() {
  const result = {};

  document.querySelectorAll("#platformWrap select").forEach(s => {
    result[s.dataset.name] = s.value;
  });

  const releaseDate = document.getElementById("releaseDate").value;
  const smartlink = document.getElementById("smartlink").value.trim();
  const ean = document.getElementById("ean").value.trim();

  const updates = {
    platformStatus: result,
    date: releaseDate || null,
    smartlink: smartlink || null,
    ean: ean || null
  };

  const saveButton = document.querySelector(".save-button");
  saveButton.disabled = true;
  saveButton.textContent = "MENYIMPAN...";

  db.ref(`releases/${uid}/${rid}`).update(updates)
    .then(() => {
      alert("✔ Data berhasil diperbarui");
    })
    .catch(error => {
      console.error(error);
      alert("Gagal menyimpan data: " + error.message);
    })
    .finally(() => {
      saveButton.disabled = false;
      saveButton.textContent = "SIMPAN STATUS";
    });
}
</script>

</body>
</html>
