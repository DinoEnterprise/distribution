<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cover to Master | Dynotic Distribution</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Outfit",sans-serif;
    }

    body{
      background:#f1f2f7;
      color:#17181c;
      min-height:100vh;
      padding-top:64px;
      user-select:none;
    }

    /* HEADER */
    header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      padding:0 18px;
      background:#fff;
      border-bottom:1px solid #e6e6eb;
      display:flex;
      align-items:center;
      z-index:1000;
    }

    header img{
      height:32px;
      width:auto;
      object-fit:contain;
    }

    /* MAIN */
    .container{
      width:calc(100% - 28px);
      max-width:760px;
      margin:14px auto 0;
    }

    .page-title{
      margin:6px 2px 14px;
    }

    .page-title h1{
      font-size:22px;
      font-weight:700;
      letter-spacing:-.3px;
    }

    .page-title p{
      margin-top:3px;
      color:#858891;
      font-size:13px;
    }

    /* CARD */
    .card{
      background:#fff;
      border:1px solid #e7e7ec;
      border-radius:20px;
      padding:18px;
      margin-bottom:14px;
    }

    /* STEPS */
    .steps{
      display:flex;
      justify-content:space-between;
      position:relative;
      margin:2px 4px 24px;
    }

    .steps::before{
      content:"";
      position:absolute;
      top:50%;
      left:8%;
      right:8%;
      height:2px;
      background:#e4e5ea;
      z-index:0;
      transform:translateY(-50%);
    }

    .step{
      width:34px;
      height:34px;
      border-radius:50%;
      background:#e6e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:13px;
      font-weight:700;
      color:#777a82;
      z-index:1;
      cursor:pointer;
      transition:.15s;
    }

    .step.active{
      background:#17181c;
      color:#fff;
    }

    /* SECTION */
    .section{
      animation:fade .2s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(5px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .label{
      font-size:13px;
      font-weight:600;
      margin-bottom:7px;
    }

    .req{
      color:#e53935;
    }

    input,
    select{
      width:100%;
      padding:13px 14px;
      border-radius:13px;
      border:1px solid #dedfe5;
      background:#fff;
      color:#17181c;
      margin-bottom:15px;
      font-size:14px;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#17181c;
      box-shadow:0 0 0 3px rgba(23,24,28,.06);
    }

    input::placeholder{
      color:#a1a3aa;
    }

    a{
      color:#17181c;
      font-weight:600;
      text-decoration:none;
    }

    /* BUTTON */
    .btn{
      width:100%;
      padding:14px 15px;
      border:none;
      border-radius:14px;
      font-size:14px;
      font-weight:700;
      color:#fff;
      background:#17181c;
      cursor:pointer;
      transition:.15s;
    }

    .btn:hover{
      background:#000;
    }

    .btn:active{
      transform:scale(.97);
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .btn.gray{
      background:#fff;
      color:#17181c;
      border:1px solid #dcdde3;
    }

    .btn.gray:hover{
      background:#f5f5f7;
    }

    /* COVER UPLOAD */
    .upload-box{
      display:block;
      width:190px;
      max-width:100%;
      aspect-ratio:1/1;
      border:1.5px dashed #bfc1c8;
      border-radius:18px;
      cursor:pointer;
      background:#fafafd;
      transition:.2s;
      overflow:hidden;
    }

    .upload-box:hover{
      background:#f5f5f8;
      border-color:#17181c;
    }

    .upload-inner{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .upload-icon-img{
      width:42px;
      height:42px;
      object-fit:contain;
      display:block;
      margin:0 auto;
    }

    .upload-text{
      font-size:12px;
      color:#666a73;
      margin-top:7px;
      text-align:center;
    }

    #coverPreview{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:17px;
      display:none;
    }

    /* AUDIO */
    .upload-audio{
      display:block;
      cursor:pointer;
    }

    .audio-box{
      display:flex;
      align-items:center;
      gap:13px;
      padding:14px;
      border-radius:15px;
      background:#f8f8fa;
      border:1px solid #e2e3e8;
      transition:.2s;
    }

    .audio-box:hover{
      border-color:#17181c;
      background:#f5f5f8;
    }

    .audio-box:active{
      transform:scale(.985);
    }

    .audio-icon-img{
      width:27px;
      height:27px;
      object-fit:contain;
    }

    .audio-name{
      font-weight:600;
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:calc(100vw - 130px);
    }

    .audio-sub{
      font-size:12px;
      color:#898b93;
      margin-top:2px;
    }

    .progress-wrapper{
      margin-top:10px;
      width:100%;
      height:6px;
      background:#e5e6eb;
      border-radius:999px;
      overflow:hidden;
    }

    .progress-bar{
      height:100%;
      width:0%;
      background:#17181c;
      transition:width .3s;
    }

    /* PREVIEW */
    .preview{
      background:#f8f8fa;
      border:1px solid #e6e6eb;
      border-radius:16px;
      padding:15px;
      font-size:13px;
      line-height:1.6;
    }

    .preview div{
      margin-bottom:7px;
    }

    .preview span{
      color:#17181c;
      font-weight:600;
    }

    .preview hr{
      border:0;
      border-top:1px solid #e5e5e9;
    }

    .preview img{
      transition:.2s;
    }

    .preview img:hover{
      transform:scale(1.03);
    }

    /* SHAKE */
    .input-error{
      animation:shake .2s ease;
      border-color:#17181c !important;
    }

    @keyframes shake{
      0%{transform:translateX(0)}
      25%{transform:translateX(-3px)}
      50%{transform:translateX(3px)}
      75%{transform:translateX(-3px)}
      100%{transform:translateX(0)}
    }

    @media(max-width:400px){
      .container{
        width:calc(100% - 22px);
      }

      .card{
        padding:15px;
      }

      .page-title h1{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

<header>
  <img src="../assets/dynotic-distribution.png">
</header>

<div class="container">

  <div class="page-title">
    <h1>Cover to Master</h1>
    <p>Submit your cover release to Dynotic.</p>
  </div>

  <div class="card">

    <!-- STEP PROGRESS -->
    <div class="steps">
      <div class="step active" id="s1">1</div>
      <div class="step" id="s2">2</div>
      <div class="step" id="s3">3</div>
      <div class="step" id="s4">4</div>
    </div>

    <!-- STEP 1 -->
    <div id="step1" class="section">

      <div class="label">
        Cover To Master <span class="req">*</span>
      </div>

      <select id="type" hidden>
        <option value="original" selected>Original Asset</option>
      </select>

      <div style="font-size:13px;color:#858891;line-height:1.6;margin-bottom:18px;">
        Gunakan fitur ini untuk mengajukan rilisan Cover to Master.
      </div>

      <button type="button" class="btn" onclick="next(1)">
        Continue
      </button>

    </div>

    <!-- STEP 2 -->
    <div id="step2" class="section" hidden></div>

    <!-- STEP 3 -->
    <div id="step3" class="section" hidden>

      <!-- COVER -->
      <div style="margin-bottom:25px;">

        <div class="label" style="margin-bottom:11px;">
          Cover Art <span class="req">*</span>
        </div>

        <label class="upload-box">

          <input
            id="cover"
            type="file"
            accept="image/*"
            hidden
          >

          <div class="upload-inner">

            <img id="coverPreview">

            <div id="coverPlaceholder">

              <img
                src="../assets/upload-icon.png"
                class="upload-icon-img"
              >

              <div class="upload-text">
                Upload Cover (JPG / PNG)
              </div>

            </div>

          </div>

        </label>

      </div>

      <!-- AUDIO -->
      <div style="margin-bottom:25px;">

        <div class="label" style="margin-bottom:11px;">
          Audio File <span class="req">*</span>
        </div>

        <label class="upload-audio">

          <input
            id="audio"
            type="file"
            accept="audio/*"
            hidden
          >

          <div class="audio-box">

            <img
              src="../assets/audio-icon.png"
              class="audio-icon-img"
            >

            <div class="audio-info">

              <div id="audioName" class="audio-name">
                No file selected
              </div>

              <div class="audio-sub">
                MP3 / WAV
              </div>

            </div>

          </div>

        </label>

        <div class="progress-wrapper">
          <div id="audioWave" class="progress-bar"></div>
        </div>

      </div>

      <div style="display:flex;gap:10px;">

        <button
          type="button"
          class="btn gray"
          onclick="back(3)"
          style="flex:1;"
        >
          Back
        </button>

        <button
          type="button"
          class="btn"
          id="previewBtn"
          onclick="if(!stepsData[3]()) return alert('Upload dulu!'); loadPreview(); goto(4)"
          disabled
          style="flex:2;"
        >
          Preview
        </button>

      </div>

    </div>

    <!-- STEP 4 -->
    <div id="step4" class="section" hidden>

      <div class="label" style="margin-bottom:10px;">
        Release Preview
      </div>

      <div class="preview" id="previewBox"></div>

      <div style="height:12px;"></div>

      <button
        type="button"
        class="btn gray"
        onclick="back(4)"
      >
        Edit
      </button>

      <div style="height:10px;"></div>

      <button
        type="button"
        class="btn"
        id="submitBtn"
        onclick="submitRelease()"
      >

        <span id="btnText">
          Submit Release
        </span>

        <span id="btnLoader" style="display:none;">
          Loading...
        </span>

      </button>

    </div>

  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
  apiKey: "AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
  authDomain: "dynopay-2513c.firebaseapp.com",
  databaseURL: "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = firebase.database();

const WORKER_URL =
  "https://upload-assets.dynotic-bot.workers.dev/";


/* UPLOAD */

function uploadFile(file, progressCallback, doneCallback){

  const formData = new FormData();

  formData.append("file", file);

  const xhr = new XMLHttpRequest();

  xhr.open("POST", WORKER_URL, true);

  xhr.upload.onprogress = function(e){

    if(e.lengthComputable){

      const percent =
        Math.round((e.loaded / e.total) * 100);

      progressCallback(percent);

    }

  };

  xhr.onload = function(){

    if(xhr.status === 200){

      const data =
        JSON.parse(xhr.responseText);

      if(data.success){

        doneCallback(data.url);

      }else{

        alert("Upload gagal: " + data.error);

        doneCallback(null);

      }

    }else{

      alert("Upload gagal!");

      doneCallback(null);

    }

  };

  xhr.onerror = function(){

    alert("Upload error!");

    doneCallback(null);

  };

  xhr.send(formData);

}


/* AUTH */

firebase.auth().onAuthStateChanged(user=>{

  if(!user){

    location.href="../login";

  }

});


/* VALIDATION */

const stepsData = {

  1: ()=>true,

  2: ()=>{

    const title =
      document.getElementById("title");

    const artist =
      document.getElementById("artist");

    const publisher =
      document.getElementById("publisher");

    const label =
      document.getElementById("label");

    const version =
      document.getElementById("version");

    return title?.value &&
           artist?.value &&
           publisher?.value &&
           label?.value &&
           version?.value;

  },

  3: ()=>{

    return !!document
      .getElementById("audio")
      ?.dataset?.url

      &&

      !!document
      .getElementById("cover")
      ?.dataset?.url;

  }

};


/* STEP CONTROL */

function hideAll(){

  for(let i=1;i<=4;i++){

    document
      .getElementById("step"+i)
      .hidden=true;

  }

}


/* STEP 2 */

function loadStep2Fields(){

  const s =
    document.getElementById("step2");

  s.innerHTML="";

  s.innerHTML += `

    <div class="label">
      Title *
    </div>

    <input
      id="title"
      placeholder="Judul lagu"
    >

    <div class="label">
      Song ID (Publisher) *
    </div>

    <input
      id="publisher"
      placeholder="Wajib"
    >

    <div style="
      font-size:12px;
      color:#777;
      margin-bottom:16px;
      line-height:1.5;
    ">
      Cek Song ID
      <a
        href="https://dynotic.web.id/catalog"
        target="_blank"
      >
        Disini
      </a>
    </div>

    <div class="label">
      Artist Name *
    </div>

    <input
      id="artist"
      placeholder="Nama artist"
    >

    <div class="label">
      Label *
    </div>

    <input
      id="label"
      placeholder="e.g. Dynotic Distribution"
    >

    <div class="label">
      Version *
    </div>

    <select id="version">

      <option value="">
        Pilih Version
      </option>

      <option value="Remix">
        Remix
      </option>

      <option value="Cover">
        Cover
      </option>

    </select>

    <div class="label">
      Nama Vocal
      <span style="
        font-size:11px;
        color:#888;
        font-weight:400;
      ">
        (Khusus Katalog Pragita Prabawa Pustaka)
      </span>
    </div>

    <input
      id="fullname"
      placeholder="e.g. Inez Ariesta"
    >

    <div class="label">
      Featuring
    </div>

    <input
      id="featuring"
      placeholder="Optional"
    >

  `;

  s.innerHTML += `

    <button
      type="button"
      class="btn gray"
      onclick="back(2)"
    >
      Back
    </button>

    <div style="height:10px;"></div>

    <button
      type="button"
      class="btn"
      onclick="next(2)"
    >
      Continue
    </button>

  `;

}


/* UPLOAD LISTENERS */

let uploadListenerAttached = false;

function attachUploadListeners(){

  if(uploadListenerAttached) return;

  uploadListenerAttached = true;

  const audioInput =
    document.getElementById("audio");

  const coverInput =
    document.getElementById("cover");

  const previewBtn =
    document.getElementById("previewBtn");

  const audioWave =
    document.getElementById("audioWave");

  const audioName =
    document.getElementById("audioName");

  const coverPreview =
    document.getElementById("coverPreview");

  let audioUploaded = false;
  let coverUploaded = false;


  function checkAllUploaded(){

    previewBtn.disabled =
      !(audioUploaded && coverUploaded);

  }


  /* AUDIO */

  audioInput.addEventListener("change", e=>{

    const file =
      e.target.files[0];

    if(!file) return;

    audioUploaded=false;

    audioName.textContent =
      file.name;

    audioWave.style.width="0%";

    uploadFile(

      file,

      percent=>{

        audioWave.style.width =
          percent + "%";

      },

      url=>{

        if(url){

          audioInput.dataset.url =
            url;

          audioUploaded=true;

          checkAllUploaded();

          updateStepUI();

        }

      }

    );

  });


  /* COVER */

  coverInput.addEventListener("change", e=>{

    const file =
      e.target.files[0];

    if(!file) return;

    coverUploaded=false;

    const reader =
      new FileReader();

    reader.onload = ev=>{

      coverPreview.src =
        ev.target.result;

      coverPreview.style.display =
        "block";

      document
        .getElementById("coverPlaceholder")
        .style.display="none";

    };

    reader.readAsDataURL(file);


    uploadFile(

      file,

      ()=>{},

      url=>{

        if(url){

          coverInput.dataset.url =
            url;

          coverUploaded=true;

          checkAllUploaded();

          updateStepUI();

        }

      }

    );

  });

}


/* NAVIGATION */

function next(n){

  if(n===1){

    document
      .getElementById("type")
      .value="original";

    loadStep2Fields();

    goto(2);

    updateStepUI();

    return;

  }


  if(n===2){

    if(!stepsData[2]()){

      return alert(
        "Lengkapi semua field wajib!"
      );

    }

  }


  if(n===3){

    if(!stepsData[3]()){

      return alert(
        "Tunggu sampai audio & cover selesai di-upload!"
      );

    }

    loadPreview();

  }


  goto(n+1);

  updateStepUI();

}


function back(n){

  goto(n-1);

}


function goto(n){

  hideAll();

  document
    .getElementById("step"+n)
    .hidden=false;

  if(n===3){

    attachUploadListeners();

  }

  for(let i=1;i<=4;i++){

    document
      .getElementById("s"+i)
      .classList.remove("active");

  }

  document
    .getElementById("s"+n)
    .classList.add("active");

}


document.getElementById("s1").onclick =
  ()=>goto(1);


document.getElementById("s2").onclick = ()=>{

  if(!stepsData[1]()) return;

  goto(2);

};


document.getElementById("s3").onclick = ()=>{

  if(!stepsData[2]()){

    return alert(
      "Lengkapi dulu data di Step 2!"
    );

  }

  goto(3);

};


document.getElementById("s4").onclick = ()=>{

  if(!stepsData[2]()){

    return alert(
      "Lengkapi dulu data di Step 2!"
    );

  }

  if(!stepsData[3]()){

    return alert(
      "Upload audio & cover dulu!"
    );

  }

  loadPreview();

  goto(4);

};


/* STEP UI */

function updateStepUI(){

  const validStep2 =
    stepsData[2]();

  const validStep3 =
    stepsData[3]();


  document
    .getElementById("s3")
    .style.opacity =
      validStep2 ? "1" : "0.4";


  document
    .getElementById("s4")
    .style.opacity =
      (validStep2 && validStep3)
        ? "1"
        : "0.4";


  document
    .getElementById("s3")
    .style.pointerEvents =
      validStep2 ? "auto" : "none";


  document
    .getElementById("s4")
    .style.pointerEvents =
      (validStep2 && validStep3)
        ? "auto"
        : "none";

}


/* PREVIEW */

function loadPreview(){

  const previewBox =
    document.getElementById("previewBox");


  const titleVal =
    document.getElementById("title")?.value || "-";

  const artistVal =
    document.getElementById("artist")?.value || "-";

  const publisherVal =
    document.getElementById("publisher")?.value || "-";

  const labelVal =
    document.getElementById("label")?.value || "-";


  const coverUrl =
    document.getElementById("cover")
      ?.dataset.url || "";


  let html = `

    <div style="
      display:flex;
      gap:14px;
      align-items:center;
    ">

      <img
        src="${coverUrl}"
        style="
          width:76px;
          height:76px;
          border-radius:12px;
          object-fit:cover;
        "
      >

      <div style="min-width:0;">

        <div style="
          font-weight:700;
          font-size:15px;
          margin-bottom:2px;
        ">
          ${titleVal}
        </div>

        <div style="
          font-size:13px;
          color:#777;
        ">
          ${artistVal}
        </div>

      </div>

    </div>

    <hr style="
      margin:15px 0;
      border-top:1px solid #e5e5e9;
    ">

    <div>
      <span>Song ID:</span>
      ${publisherVal}
    </div>

    <div>
      <span>Label:</span>
      ${labelVal}
    </div>

  `;


  previewBox.innerHTML =
    html;

}


/* SUBMIT */

function submitRelease(){

  const btn =
    document.getElementById("submitBtn");

  const text =
    document.getElementById("btnText");

  const loader =
    document.getElementById("btnLoader");


  btn.disabled=true;

  text.style.display="none";

  loader.style.display="inline";


  const user =
    firebase.auth().currentUser;


  if(!user) return;


  const data = {

    type:
      document.getElementById("type").value,

    title:
      document.getElementById("title").value,

    artist:
      document.getElementById("artist").value,

    publisher:
      document.getElementById("publisher").value,

    version:
      document.getElementById("version").value,

    label:
      document.getElementById("label").value,

    audio:
      document.getElementById("audio")
        .dataset.url,

    cover:
      document.getElementById("cover")
        .dataset.url,

    fullname:
      document.getElementById("fullname")
        ?.value || "",

    status:
      "proposal",

    time:
      Date.now()

  };


  const feat =
    document.getElementById("featuring")
      ?.value;


  if(feat){

    data.featuring =
      feat;

  }


  db.ref(
    "releases/"+user.uid
  )
  .push(data)

  .then(()=>{

    location.href =
      "../releases";

  })

  .catch(()=>{

    btn.disabled=false;

    text.style.display =
      "inline";

    loader.style.display =
      "none";

  });

}


document.addEventListener(
  "input",
  updateStepUI
);

updateStepUI();

</script>

</body>
</html>
