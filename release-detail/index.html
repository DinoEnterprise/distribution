<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Release Detail | Dynotic Distribution</title>

<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-android.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-iphone.png">

<meta name="theme-color" content="#667eea">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  color:#17181c;
  min-height:100vh;
  padding-top:64px;
  padding-bottom:30px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* HEADER */

header{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  background:#fff;
  border-bottom:1px solid #e8e8ed;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

header img{
  height:32px;
  width:auto;
  object-fit:contain;
  display:block;
}

/* CONTAINER */

.container{
  max-width:760px;
  margin:auto;
  padding:22px 14px 30px;
}

/* PAGE TITLE */

.page-title{
  margin-bottom:18px;
}

.page-title h1{
  font-size:22px;
  font-weight:700;
}

.page-title p{
  color:#777b84;
  font-size:12px;
  margin-top:3px;
}

/* CARD */

.card{
  background:#fff;
  border:1px solid #e8e8ed;
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
  animation:pageIn .45s ease both;
}

.card-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:12px;
}

/* RELEASE HEADER */

.release-header{
  display:flex;
  align-items:flex-start;
  gap:15px;
}

.cover-box{
  width:135px;
  aspect-ratio:1 / 1;
  border-radius:14px;
  overflow:hidden;
  background:#f1f2f7;
  flex-shrink:0;
}

.cover-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:blur(8px);
  opacity:.65;
  transition:.35s ease;
}

.cover-box img.loaded{
  filter:blur(0);
  opacity:1;
}

.release-info{
  flex:1;
  min-width:0;
}

.release-title{
  font-size:18px;
  font-weight:700;
  line-height:1.3;
  word-break:break-word;
  margin-bottom:8px;
}

.release-artist{
  font-size:13px;
  color:#555861;
  margin-bottom:10px;
  word-break:break-word;
}

/* INFO */

.info-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  font-size:12px;
  line-height:1.5;
  margin-top:5px;
}

.field-title{
  color:#777b84;
  font-weight:500;
  flex-shrink:0;
}

.field-value{
  color:#17181c;
  font-weight:500;
  word-break:break-word;
}

.copy-value{
  cursor:pointer;
}

/* STATUS */

.status-badge{
  display:inline-flex;
  align-items:center;
  padding:4px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  margin-left:2px;
}

/* ACTIONS */

.action-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  padding:9px 13px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  background:#fff;
  font-size:12px;
  font-weight:500;
  color:#17181c;
  cursor:pointer;
  transition:.15s;
}

.btn:hover{
  background:#f8f8fa;
}

.btn:active{
  transform:scale(.95);
}

.btn.danger{
  border-color:#f0c9cc;
  color:#e0444f;
  background:#fff;
}

.btn.danger:hover{
  background:#fff5f5;
}

.btn.warning{
  border-color:#f1d49b;
  color:#c98508;
  background:#fff;
}

.btn.warning:hover{
  background:#fffaf0;
}

/* PLATFORM */

.platform-list{
  margin-top:2px;
}

.platform-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 0;
  border-bottom:1px solid #eeeeF1;
}

.platform-item:last-child{
  border-bottom:0;
}

.platform-item img{
  width:30px;
  height:30px;
  object-fit:contain;
  border-radius:7px;
  flex-shrink:0;
}

.platform-item b{
  flex:1;
  font-size:12px;
  font-weight:500;
}

.platform-status{
  font-size:10px;
  font-weight:600;
  padding:4px 8px;
  border-radius:999px;
  border:1px solid;
}

/* SMARTLINK */

.smartlink-input{
  width:100%;
  padding:10px 11px;
  border-radius:10px;
  border:1px solid #e1e2e7;
  background:#f8f8fa;
  color:#555861;
  font-size:12px;
  outline:none;
}

.smartlink-btn{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:11px;
  border:1px solid #e1e2e7;
  background:#fff;
  color:#17181c;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
}

.smartlink-btn:active{
  transform:scale(.98);
}

.empty-state{
  padding:8px 0 2px;
  font-size:12px;
  color:#858891;
  text-align:center;
}

/* POPUP */

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.popup-box{
  background:#fff;
  padding:20px;
  border-radius:17px;
  width:100%;
  max-width:320px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  animation:popupIn .2s ease;
}

.popup-text{
  font-size:14px;
  font-weight:600;
  margin-bottom:15px;
}

.popup-actions{
  display:flex;
  gap:8px;
  justify-content:center;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#17181c;
  color:#fff;
  padding:9px 15px;
  border-radius:999px;
  font-size:12px;
  display:none;
  z-index:3000;
}

/* ANIMATION */

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.96);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@media(max-width:600px){

  .cover-box{
    width:120px;
  }

  .release-header{
    gap:13px;
  }

  .release-title{
    font-size:16px;
  }

}

@media(min-width:700px){

  .container{
    padding-left:0;
    padding-right:0;
  }

}

</style>

</head>

<body>


<header>
  <img
    src="../assets/dynotic-distribution.png"
    alt="Dynotic Distribution"
  >
</header>


<main class="container">


  <div class="page-title">

    <h1>Release Detail</h1>

    <p>
      View information and distribution status of your release.
    </p>

  </div>


  <!-- RELEASE INFORMATION -->

  <div class="card">

    <div class="release-header">

      <div class="cover-box">

        <img
          id="coverArt"
          src="../assets/cover-default.png"
          alt="Cover Art"
        >

      </div>


      <div class="release-info">

        <div
          class="release-title"
          id="releaseTitle"
        >
          Loading...
        </div>


        <div
          class="release-artist"
          id="releaseArtist"
        >
          --
        </div>


        <div class="info-item">

          <span class="field-title">
            Label:
          </span>

          <span
            class="field-value"
            id="releaseLabel"
          >
            -
          </span>

        </div>


        <div class="info-item">

          <span class="field-title">
            UPC:
          </span>

          <span
            class="field-value copy-value"
            id="releaseEAN"
            onclick="copyEAN()"
          >
            -
          </span>

        </div>


        <div class="info-item">

          <span class="field-title">
            Genre:
          </span>

          <span
            class="field-value"
            id="releaseGenre"
          >
            -
          </span>

        </div>


        <div class="info-item">

          <span class="field-title">
            Release Date:
          </span>

          <span
            class="field-value"
            id="releaseDate"
          >
            -
          </span>

        </div>


        <div class="info-item">

          <span class="field-title">
            Status:
          </span>

          <span
            class="field-value"
            id="releaseStatus"
          >
            -
          </span>

        </div>

      </div>

    </div>

  </div>


  <!-- ACTIONS -->

  <div
    class="card"
    id="actionsCard"
  >

    <div class="card-title">
      Actions
    </div>

    <div class="action-group">

      <button
        id="editBtn"
        class="btn"
        style="display:none;"
      >
        Edit Release
      </button>


      <button
        id="deleteBtn"
        class="btn danger"
        style="display:none;"
      >
        Delete
      </button>


      <button
        id="takedownBtn"
        class="btn warning"
        style="display:none;"
      >
        Request Takedown
      </button>

    </div>

  </div>


  <!-- PLATFORMS -->

  <div class="card">

    <div class="card-title">
      Platforms
    </div>

    <div
      id="platformList"
      class="platform-list"
    ></div>

  </div>


  <!-- SMARTLINK -->

  <div class="card">

    <div class="card-title">
      Smartlink
    </div>


    <input
      id="smartlinkInput"
      class="smartlink-input"
      readonly
      placeholder="Smartlink not available"
      style="display:none;"
    >


    <button
      id="openBtn"
      class="smartlink-btn"
      onclick="openSmartlink()"
      style="display:none;"
    >
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
      &nbsp;Open Smartlink
    </button>


    <div
      id="emptySmartlink"
      class="empty-state"
    >
      Smartlink not available
    </div>

  </div>


</main>


<!-- DELETE POPUP -->

<div
  id="popup"
  class="popup"
>

  <div class="popup-box">

    <div
      id="popupText"
      class="popup-text"
    >
      Are you sure?
    </div>


    <div class="popup-actions">

      <button
        onclick="closePopup()"
        class="btn"
      >
        Cancel
      </button>


      <button
        onclick="confirmDelete()"
        class="btn danger"
      >
        Delete
      </button>

    </div>

  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
>
  Success
</div>


<script>

firebase.initializeApp({

  apiKey:"AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",

  authDomain:"dynopay-2513c.firebaseapp.com",

  databaseURL:
  "https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const auth = firebase.auth();

const db = firebase.database();

const params = new URLSearchParams(location.search);

let uid;

const rid = params.get("rid");


/* PLATFORM ICONS */

const platformIcons = {

  "Spotify":"../assets/spotify.png",

  "Tidal":"../assets/tidal.png",

  "Amazon":"../assets/amazon.png",

  "Apple Music":"../assets/apple.png",

  "Tiktok":"../assets/tiktok.png",

  "YouTube Music":"../assets/youtube.png",

  "YouTube Content ID":"../assets/contentid.png",

  "META":"../assets/meta.png",

  "SoundCloud":"../assets/soundcloud.png",

  "Tencent":"../assets/tencent.png"

};


const platforms = [

  "Spotify",

  "Tidal",

  "Amazon",

  "Apple Music",

  "Tiktok",

  "YouTube Music",

  "YouTube Content ID",

  "META",

  "SoundCloud",

  "Tencent"

];


/* AUTH */

auth.onAuthStateChanged(user => {

  if(!user){

    location.href="../login";

    return;

  }

  uid = user.uid;

  loadRelease(uid,rid);

});


/* LOAD RELEASE */

function loadRelease(uid,rid){

  db.ref(`releases/${uid}/${rid}`)
    .once("value")
    .then(snap => {

      const d = snap.val();


      if(!d){

        alert("Rilisan tidak ditemukan");

        return;

      }


      const statusLower =
        (d.status || "").toLowerCase();


      document.getElementById("releaseTitle").innerText =
        d.title || "-";


      document.getElementById("releaseArtist").innerText =
        d.artist || "-";


      document.getElementById("releaseLabel").innerText =
        d.label || "-";


      document.getElementById("releaseEAN").innerText =
        d.ean || "-";


      document.getElementById("releaseGenre").innerText =
        d.genre || "-";


      const date =
        d.date ? new Date(d.date) : null;


      document.getElementById("releaseDate").innerText =
        date
        ? date.toLocaleDateString("en-US",{
            year:"numeric",
            month:"long",
            day:"numeric"
          })
        : "-";


      /* STATUS */

      const statusEl =
        document.getElementById("releaseStatus");


      let text = "PROCESS";

      let color = "#3b82f6";


      const now = new Date();

      const releaseDateObj =
        d.date ? new Date(d.date) : null;


      if(statusLower === "proposal"){

        text = "PROPOSAL";

        color = "#f59e0b";

      }

      else if(statusLower === "process"){

        text = "PROCESS";

        color = "#3b82f6";

      }

      else if(statusLower === "approved"){

        if(releaseDateObj && now >= releaseDateObj){

          text = "LIVE";

          color = "#22c55e";

        }else{

          text = "APPROVED";

          color = "#10b981";

        }

      }

      else if(statusLower === "rejected"){

        text = "REJECTED";

        color = "#ef4444";

      }


      statusEl.innerHTML = `

        <span
          class="status-badge"
          style="border:1px solid ${color};color:${color}"
        >
          ${text}
        </span>

      `;


      /* ACTION BUTTONS */

      const deleteBtn =
        document.getElementById("deleteBtn");

      const takedownBtn =
        document.getElementById("takedownBtn");

      const editBtn =
        document.getElementById("editBtn");


      editBtn.onclick = editRelease;

      deleteBtn.onclick = deleteRelease;

      takedownBtn.onclick = takedownRelease;


      const isLive =
        releaseDateObj && now >= releaseDateObj;


      editBtn.style.display = "none";

      deleteBtn.style.display = "none";

      takedownBtn.style.display = "none";


      if(statusLower === "proposal"){

        editBtn.style.display = "block";

        deleteBtn.style.display = "block";

      }

      else if(statusLower === "process"){

        /* LOCKED */

      }

      else if(
        statusLower === "approved" ||
        isLive
      ){

        if(isLive){

          takedownBtn.style.display = "block";

        }

      }

      else if(statusLower === "rejected"){

        editBtn.style.display = "block";

        deleteBtn.style.display = "block";

      }


      /* COVER */

      const cover =
        document.getElementById("coverArt");


      if(d.cover){

        cover.src = d.cover.trim();

      }else{

        cover.src =
          "../assets/cover-default.png";

      }


      cover.onload = () => {

        cover.classList.add("loaded");

      };


      cover.onerror = () => {

        cover.src =
          "../assets/cover-default.png";

        cover.classList.add("loaded");

      };


      /* SMARTLINK */

      const input =
        document.getElementById("smartlinkInput");

      const openBtn =
        document.getElementById("openBtn");

      const empty =
        document.getElementById("emptySmartlink");


      if(d.smartlink?.trim()){

        input.style.display = "block";

        openBtn.style.display = "block";

        empty.style.display = "none";

        input.value = d.smartlink.trim();

      }else{

        input.style.display = "none";

        openBtn.style.display = "none";

        empty.style.display = "block";

      }


      /* PLATFORMS */

      if(
        statusLower === "approved" ||
        statusLower === "live"
      ){

        renderPlatforms(
          d.platformStatus || {}
        );

      }else{

        document.getElementById("platformList").innerHTML = `

          <div class="empty-state">
            Platform not available
          </div>

        `;

      }

    })

    .catch(error => {

      console.error(
        "Failed to load release:",
        error
      );

    });

}


/* COPY UPC */

function copyEAN(){

  const el =
    document.getElementById("releaseEAN");

  const val =
    el.innerText;


  if(!val || val === "-") return;


  navigator.clipboard.writeText(val);


  const old =
    el.innerText;


  el.innerText = "Copied";


  setTimeout(() => {

    el.innerText = old;

  },1500);

}


/* EDIT */

function editRelease(){

  location.href =
    "../edit-release?rid=" + rid;

}


/* DELETE */

function deleteRelease(){

  document.getElementById("popup").style.display =
    "flex";

  document.getElementById("popupText").innerText =
    "Delete this release?";

}


function closePopup(){

  document.getElementById("popup").style.display =
    "none";

}


function confirmDelete(){

  db.ref(`releases/${uid}/${rid}`)
    .remove()
    .then(() => {

      closePopup();

      showToast("Release deleted");


      setTimeout(() => {

        location.href =
          "../releases";

      },800);

    });

}


/* SMARTLINK */

function openSmartlink(){

  const link =
    document.getElementById("smartlinkInput").value;


  if(link){

    window.open(
      link,
      "_blank"
    );

  }

}


/* TAKEDOWN */

function takedownRelease(){

  const title =
    document.getElementById("releaseTitle").innerText;

  const artist =
    document.getElementById("releaseArtist").innerText;

  const ean =
    document.getElementById("releaseEAN").innerText;


  const subject =
    encodeURIComponent(
      "Request Takedown Release"
    );


  const body =
    encodeURIComponent(

`Hello Dynotic Admin,

I would like to request a takedown for the following release:

Title: ${title}
Artist: ${artist}
UPC: ${ean}

I would appreciate your assistance.

Thank you.`

    );


  window.location.href =
    `mailto:admin@dynotic.web.id?subject=${subject}&body=${body}`;

}


/* TOAST */

function showToast(text){

  const toast =
    document.getElementById("toast");


  toast.innerText =
    text;


  toast.style.display =
    "block";


  setTimeout(() => {

    toast.style.display =
      "none";

  },2000);

}


/* PLATFORMS */

function renderPlatforms(data){

  const wrap =
    document.getElementById("platformList");


  wrap.innerHTML = "";


  platforms.forEach(p => {

    let st = data?.[p];


    if(!st) return;


    let color = "#f59e0b";


    if(st === "approved")
      color = "#10b981";


    if(st === "unavailable")
      color = "#ef4444";


    wrap.innerHTML += `

      <div class="platform-item">

        <img
          src="${platformIcons[p]}"
          alt="${p} Logo"
        >

        <b>
          ${p}
        </b>

        <div
          class="platform-status"
          style="
            border-color:${color};
            color:${color};
          "
        >
          ${st.toUpperCase()}
        </div>

      </div>

    `;

  });


  if(!wrap.innerHTML){

    wrap.innerHTML = `

      <div class="empty-state">
        Platform not available
      </div>

    `;

  }

}

</script>

</body>
</html>
