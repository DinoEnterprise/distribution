<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Action | Dynotic Distribution</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:"Outfit",sans-serif;
}

body{
  background:#f1f2f7;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  background:#fff;
  width:100%;
  max-width:380px;
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  animation:fadeUp .4s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

h2{
  text-align:center;
  margin-bottom:6px;
}

p{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-bottom:20px;
  line-height:1.5;
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:12px;
  font-size:14px;
}

input:focus{
  border-color:#667eea;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#111;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  text-align:center;
  font-size:13px;
  margin-top:12px;
  line-height:1.5;
}

.error{
  color:#e53e3e;
}

.success{
  color:#38a169;
}

.email-box{
  background:#f1f2f7;
  border-radius:12px;
  padding:12px;
  margin-bottom:18px;
  text-align:center;
  font-size:13px;
  color:#444;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="card">

  <h2 id="title">Reset Password</h2>

  <p id="description">
    Create a new password for your Dynotic account
  </p>

  <!-- RESET PASSWORD -->

  <div id="resetForm">

    <input
      type="password"
      id="password"
      placeholder="New password"
      autocomplete="new-password"
    >

    <input
      type="password"
      id="confirm"
      placeholder="Confirm password"
      autocomplete="new-password"
    >

    <button id="resetButton" onclick="resetPassword()">
      Reset Password
    </button>

  </div>


  <!-- VERIFY CHANGE EMAIL -->

  <div id="emailVerify" style="display:none;">

    <div class="email-box">
      <div style="font-size:12px;color:#777;margin-bottom:5px;">
        New Email
      </div>

      <strong id="newEmail"></strong>
    </div>

    <button id="verifyButton" onclick="verifyEmailChange()">
      Confirm Email Change
    </button>

  </div>


  <div id="msg" class="msg"></div>

</div>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyBRSkmZXbTPNupefSmjXvlKLDNsaeQ2zag",
  authDomain:"dynopay-2513c.firebaseapp.com",
  databaseURL:"https://dynopay-2513c-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const auth = firebase.auth();
const db = firebase.database();


// Ambil parameter Firebase dari URL

const params =
  new URLSearchParams(window.location.search);

const mode =
  params.get("mode");

const oobCode =
  params.get("oobCode");

const title =
  document.getElementById("title");

const description =
  document.getElementById("description");

const resetForm =
  document.getElementById("resetForm");

const emailVerify =
  document.getElementById("emailVerify");

const msg =
  document.getElementById("msg");


// Jika tidak ada kode Firebase

if(!oobCode){

  resetForm.style.display = "none";
  emailVerify.style.display = "none";

  title.innerText = "Invalid Link";

  description.innerText =
    "This link is invalid or has expired.";

  msg.innerHTML =
    "<span class='error'>Invalid or expired link.</span>";

}


// MODE: VERIFY AND CHANGE EMAIL

else if(mode === "verifyAndChangeEmail"){

  resetForm.style.display = "none";
  emailVerify.style.display = "block";

  title.innerText =
    "Change Email";

  description.innerText =
    "Confirm the new email address for your Dynotic account.";

  // Cek kode Firebase terlebih dahulu

  auth.checkActionCode(oobCode)

    .then(info => {

      /*
       * Firebase memberikan email baru
       * melalui data action code.
       */

      const email =
        info.data.email || info.data.newEmail || "";

      document.getElementById("newEmail").innerText =
        email;

    })

    .catch(error => {

      console.error(error);

      emailVerify.style.display = "none";

      msg.innerHTML =
        "<span class='error'>" +
        "This email change link is invalid or has expired." +
        "</span>";

    });

}


// MODE: RESET PASSWORD

else if(mode === "resetPassword"){

  resetForm.style.display = "block";
  emailVerify.style.display = "none";

}


// MODE LAIN / FALLBACK

else{

  resetForm.style.display = "none";
  emailVerify.style.display = "none";

  title.innerText =
    "Invalid Action";

  description.innerText =
    "This account action is not supported.";

  msg.innerHTML =
    "<span class='error'>" +
    "Invalid Firebase action." +
    "</span>";

}


// ================================
// RESET PASSWORD
// ================================

function resetPassword(){

  const pass =
    document.getElementById("password").value;

  const confirm =
    document.getElementById("confirm").value;

  const button =
    document.getElementById("resetButton");


  if(!pass){

    msg.innerHTML =
      "<span class='error'>" +
      "Please enter your new password." +
      "</span>";

    return;
  }


  if(pass.length < 6){

    msg.innerHTML =
      "<span class='error'>" +
      "Password must be at least 6 characters." +
      "</span>";

    return;
  }


  if(pass !== confirm){

    msg.innerHTML =
      "<span class='error'>" +
      "Passwords do not match." +
      "</span>";

    return;
  }


  button.disabled = true;
  button.innerText = "Processing...";

  msg.innerText = "Updating password...";


  auth.confirmPasswordReset(oobCode, pass)

    .then(() => {

      msg.innerHTML =
        "<span class='success'>" +
        "Password updated successfully. Redirecting..." +
        "</span>";

      setTimeout(() => {

        location.href = "../login";

      },2000);

    })

    .catch(error => {

      console.error(error);

      let text =
        "Failed to reset password.";

      if(error.code === "auth/expired-action-code"){

        text =
          "This reset link has expired.";

      }

      else if(error.code === "auth/invalid-action-code"){

        text =
          "This reset link is invalid or has already been used.";

      }

      else if(error.code === "auth/weak-password"){

        text =
          "Password is too weak.";

      }

      else if(error.message){

        text = error.message;

      }

      msg.innerHTML =
        "<span class='error'>" +
        text +
        "</span>";

      button.disabled = false;
      button.innerText = "Reset Password";

    });

}


// ================================
// VERIFY CHANGE EMAIL
// ================================

function verifyEmailChange(){

  const button =
    document.getElementById("verifyButton");

  button.disabled = true;
  button.innerText = "Processing...";

  msg.innerText =
    "Confirming email change...";


  /*
   * Firebase menyelesaikan action:
   *
   * verifyAndChangeEmail
   */

  auth.applyActionCode(oobCode)

    .then(async () => {

      /*
       * Jika user masih login di browser ini,
       * kita sinkronkan email ke database.
       */

      const user =
        auth.currentUser;

      if(user){

        await db
          .ref("users/" + user.uid)
          .update({
            email:user.email
          });

      }


      msg.innerHTML =
        "<span class='success'>" +
        "Email successfully changed." +
        "<br><br>" +
        "Your Dynotic account now uses the new email address." +
        "</span>";

      button.innerText =
        "Email Updated";


      setTimeout(() => {

        location.href = "../account";

      },2000);

    })

    .catch(error => {

      console.error(error);

      let text =
        "Failed to confirm email change.";

      if(error.code === "auth/expired-action-code"){

        text =
          "This email change link has expired.";

      }

      else if(error.code === "auth/invalid-action-code"){

        text =
          "This email change link is invalid or has already been used.";

      }

      else if(error.code === "auth/email-already-in-use"){

        text =
          "This email is already being used by another account.";

      }

      else if(error.message){

        text =
          error.message;

      }

      msg.innerHTML =
        "<span class='error'>" +
        text +
        "</span>";

      button.disabled = false;
      button.innerText =
        "Confirm Email Change";

    });

}

</script>

</body>
</html>
